":"F","e":"错误。狭义的保险仅指商业保险；社会保险与商业保险并列，同属广义保险范畴，把社会保险计入狭义保险，扩大了狭义保险的外延。"},{"id":109,"ch":1,"kp":"1.1 保险的含义","t":"j","q":"从风险管理的角度看，保险是经济单位避免风险的一种方法。","o":[],"a":"F","e":"错误。从风险管理角度看，保险是经济单位转移风险的方法，而不是避免风险；避免风险意味着不从事相关活动，与保险集合多数单位分担损失的性质不同。"},{"id":110,"ch":1,"kp":"1.1 保险的含义","t":"j","q":"从法律角度来看，保险是在承保风险发生或保险合同约定条件成就时，一方同意补偿另一方的一种合同安排，同意提供补偿的一方是保险人，接受补偿的另一方是被保险人（或受益人）。","o":[],"a":"T","e":"正确。从法律角度看，保险是一种合同安排：投保人交付保险费，保险人在承保风险发生或约定条件成就时补偿另一方；提供补偿的一方为保险人，接受补偿的为被保险人或受益人。"},{"id":111,"ch":1,"kp":"1.2 保险的特征","t":"s","q":"下列属于保险自身特性的是（    ）。","o":["社会性","射幸性","商品性","可测性"],"a":"C","e":"选C。商品性体现保险以交换方式提供保障，是保险自身的特性。社会性讲保险的外部效应，射幸性讲合同履行的不确定性，可测性讲风险的可测定，均非保险自身特性，故A、B、D不选。"},{"id":112,"ch":1,"kp":"1.2 保险的特征","t":"s","q":"社会保险主要内容包括（    ），","o":["基本医疗保险","工伤保险","失业保险","以上都是"],"a":"D","e":"选D。社会保险主要包括基本养老、基本医疗、工伤、失业、生育保险，基本医疗保险、工伤保险、失业保险都只是其中一项，D概括完整，故A、B、C不选。"},{"id":113,"ch":1,"kp":"1.2 保险的特征","t":"s","q":"与社会保险相比，人身保险的经营主体为（    ）。","o":["商业保险公司","当地社会保险事业管理局","社会保险基金管理中心","以上都可以"],"a":"A","e":"选A。人身保险由商业保险公司经营，按合同自愿、以营利为目的；当地社会保险事业管理局、社会保险基金管理中心是社会保险的经办机构，故B、C、D错误。"},{"id":114,"ch":1,"kp":"1.2 保险的特征","t":"s","q":"社会保险是依法实施的（    ）。","o":["契约行为","逐利行为","政府行为","自愿行为"],"a":"C","e":"选C。社会保险由国家依法强制实施，属于政府行为，不以营利为目的，也不以自愿为原则。契约行为、逐利行为、自愿行为都是商业保险的特征，故A、B、D错误。"},{"id":115,"ch":1,"kp":"1.2 保险的特征","t":"s","q":"社会保险的保费，通常是（    ）共同负担的。","o":["个人、政府","企业、政府","个人、企业","个人、企业、政府"],"a":"D","e":"选D。社会保险的保费通常由个人、企业（单位）和政府三方共同负担，体现互济性与国家责任。仅由两方负担的表述不完整，故A、B、C错误。"},{"id":116,"ch":1,"kp":"1.2 保险的特征","t":"s","q":"保险与救济同为借助他人安定自身经济生活的一种方法。但二者根本性质是不同的，（    ）","o":["提供保障的结果不同","提供保障的目的不同","提供的保障水平不同","提供保障的资金去向不同"],"a":"C","e":"选C。保险与救济同为借助他人安定自身经济生活的方法，但保险按合同和对价提供保障，水平较高且可靠；救济是无偿的临时给予，保障水平低，二者根本区别在保障水平，故A、B、D不选。"},{"id":117,"ch":1,"kp":"1.2 保险的特征","t":"s","q":"下列关于保险与救济说法错误的是（    ）。","o":["救济提供的保障是可靠的","被救济方无须为获得救济而承担任何义务","保险保障是一种商业行为","救济是一种单纯的临时给予"],"a":"A","e":"选A，该项说法错误。救济是无偿的临时给予，任何一方都不受约束，其保障只能是临时的、不可靠的，故\"救济提供的保障是可靠的\"表述错误。B、C、D均符合保险与救济的比较。"},{"id":118,"ch":1,"kp":"1.2 保险的特征","t":"s","q":"保险与储蓄都是以现在的剩余作未来所需的准备。下列关于保险与储蓄的关系说法正确的是（    ）。","o":["消费对象相同","技术要求相同","行为性质不同","资金来源不同"],"a":"C","e":"选C。保险与储蓄的关系中，二者行为性质不同：保险是多数人互助分摊风险的合同行为，储蓄是个体自助的积累行为。消费对象、技术要求、资金来源并非二者的相同点，故A、B、D不选。"},{"id":119,"ch":1,"kp":"1.2 保险的特征","t":"s","q":"保险与储蓄的相同之处在于（    ）。","o":["消费对象相同","都是以现在的剩余作未来所需的准备","保险与储蓄都是为应对经济损失","技术要求相同"],"a":"B","e":"选B。保险与储蓄的相同之处在于都以现在的剩余作未来所需的准备，都是未雨绸缪的财务安排。二者在消费对象、技术要求上并不相同，故A、C、D不选。"},{"id":120,"ch":1,"kp":"1.2 保险的特征","t":"m","q":"保险的特性包括（    ）。","o":["契约性","经济性","商品性","可测性"],"a":"ABC","e":"选ABC。保险的特性包括契约性、经济性、商品性：以合同建立关系、属经济活动、以商品交换形式提供保障。可测性是保险经营对风险的要求，不属于保险特性，故D不选。"},{"id":121,"ch":1,"kp":"1.2 保险的特征","t":"m","q":"人身保险与社会保险的区别在于（    ）。","o":["保障功能不同","保费负担不同","保障对象不同","经营主体不同"],"a":"ABD","e":"选ABD。人身保险与社会保险在保障功能、保费负担、经营主体上不同：社会保险保基本生活、由多方负担、政府经办；人身保险保障多层次、投保人负担、商业公司经营。两者都以人的生命和身体为保障对象，本题不把保障对象列为区别，故C不选。"},{"id":122,"ch":1,"kp":"1.2 保险的特征","t":"m","q":"人身保险与社会保险的共同点主要体现在（    ）。","o":["两类保险的保障功能相同","同以社会再生产的人身要素为对象","两类保险的行为依据相同","两类保险的存在前提相同"],"a":"BD","e":"选BD。共同点在于同以社会再生产的人身要素为对象，且都以人身风险的存在为前提。保障功能并不相同，行为依据也不同：社会保险依法强制，人身保险依合同自愿，故A、C不选。"},{"id":123,"ch":1,"kp":"1.2 保险的特征","t":"m","q":"社会保险的主要内容包括（    ）。","o":["基本养老保险","工伤保险","失业保险","生育保险"],"a":"ABCD","e":"选ABCD。社会保险主要包括基本养老保险、基本医疗保险、工伤保险、失业保险和生育保险，四项均在范围内，共同构成社会保险的项目体系。"},{"id":124,"ch":1,"kp":"1.2 保险的特征","t":"m","q":"下列关于人身保险与社会保险的说法正确的是（    ）。","o":["社会保险的保费通常是由个人和政府两方共同负担的","人身保险是依法实施的契约行为","人身保险的经营主体必须是商业保险公司","社会保险的给付标准和遵循的原则是同一的"],"a":"CD","e":"选CD。人身保险的经营主体必须是商业保险公司，社会保险的给付标准和遵循原则是同一的。社会保险保费通常由个人、企业、政府共同负担，故A错；人身保险是自愿的商业合同行为，故B错。"},{"id":125,"ch":1,"kp":"1.2 保险的特征","t":"m","q":"关于保险与储蓄的说法，正确的是（    ）。","o":["保险集合多数面临同质风险的单位和个人分摊少数单位和个人的损失","储户要得到预期的利益即储存的本金和利息，必须完全达到了约定的存储期限","储蓄的主要目的是应付各种风险事故造成的经济损失","保险是一种互助行为"],"a":"ABD","e":"选ABD。保险集合多数面临同质风险的单位和个人分摊少数人的损失，属互助行为；储蓄须存满约定期限才能取得本金和利息。储蓄主要目的是安排未来生活而非应付风险损失，故C不选。"},{"id":126,"ch":1,"kp":"1.2 保险的特征","t":"j","q":"从保险的经济上看，其保障的根本目的，无论是从宏观的角度还是围观的角度，都是为了分散风险。","o":[],"a":"F","e":"错误。从经济上看，保险保障的根本目的是通过分散风险为被保险人提供经济保障，宏观上稳定社会经济，微观上补偿损失；分散风险只是手段，不能等同于根本目的。"},{"id":127,"ch":1,"kp":"1.2 保险的特征","t":"j","q":"人身保险与社会保险的保险标的都是人的身体或寿命。","o":[],"a":"T","e":"正确。人身保险与社会保险的保险标的都是人的身体或寿命，均以人的生命和健康为保障对象，这是二者的共同点之一，区别在于保障范围、经营主体和保费负担。"},{"id":128,"ch":1,"kp":"1.2 保险的特征","t":"j","q":"社会保险的保障目标是通过社会保险金的支付保障社会成员的基本生活需要，保障水平相对较高。","o":[],"a":"F","e":"错误。社会保险的保障目标是保障社会成员的基本生活需要，其保障水平相对较低；保障水平较高的多层次保障由商业人身保险提供，\"相对较高\"的说法与事实不符。"},{"id":129,"ch":1,"kp":"1.2 保险的特征","t":"j","q":"救济是一种单纯的临时给予，任何一方都不受约束，所得到的保障只能是临时的，而且也是不可靠的。","o":[],"a":"T","e":"正确。救济是一种单纯的无偿临时给予，给付方与接受方都不受合同约束，因此所得的保障只是临时的，也是不可靠的，这正是救济与保险的重要区别。"},{"id":130,"ch":1,"kp":"1.3 保险的要素","t":"s","q":"符合保险人承保条件的特定风险是（    ）。","o":["纯粹风险","可保风险","动态风险","风险事故"],"a":"B","e":"选B。可保风险是指符合保险人承保条件的特定风险，具备大量、同质、偶然、可测等条件。纯粹风险、动态风险是风险的分类，风险事故是致损原因，均非承保条件的表述，故A、C、D错误。"},{"id":131,"ch":1,"kp":"1.3 保险的要素","t":"s","q":"保险的过程是（    ）。","o":["风险的集合过程","风险的分散过程","既是风险的集合过程，又是风险的分散过程","以上都不对"],"a":"C","e":"选C。保险的过程既是风险的集合过程，即集合多数同质风险单位，又是风险的分散过程，即在全体投保人之间分摊损失，二者是同一过程的两面，故A、B、D均不完整。"},{"id":132,"ch":1,"kp":"1.3 保险的要素","t":"s","q":"如果风险为不同质风险，那么（    ）发生的概率就不相同。","o":["风险因素","风险事故","损失","保险赔偿"],"a":"C","e":"选C。不同质风险意味着各风险单位在种类、品质、性能、价值等方面存在差异，因而各单位发生损失的概率不相同，难以按同一费率集合分摊。风险因素、风险事故是风险的构成要素，保险赔偿是承保后的结果，均不是这里比较概率的对象。"},{"id":133,"ch":1,"kp":"1.3 保险的要素","t":"s","q":"根据大数法则的要求，在厘定保险费率时，保额损失率指标必须有足够的年数，一般至少需要有连续（    ）以上的资料。","o":["3年","4年","5年","6年"],"a":"C","e":"选C。按大数法则，厘定费率时保额损失率指标须有足够年数，一般至少需要连续5年以上的资料，年数过少会使费率缺乏稳定性。3年、4年、6年均不符合\"至少\"的表述。"},{"id":134,"ch":1,"kp":"1.3 保险的要素","t":"s","q":"保险准备金是指保险人为保证其如约履行保险赔偿或给付义务，根据政府有关法律规定或业务特定需要，从（    ）或盈余中提取的与所承担的保险责任相对应的一定数量的基金。","o":["营业收入","保费收入","毛利润","净利润"],"a":"B","e":"选B。保险准备金是保险人从保费收入或盈余中提取的、与其承担的保险责任相对应的基金，提取来源首先是保费收入。营业收入、毛利润、净利润不是教材所指提取口径，故A、C、D错误。"},{"id":135,"ch":1,"kp":"1.3 保险的要素","t":"s","q":"保险人为保证其如约覆行保险赔偿或给付义务，根据政府有关法律规定或业务特定需要，从保费收入或盈余中提取的与其所承担的保险责任相对应的一定数量的基金称为（    ）。","o":["保险后备金","保险储金","保险准备金","保险公积金"],"a":"C","e":"选C。题干所述即保险准备金的定义：为保证如约履行赔偿或给付义务，依法或按业务需要从保费收入或盈余中提取、与所承担保险责任相对应的基金。保险后备金、储金、公积金均非此概念。"},{"id":136,"ch":1,"kp":"1.3 保险的要素","t":"s","q":"保险准备金的主要形式不包括（    ）。","o":["总准备金","未到期责任准备金","寿险责任准备金","财险责任准备金"],"a":"D","e":"选D。保险准备金的主要形式包括总准备金、未到期责任准备金、寿险责任准备金和未决赔款准备金；\"财险责任准备金\"不是规范的准备金分类名称，故A、B、C不选。"},{"id":137,"ch":1,"kp":"1.3 保险的要素","t":"s","q":"保险关系存在的形式是（    ）。","o":["保险合同","保险利益","保险标的","保险责任"],"a":"A","e":"选A。保险关系存在的形式是保险合同，双方的权利义务通过合同条款固定下来。保险利益是保险关系存在的本质，保险标的与保险责任分别是保障对象和责任范围，故B、C、D不选。"},{"id":138,"ch":1,"kp":"1.3 保险的要素","t":"m","q":"保险费率的厘定要遵循一些基本原则，即（    ）。","o":["公平","合理","适度","稳定"],"a":"ABCD","e":"选ABCD。保险费率的厘定要遵循公平、合理、适度、稳定四项原则：公平对待投保人、费率与风险相适应、总体水平适度、保持相对稳定，四项均为基本原则。"},{"id":139,"ch":1,"kp":"1.3 保险的要素","t":"m","q":"保险准备金的形式主要有（    ）。","o":["财险责任准备金","寿险责任准备金","未到期责任准备金","未决赔款准备金"],"a":"BCD","e":"选BCD。保险准备金的主要形式有寿险责任准备金、未到期责任准备金和未决赔款准备金，分别对应寿险保单责任、未满期风险与已发生未赔付赔案。财险责任准备金不是规范分类，故A不选。"},{"id":140,"ch":1,"kp":"1.3 保险的要素","t":"m","q":"下列选项说法正确的是（    ）。","o":["保险的过程，既是风险的集合过程，又是风险的分散过程","根据概率论和大数法则，集合的风险标的越多，风险就越集中，损失发生的频率也就越有规律性和相对稳定性","如果风险为不同质风险，损失发生的概率也可能相同","风险的大量性和同质性是保险风险集合和分散的前提条件"],"a":"AD","e":"选AD。保险既是风险的集合过程又是分散过程；风险的大量性和同质性是集合与分散的前提。集合标的越多风险越分散而非越集中，不同质风险损失概率也不相同，故B、C错误。"},{"id":141,"ch":1,"kp":"1.3 保险的要素","t":"m","q":"关于保险合同的订立，下列说法正确的是（    ）。","o":["保险合同是体现保险关系存在的本质","保险合同是保险双方当事人履行各自权利与义务的依据","保险双方当事人的权利与义务是相互对应的","保险合同的订立是保险的要素之一"],"a":"BCD","e":"选BCD。保险合同是双方履行各自权利与义务的依据，双方权利义务相互对应，订立合同是保险的要素之一。体现保险关系存在本质的是保险利益，故A混淆形式与本质，不选。"},{"id":142,"ch":1,"kp":"1.3 保险的要素","t":"m","q":"关于保险的要素，说法正确的是（    ）。","o":["保险的过程既包括风险的集合过程，又包括风险的分散过程","可保风险是符合投保人投保条件的特定风险","保险准备金的建立是保险要素之一","保险在形式上是一种商品交换行为，实质上是一种经济保障活动"],"a":"AC","e":"选AC。保险的过程兼有风险的集合与分散，建立保险准备金是保险要素之一。可保风险是符合保险人承保条件的风险而非投保条件，故B错；D不是关于保险要素的规范表述，故不选。"},{"id":143,"ch":1,"kp":"1.3 保险的要素","t":"j","q":"可保风险的条件不会随着保险技术的发展和时间的推移产生变化。","o":[],"a":"F","e":"错误。可保风险的条件不是固定不变的，随着保险技术发展和再保险、资本市场工具的创新，过去不可保的风险（如巨灾风险）逐渐变为可保，\"不会变化\"的表述错误。"},{"id":144,"ch":1,"kp":"1.3 保险的要素","t":"j","q":"所谓的同质风险是指风险单位在种类、品质、性能、价值等方面大体相近。","o":[],"a":"T","e":"正确。同质风险是指各风险单位在种类、品质、性能、价值等方面大体相近，从而损失概率相对稳定、可以集合分摊，这是保险集合与分散风险的前提条件之一。"},{"id":145,"ch":1,"kp":"1.3 保险的要素","t":"j","q":"保险特殊账户是保险人为保证其如约履行保险赔偿或给付义务，从保费收入或盈余中提取的与其所承担的保险责任相对应的一定数量的基金。","o":[],"a":"F","e":"错误。题干所述是保险准备金的定义，而不是\"保险特殊账户\"；保险准备金从保费收入或盈余中提取、与所承担保险责任相对应，用于保证如约履行赔偿或给付义务。"},{"id":146,"ch":1,"kp":"2.1 保险法的概念","t":"s","q":"社会保险法属于（    ）。","o":["保险业法","保险公法","保险私法","保险特别法"],"a":"B","e":"选B。社会保险法调整国家、用人单位与个人之间的社会保险关系，体现国家干预，属于保险公法。保险业法虽也属公法，但与题干所指的法律部门不对应；私法、特别法亦不符，故A、C、D错误。"},{"id":147,"ch":1,"kp":"2.1 保险法的概念","t":"s","q":"保险法中，如保险金额不得超过保险价值，超过保险价值的，超过的部分无效的规定等属于（    ）。","o":["保险法的社会性","保险法的强制性","保险法的技术性","保险法的伦理性"],"a":"B","e":"选B。保险金额不得超过保险价值、超过部分无效，属于强制性规范，体现保险法的强制性。社会性、技术性、伦理性分别指社会影响、精算技术要求与道德风险防范，故A、C、D错误。"},{"id":148,"ch":1,"kp":"2.1 保险法的概念","t":"s","q":"保险合同法属于（    ）。","o":["保险私法","保险业法","保险特别法","社会保险法"],"a":"A","e":"选A。保险合同法调整平等主体之间的合同关系，属保险私法。保险业法是保险监管法，保险特别法、社会保险法均不属私法范畴，故B、C、D错误。"},{"id":149,"ch":1,"kp":"2.1 保险法的概念","t":"m","q":"保险公法主要包括（    ）。","o":["保险业法","保险合同法","保险特别法","社会保险法"],"a":"AD","e":"选AD。保险公法主要包括保险业法和社会保险法，二者都体现国家干预与强制。保险合同法属保险私法，保险特别法不在公法列举之列，故B、C不选。"},{"id":150,"ch":1,"kp":"2.1 保险法的概念","t":"j","q":"保险行为是一种射幸行为，有导致道德危险发生的可能。因此要求保险法具有伦理性。","o":[],"a":"T","e":"正确。保险行为具有射幸性，给付与对待给付之间并不等价，容易诱发道德危险，因此保险法要求最大诚信、保险利益等规则，体现出伦理性。"},{"id":151,"ch":1,"kp":"2.1 保险法的概念","t":"j","q":"形式意义上的保险法，除了《保险法》以外，还包括有关保险行政法规、规章以及中国政府承诺遵守的有关保险法的国际条约和国际惯例等。","o":[],"a":"F","e":"错误。形式意义上的保险法仅指《保险法》法典本身；把保险行政法规、规章以及国际条约和国际惯例包括在内的，是实质意义上的保险法，题干把两者颠倒了。"},{"id":152,"ch":1,"kp":"2.2 保险法的体例","t":"s","q":"世界上第一部单行的海上保险法是（    ）。","o":["《维斯比海商法》","《中国人民共和国海商法》","《1906年海上保险法》","《保险及海损条例》"],"a":"C","e":"选C。1906年英国《海上保险法》是世界上第一部单行的海上保险法，系统总结了海上保险惯例。维斯比海商法、《保险及海损条例》均不具有这一地位，故A、B、D错误。"},{"id":153,"ch":1,"kp":"2.2 保险法的体例","t":"s","q":"现代保险法在内容上具有二元性特点，主要用于规定政府对公司的监督和管理关系的是（    ）。","o":["保险合同法","保险业法","保险特别法","社会保险法"],"a":"B","e":"选B。现代保险法内容具有二元性：保险业法规定政府对保险公司的监督和管理关系，保险合同法调整当事人之间的合同关系。特别法、社会保险法不属监管法，故A、C、D错误。"},{"id":154,"ch":1,"kp":"2.2 保险法的体例","t":"m","q":"保险业法立法体例的模式包括（    ）。","o":["分别立法","惯例立法","合并立法","成文立法"],"a":"AC","e":"选AC。保险业法的立法体例分为分别立法与合并立法两种模式：前者单独制定保险业监督法，后者将保险合同规范与业法合并于一部法典。惯例立法、成文立法不是体例划分，故B、D不选。"},{"id":155,"ch":1,"kp":"2.2 保险法的体例","t":"j","q":"《维斯比海商法》是近代史上第一部国家制定的海商法。","o":[],"a":"F","e":"错误。《维斯比海商法》是海上贸易中形成的习惯法汇编，并非由国家制定的成文法，\"近代史上第一部国家制定的海商法\"的表述与其性质不符。"},{"id":156,"ch":1,"kp":"2.3我国保险法律制度的演进","t":"s","q":"（  ）年我国第一部保险法颁布。","o":["1992","1995","2001","2004"],"a":"B","e":"选B。1995年《中华人民共和国保险法》颁布，是我国第一部保险基本法，此后经多次修订。1992年、2001年、2004年均不是首部保险法颁布年份，故A、C、D错误。"},{"id":157,"ch":1,"kp":"2.3我国保险法律制度的演进","t":"s","q":"经修订现施行的《中华人民共和国保险法》，颁布施行时间是（    ）。","o":["2002年10月28日","2008年9月1日","2009年2月28日","2009年10月1日"],"a":"D","e":"选D。现行《保险法》于2009年修订公布，自2009年10月1日起施行，对应选项D。A为2002年10月28日、B为2008年9月1日、C为2009年2月28日，均非现行保险法施行时间，故不选。"},{"id":158,"ch":1,"kp":"2.3我国保险法律制度的演进","t":"j","q":"1995年《中华人民共和国保险法》是我国建国以来第一部保险基本法。","o":[],"a":"T","e":"正确。1995年颁布的《中华人民共和国保险法》是我国建国以来第一部保险基本法，奠定了保险合同规范与保险业监管合于一体的立法体例。"},{"id":159,"ch":1,"kp":"2.3我国保险法律制度的演进","t":"j","q":"1999年《中华人民共和国海事诉讼特别程序法》第一次以法律的形式对海上保险作了明确的规定。","o":[],"a":"F","e":"错误。1999年《海事诉讼特别程序法》是程序法，规定海事诉讼程序，并非对海上保险作实体规定；海上保险的实体规范由《海商法》规定，题干定性错误。"},{"id":160,"ch":1,"kp":"3.1保险的分类","t":"s","q":"以财产及其有关的经济利益和损害赔偿责任为保险标的的保险是（    ）。","o":["广义的财产保险","狭义的财产保险","商业保险","非商业保险"],"a":"A","e":"选A。以财产及其有关的经济利益和损害赔偿责任为保险标的的是广义财产保险，包括财产损失保险、责任保险和信用保证保险。狭义财产保险仅指财产损失保险，故B、C、D错误。"},{"id":161,"ch":1,"kp":"3.1保险的分类","t":"s","q":"财产保险业务不包括（    ）。","o":["雇主责任保险","收入补偿保险","机器损坏保险","出口信用保险"],"a":"B","e":"选B。财产保险包括财产损失保险、责任保险和信用保证保险，雇主责任险、机器损坏险、出口信用险均在其中；收入补偿保险即失能收入损失保险，属健康保险，故A、C、D不选。"},{"id":162,"ch":1,"kp":"3.1保险的分类","t":"s","q":"强制保险的实施不包括（    ）。","o":["由法律限定保险标的与受益人","由法律限定保险标的","由法律限定保险标的与保险人","以上所有都属于强制保险实施方式"],"a":"A","e":"选A。强制保险的实施方式通常是由法律限定保险标的，或同时限定保险标的与保险人，不包括由法律限定受益人。B、C均属强制保险的实施方式，故本题选A。"},{"id":163,"ch":1,"kp":"3.1保险的分类","t":"s","q":"下列属于强制保险的是（    ）。","o":["商业养老保险","医疗费用保险","企业财产保险","机动车交通事故责任强制保险"],"a":"D","e":"选D。机动车交通事故责任强制保险由法律规定强制投保，属强制保险。商业养老保险、医疗费用保险、企业财产保险均按自愿原则投保，故A、B、C错误。"},{"id":164,"ch":1,"kp":"3.1保险的分类","t":"s","q":"保险人将其所承保的风险和责任的一部分或全部转移给其他保险人的保险是（    ）。","o":["强制保险","共同保险","再保险","重复保险"],"a":"C","e":"选C。再保险是保险人将其所承保的风险和责任的一部分或全部转移给其他保险人。强制保险按实施方式划分，共同保险是多个保险人共同承保，重复保险是重复投保，故A、B、D错误。"},{"id":165,"ch":1,"kp":"3.1保险的分类","t":"s","q":"在再保险业务中，转让业务的是（    ）。","o":["原保险人","再保险人","投保人","被保险人"],"a":"A","e":"选A。再保险业务中转让业务的是原保险人，即分出公司；接受分保业务的是再保险人，即分入公司。投保人、被保险人是原保险合同的当事人，故B、C、D错误。"},{"id":166,"ch":1,"kp":"3.1保险的分类","t":"s","q":"在共同保险中，各保险人承保的金额总和（    ）保险标的的保险价值。","o":["小于","等于","大于","以上均可"],"a":"B","e":"选B。共同保险由多个保险人共同直接承保同一保险标的，各保险人承保金额的总和等于保险标的的保险价值，不发生超额承保，故A、C、D错误。"},{"id":167,"ch":1,"kp":"3.1保险的分类","t":"s","q":"共同保险与再保险在风险转嫁方式上的区别是，共同保险是保险人对原始风险的（    ）。","o":["全部转嫁","部分转嫁","纵向转嫁","横向转嫁"],"a":"D","e":"选D。共同保险是保险人对原始风险的横向转嫁，由多家保险人同时分担；再保险是纵向转嫁，由原保险人向再保险人再次转移。全部、部分转嫁只讲比例，故A、B、C错误。"},{"id":168,"ch":1,"kp":"3.1保险的分类","t":"s","q":"按照保险经营性质分类，工伤保险与失业保险属于（    ）。","o":["商业保险","非商业保险","强制保险","自愿保险"],"a":"B","e":"选B。按保险经营性质分为商业保险与非商业保险，工伤保险、失业保险属社会保险，不以营利为目的，属非商业保险。强制保险、自愿保险是按实施方式划分，故A、C、D不选。"},{"id":169,"ch":1,"kp":"3.1保险的分类","t":"m","q":"广义的财产保险是以（    ）为保险标的的保险。","o":["财产","经济利益","损害赔偿责任","疾病"],"a":"ABC","e":"选ABC。广义财产保险以财产、有关经济利益和损害赔偿责任为保险标的，涵盖财产损失保险、责任保险与信用保证保险。疾病属人的身体健康范畴，是人身保险的保障内容，故D不选。"},{"id":170,"ch":1,"kp":"3.1保险的分类","t":"m","q":"强制保险是由国家通过法律或行政手段强制实施的一种保险，下列属于强制保险的是（    ）。","o":["商业养老保险","工伤保险","失业保险","交强险"],"a":"BCD","e":"选BCD。工伤保险、失业保险由法律强制实施，交强险依法强制投保，三者均属强制保险。商业养老保险按自愿原则投保，属自愿保险，故A不选。"},{"id":171,"ch":1,"kp":"3.1保险的分类","t":"m","q":"强制保险的实施方式包括（    ）。","o":["保险标的与保险人均由法律限定","保险标的与保费由法律限定","保费由法律限定","保险标的由法律限定"],"a":"AD","e":"选AD。强制保险的实施方式包括保险标的与保险人均由法律限定、仅保险标的由法律限定两类。保费由法律限定、保险标的与保费由法律限定不是教材列举的实施方式，故B、C不选。"},{"id":172,"ch":1,"kp":"3.1保险的分类","t":"m","q":"下列关于再保险、共同保险与重复保险说法正确的是（    ）。","o":["再保险是保险人对原始风险的纵向转嫁","共同保险的各保险人承保金额的总和小于等于保险标的的保险价值","重复保险的保险金额之总和超过保险价值","共同保险和重复保险都是对原始风险的横向转嫁。"],"a":"ACD","e":"选ACD。再保险是原始风险的纵向转嫁；重复保险的保险金额总和超过保险价值；共同保险和重复保险都是对原始风险的横向转嫁。共同保险各保险人承保金额总和应等于保险价值，故B不选。"},{"id":173,"ch":1,"kp":"3.1保险的分类","t":"j","q":"广义的财产保险是以物质财产为保险标的的保险。","o":[],"a":"F","e":"错误。广义的财产保险以财产及其有关的经济利益和损害赔偿责任为保险标的，并不限于物质财产；仅以物质财产为标的的是狭义的财产保险，即财产损失保险。"},{"id":174,"ch":1,"kp":"3.1保险的分类","t":"j","q":"再保险业务中，接受分保业务的是原保险人，转让业务的是再保险人。","o":[],"a":"F","e":"错误。再保险业务中转让分出业务的是原保险人，接受分入业务的是再保险人，题干把分出方与分入方的角色颠倒，故错误。"},{"id":175,"ch":1,"kp":"3.1保险的分类","t":"j","q":"重复保险是由几个保险人联合直接承保同一保险标的、同一风险、同一保险利益的保险。","o":[],"a":"F","e":"错误。题干描述的是共同保险，即几个保险人联合直接承保同一标的、同一风险、同一利益。重复保险是投保人对同一标的、同一利益、同一事故分别与两个以上保险人订立合同且保额总和超过保险价值。"},{"id":176,"ch":1,"kp":"3.1保险的分类","t":"j","q":"共同保险是指投保人对同一保险标的、同一保险利益、同一保险事故分别向两个以上的保险人订立保险合同，且保险金额之总和超过保险价值的保险。","o":[],"a":"F","e":"错误。题干把共同保险与重复保险混淆：共同保险的保险金额总和不超过保险价值，各保险人按约定比例分担；保额总和超过保险价值的是重复保险。"},{"id":177,"ch":1,"kp":"3.1保险的分类","t":"j","q":"团体保险可以有效防止逆向选择。","o":[],"a":"T","e":"正确。团体保险以团体为投保单位、对团体成员统一承保，参保具有整体性，可避免个人按自身风险状况选择性投保，因而能有效防止逆选择。"},{"id":178,"ch":1,"kp":"3.2 保险的种类","t":"s","q":"特殊风险保险是（    ）的一种。","o":["财产损失保险","人身保险","责任保险","信用保证保险"],"a":"A","e":"选A。特殊风险保险如航天、核电站、石油开发保险，承保特殊标的或特殊风险，属财产损失保险的一种。人身保险、责任保险、信用保证保险的分类与之不符，故B、C、D错误。"},{"id":179,"ch":1,"kp":"3.2 保险的种类","t":"s","q":"（    ）是以被保险人的身体为保险标的，使被保险人在疾病或意外事故所致伤害时发生的费用或损失获得补偿的一种人身保险业务。","o":["人寿保险","健康保险","人身意外伤害保险","长期护理保险"],"a":"B","e":"选B。健康保险以被保险人的身体为保险标的，对被保险人因疾病或意外事故所致伤害发生的费用或损失给予补偿。人寿保险以生存或死亡为给付条件，意外伤害保险限于意外事故，故A、C、D不选。"},{"id":180,"ch":1,"kp":"3.2 保险的种类","t":"s","q":"根据《中华人民共和国保险法》，我国的商业保险分为（）。","o":["损害保险、人身保险","财产保险、人身保险","财产保险、人身保险、短期健康险","财产保险、人身保险、人身意外伤害保险"],"a":"B","e":"选B。根据《保险法》，我国商业保险分为财产保险和人身保险两大类，财产保险下含财产损失保险、责任保险、信用保证保险，人身保险含人寿、健康、意外伤害保险，故A、C、D错误。"},{"id":181,"ch":1,"kp":"3.2 保险的种类","t":"m","q":"下列属于保险种类的有（  ）。","o":["财产保险","人身保险","责任保险","信用保险"],"a":"ABCD","e":"选ABCD。财产保险与人身保险是基本分类，财产保险又分为财产损失保险、责任保险和信用保证保险，故责任保险、信用保险同样属于保险种类，四项均正确。"},{"id":182,"ch":1,"kp":"3.2 保险的种类","t":"j","q":"投保人投保自己的信用是信用保险。","o":[],"a":"F","e":"错误。投保人投保自己的信用或履约能力的是保证保险；信用保险是权利人投保债务人的信用风险。题干把保证保险与信用保险的投保对象弄反了。"},{"id":183,"ch":1,"kp":"3.2 保险的种类","t":"j","q":"我国保险业务的框架由财产损失保险、人寿保险、责任保险和信用保险四大种类构成。","o":[],"a":"F","e":"错误。我国保险业务的框架由财产保险和人身保险两大类构成，题干所列财产损失保险、责任保险、信用保险只是财产保险下的具体种类，人寿保险则属人身保险。"},{"id":184,"ch":1,"kp":"3.2 保险的种类","t":"j","q":"财产损失保险是以各类有形财产和无形财产为保险标的的财产保险。","o":[],"a":"F","e":"错误。财产损失保险以各类有形财产即物质财产为保险标的；无形财产中的责任风险、信用风险分别由责任保险、信用保证保险承保，故\"无形财产\"的表述错误。"},{"id":185,"ch":1,"kp":"3.2 保险的种类","t":"j","q":"责任保险是指以被保险人对第三者依法应承担的民事损害赔偿责任或经过特别约定的合同责任为保险标的的保险。","o":[],"a":"T","e":"正确。责任保险以被保险人对第三者依法应承担的民事损害赔偿责任或经特别约定的合同责任为保险标的，赔款最终用于填补第三者所受的损害。"},{"id":186,"ch":1,"kp":"4.保险的功能","t":"s","q":"保险的功能中，将保险业与其他行业区别开来的最根本的特征是（    ）。","o":["经济补偿功能","资金融通功能","社会管理功能","风险分散功能"],"a":"A","e":"选A。经济补偿功能是保险最根本的功能，也是保险业区别于其他行业的最根本特征。资金融通、社会管理是派生功能，风险分散是经营手段，故B、C、D不选。"},{"id":187,"ch":1,"kp":"4.保险的功能","t":"s","q":"根据《国务院关于保险业改革发展的若干意见》，下列不属于保险的功能的是（    ）。","o":["风险分散","经济补偿","资金融通","社会管理"],"a":"A","e":"选A。《国务院关于保险业改革发展的若干意见》把保险的功能概括为经济补偿、资金融通和社会管理三项，风险分散不在其中，故B、C、D不选。"},{"id":188,"ch":1,"kp":"4.保险的功能","t":"s","q":"保险的社会管理功能不包括（    ）。","o":["社会关系管理","社会责任管理","社会信用管理","社会风险管理"],"a":"B","e":"选B。保险的社会管理功能包括社会保障管理、社会风险管理、社会关系管理和社会信用管理，\"社会责任管理\"不在其列，故A、C、D不选。"},{"id":189,"ch":1,"kp":"4.保险的功能","t":"s","q":"保险的（    ）是通过保险的内在特性，促进经济社会的协调以及社会各领域的正常运转和有序发展。","o":["经济补偿功能","资金融通功能","社会管理功能","政策稳定功能"],"a":"C","e":"选C。社会管理功能是保险通过其内在特性，促进经济社会的协调以及社会各领域的正常运转和有序发展。经济补偿针对损失、资金融通针对资金配置，均不全面，故A、B、D错误。"},{"id":190,"ch":1,"kp":"4.保险的功能","t":"s","q":"保险介入灾害处理的全过程，逐渐改变了社会主体的行为模式，减少了社会摩擦，提高了社会运行效率，这是保险社会管理功能中的（    ）。","o":["社会保障管理","社会风险管理","社会关系管理","社会信用管理"],"a":"C","e":"选C。保险介入灾害处理全过程，充当社会主体之间的\"润滑剂\"，减少社会摩擦、降低交易成本、提高社会运行效率，体现社会管理功能中的社会关系管理，故A、B、D不选。"},{"id":191,"ch":1,"kp":"4.保险的功能","t":"s","q":"保险的三大功能是一个有机联系，相互作用的整体。其中，保险的（    ）是其他两大功能的基础。","o":["社会管理功能","资金融通功能","风险分散功能","经济补偿功能"],"a":"D","e":"选D。保险三大功能是有机联系的整体，其中经济补偿功能是资金融通功能和社会管理功能的基础，没有补偿带来的资金积累与保障效应，其他功能无从发挥，故A、B、C错误。"},{"id":192,"ch":1,"kp":"4.保险的功能","t":"m","q":"根据《国务院关于保险业改革发展的若干意见》，保险具有的功能包括（    ）。","o":["风险转移功能","资金融通功能","经济补偿功能","社会管理功能"],"a":"BCD","e":"选BCD。该意见将保险的功能概括为经济补偿功能、资金融通功能和社会管理功能。风险转移是保险的经营机制，不是三大功能之一，故A不选。"},{"id":193,"ch":1,"kp":"4.保险的功能","t":"m","q":"保险的社会管理功能包括（    ）。","o":["社会保障管理","社会风险管理","社会关系管理","社会信用管理"],"a":"ABCD","e":"选ABCD。保险的社会管理功能包括社会保障管理、社会风险管理、社会关系管理和社会信用管理四个方面，四项均在范围内。"},{"id":194,"ch":1,"kp":"4.保险的功能","t":"j","q":"资金融通功能是保险最根本的功能。","o":[],"a":"F","e":"错误。保险最根本的功能是经济补偿功能，资金融通功能是在补偿基础上派生并服务于赔偿或给付的，故\"资金融通功能是保险最根本的功能\"表述错误。"},{"id":195,"ch":1,"kp":"4.保险的功能","t":"j","q":"保险资金的融通应以保证保险的赔偿或给付为前提。","o":[],"a":"T","e":"正确。保险资金主要来源于保费和各项准备金，其融通运用必须以保证保险的赔偿或给付为前提，保持足够偿付能力，不能因投资而影响履约。"},{"id":196,"ch":1,"kp":"5.保险业的发展历程","t":"s","q":"火灾保险的原始制度“黑瑞普”制度和基尔特制度属于（    ）。","o":["相互保险制度","共同保险制度","重复保险制度","再保险制度"],"a":"A","e":"选A。\"黑瑞普\"制度和基尔特制度是火灾保险的原始形态，均以成员互助共济为基础，属相互保险制度，而不是共同保险、重复保险或再保险，故B、C、D错误。"},{"id":197,"ch":1,"kp":"5.保险业的发展历程","t":"s","q":"基尔特制度、公典制度和年金制度共同汇集演变而成（    ）。","o":["财产保险","人身保险","责任保险","信用保险"],"a":"B","e":"选B。基尔特制度、公典制度和年金制度共同汇集演变而成人身保险：基尔特提供死亡给付，公典与年金制度提供养老给付，共同奠定人身保险的基础。"},{"id":198,"ch":1,"kp":"5.保险业的发展历程","t":"s","q":"《1906年海上保险法》使（    ）成为世界海上保险的中心。","o":["英国","德国","法国","意大利"],"a":"A","e":"选A。1906年英国《海上保险法》系统总结了海上保险惯例，推动海上保险发展，使英国成为世界海上保险的中心。德国、法国、意大利均不符，故B、C、D错误。"},{"id":199,"ch":1,"kp":"5.保险业的发展历程","t":"s","q":"近代中国出现的第一家保险公司，也是外商在中国开设的第一家保险机构是（    ）。","o":["上海华商义和公司保险行","“仁和”保险公司","“济和”保险公司","广州保险公司"],"a":"D","e":"选D。近代中国出现的第一家保险公司，也是外商在中国开设的第一家保险机构，是广州保险公司。上海华商义和公司保险行是华商自办的第一家保险机构，故A、B、C不选。"},{"id":200,"ch":1,"kp":"5.保险业的发展历程","t":"s","q":"1949年，（    ）正式挂牌开业，这标志着中国现代保险事业的创立，开创了中国保险的新纪元。","o":["“仁和”保险公司","“济和”保险公司","中国人民保险公司","中国人寿保险公司"],"a":"C","e":"选C。1949年中国人民保险公司正式挂牌开业，标志着中国现代保险事业的创立，开创了中国保险的新纪元。仁和、济和是近代民族保险公司，故A、B、D错误。"},{"id":201,"ch":1,"kp":"5.保险业的发展历程","t":"s","q":"1693年，（    ）编制了世界上第一张生命表，精确地表示了每个年龄的人的死亡率，并首次将生命表用于计算人寿保险费率，为现代人寿保险奠定了数理基础。","o":["巴蓬","哈雷","牛顿","胡克"],"a":"B","e":"选B。1693年哈雷编制了世界上第一张生命表，精确表示每个年龄人口的死亡率，并首次用于计算人寿保险费率，为现代人寿保险奠定数理基础，故A、C、D错误。"},{"id":202,"ch":1,"kp":"5.保险业的发展历程","t":"s","q":"共同海损分摊制度最早出现在（ ），因而被公认为海上保险的萌芽","o":["汉谟拉比法典","罗地安海商法","海上保险法","责任保险"],"a":"B","e":"选B。共同海损分摊制度最早出现在《罗地安海商法》，因而被公认为海上保险的萌芽。汉谟拉比法典是早期成文法，但不是共同海损分摊制度的出处，故A、C、D不选。"},{"id":203,"ch":1,"kp":"5.保险业的发展历程","t":"s","q":"具有“现代保险之父”之称的是（     ）。","o":["埃德蒙·哈雷","切比雪夫","贝努利","巴蓬"],"a":"D","e":"选D。巴蓬因创办火灾保险、按房屋结构与风险差别计收保费，被称为\"现代保险之父\"。哈雷编制了生命表，切比雪夫、贝努利在概率论上有贡献，故A、B、C错误。"},{"id":204,"ch":1,"kp":"5.保险业的发展历程","t":"j","q":"“黑瑞普”制度和基尔特制度是火灾保险的原始形态。","o":[],"a":"T","e":"正确。\"黑瑞普\"制度和基尔特制度是火灾保险的原始形态：前者为团体成员互助分摊火灾损失，后者为行会成员间的互助，共同构成火灾保险的早期基础。"},{"id":205,"ch":1,"kp":"5.保险业的发展历程","t":"j","q":"具有”现代保险之父“之称的是巴蓬。","o":[],"a":"T","e":"正确。巴蓬创办火灾保险、按风险差别计收保费，奠定了近代火灾保险的经营基础，因而被誉为\"现代保险之父\"，题干表述与这一公认称谓一致。"},{"id":206,"ch":2,"kp":"1.1 保险合同的含义","t":"s","q":"《中国人民共和保险法》第10条第1款规定：“保险合同是（    ）与保险人约定保险权利义务关系的协议。”","o":["投保人","被保险人","受益人","保单持有人"],"a":"A","e":"选A。保险合同是投保人与保险人对保险权利义务关系作出的约定，投保人是合同当事人。被保险人、受益人是合同的关系人，不负缔约与缴费义务；保单持有人不是我国保险法的合同主体概念。"},{"id":207,"ch":2,"kp":"1.1 保险合同的含义","t":"s","q":"根据保险合同的约定，交付保险费是（    ）的基本义务。","o":["保险人","投保人","被保险人","受益人"],"a":"B","e":"选B。交付保险费是投保人的基本义务，因其是缔约并承担缴费义务的一方。保险人的基本义务是赔偿或给付保险金；被保险人的权利是请求保险金；受益人在人身险中仅享有保险金请求权，不承担缴费义务。"},{"id":208,"ch":2,"kp":"1.1 保险合同的含义","t":"s","q":"根据保险合同的约定，请求赔偿或给付保险金是（    ）的基本权利。","o":["保险人","投保人","被保险人","受益人"],"a":"C","e":"选C。请求赔偿或给付保险金是被保险人的基本权利，因其财产或人身受合同保障。投保人负有缴费义务，但请求权不归其享有；保险人是义务方；受益人仅在人身险中依指定享有独立的保险金请求权。"},{"id":209,"ch":2,"kp":"1.1 保险合同的含义","t":"m","q":"根据保险合同的约定，下列说法正确的是（    ）。","o":["收取保险费是保险人的基本义务","赔偿或给付保险金是保险人的基本义务","交付保险费是投保人的基本义务","请求赔偿或给付保险金是投保人的基本权利"],"a":"BC","e":"选BC。赔偿或给付保险金是保险人的基本义务，交付保险费是投保人的基本义务，二者互为对价。A项把收取保险费当作义务，实为保险人的权利；D项请求权属被保险人，投保人不享有。"},{"id":210,"ch":2,"kp":"1.1 保险合同的含义","t":"j","q":"保险合同是保险人与被保险人约定保险权利义务关系的协议。","o":[],"a":"F","e":"错误。题干把合同当事人写成“被保险人”，应为“投保人”。保险合同是投保人与保险人约定保险权利义务关系的协议，被保险人是受合同保障、享有保险金请求权的关系人。"},{"id":211,"ch":2,"kp":"1.1 保险合同的含义","t":"j","q":"交付保险费是投保人的基本义务，请求赔偿或给付保险金是被保险人的基本权利。","o":[],"a":"T","e":"正确。投保人因缔结合同而承担交付保险费的基本义务，被保险人因财产或人身受保障而享有请求赔偿或给付保险金的基本权利，二者主体不同，正是合同当事人与关系人的分工。"},{"id":212,"ch":2,"kp":"1.2 保险合同的特征","t":"s","q":"保险合同的特征不包括（    ）。","o":["保险合同是有偿合同","保险合同是有条件的单务合同","保险合同是附合合同","保险合同是射幸合同"],"a":"B","e":"选B。保险合同是附有条件的双务合同，而非“有条件的单务合同”，双方义务互为条件且以保险事故发生为履行条件。有偿、附合、射幸均为保险合同的特征，故B项表述不成立。"},{"id":213,"ch":2,"kp":"1.2 保险合同的特征","t":"s","q":"当事人因享有合同的权利而必须偿付相应的代价说明保险合同是（    ）。","o":["保障性合同","有条件的双务合同","射幸合同","有偿合同"],"a":"D","e":"选D。有偿合同指当事人享有合同权利须偿付相应代价，投保人以保险费换取保险保障即属此。保障性说的是保障期间，双务性说的是双方互负义务，射幸性说的是给付义务取决于偶然事故。"},{"id":214,"ch":2,"kp":"1.2 保险合同的特征","t":"s","q":"保险合同的保障性主要表现在：保险合同双方当事人一经达成协议，则从保险合同约定生效时起到终止时的整个期间，被保险人的（    ）受到保险人的保障。","o":["财产损失","人身健康","经济利益","风险事故"],"a":"C","e":"选C。保障性表现为合同约定生效至终止的整个期间，被保险人的经济利益受到保险人保障。财产损失、人身健康只是具体保险标的，风险事故是致损原因而非保障内容，均不足以概括。"},{"id":215,"ch":2,"kp":"1.2 保险合同的特征","t":"s","q":"保险合同的保障性的保障期是（    ）。","o":["保险合同订立时起到终止时","保险合同约定生效时到终止时","保险合同订立时到中止时","保险合同约定到中止时"],"a":"B","e":"选B。保障期自保险合同约定生效时起至终止时止。订立时合同尚未生效，不能作为保障起点；中止期间保障暂停，也不是正常保障期的终点，故A、C、D均不准确。"},{"id":216,"ch":2,"kp":"1.2 保险合同的特征","t":"s","q":"保险合同是（    ）。","o":["无条件的单务合同","无条件的双务合同","附有条件的单务合同","附有条件的双务合同"],"a":"D","e":"选D。保险合同是附有条件的双务合同：双方均负义务，且保险人赔付义务以保险事故发生为条件，投保人后续缴费也以合同有效为前提。单务合同只有一方负义务，与保险合同不符。"},{"id":217,"ch":2,"kp":"1.2 保险合同的特征","t":"s","q":"在保险合同中，被保险人要得到保险人对其保险标的给予保障的权利，就必须向保险人缴付保险费；而保险人收取保险费，就必须承担保险事故发生或符合合同约定时的赔偿或给付义务，这说明保险合同是（    ）。","o":["有偿合同","有条件的双务合同","附合合同","射幸合同"],"a":"B","e":"选B。题干强调双方义务互为条件、相互对应，故为有条件的双务合同。有偿性只说权利须付代价，附合性说条款由一方拟定，射幸性说给付不确定，均不能涵盖“互为条件”这一要点。"},{"id":218,"ch":2,"kp":"1.2 保险合同的特征","t":"s","q":"保险合同内容一般不是由当事人双方共同协商拟定，而是由一方当事人事先拟定，印就好格式条款供另一方当事人选择，另一方当事人只能作取舍决定，无权拟定合同的条文，这说明保险合同是（    ）。","o":["保障性合同","有条件的双务合同","附合合同","最大诚信合同"],"a":"C","e":"选C。合同内容由保险人一方预先拟定、投保人只能取舍，属附合合同。有偿性关注对价，双务性关注双方义务，保障性关注保障功能，都不涉及条款由谁拟定，故选C。"},{"id":219,"ch":2,"kp":"1.2 保险合同的特征","t":"s","q":"在保险合同中，投保人要取得保险的风险保障，必须支付相应的代价，即保险费；保险人要收取保险费，必须承诺承担保险保障责任，保险合同所具有的这种特征是（ ）。","o":["有偿性","保障性","双务性","附和性"],"a":"A","e":"选A。投保人以保险费换取风险保障、保险人以承担保障责任换取保费，体现权利与代价的对价关系，即有偿性。保障性指保障功能，双务性指互负义务，附和性指条款预先拟定，均不切题。"},{"id":220,"ch":2,"kp":"1.2 保险合同的特征","t":"s","q":"在保险合同的特征中，由于保险合同是（    ），投保人购买保险只能采纳保险人事先准备的附加条款等，导致了一些弊端的存在。","o":["有偿合同","有条件的双务合同","附合合同","射幸合同"],"a":"C","e":"选C。因保险合同是附合合同，条款与附加条款均由保险人单方预先拟就，投保人只能整体接受或拒绝，难以参与拟订，实务中遂产生条款偏袒保险人等弊端。"},{"id":221,"ch":2,"kp":"1.2 保险合同的特征","t":"s","q":"保险合同是（    ），即保险人的义务是否履行在合同订立时尚不确定。","o":["保障性合同","有条件的双务合同","附合合同","射幸合同"],"a":"D","e":"选D。射幸合同指合同效果在订约时不能确定，保险人是否赔付、赔付多少取决于偶然的保险事故。保障性、附合性、双务性都不能说明“义务履行在订约时不确定”这一要点。"},{"id":222,"ch":2,"kp":"1.2 保险合同的特征","t":"s","q":"保险合同是射幸合同，但保险合同的射幸性是就（    ）而言的。","o":["单个保险合同，有形保障","单个保险合同，有形保障和无形保障","所有保险合同，有形保障","所有保险合同，有形保障和无形保障"],"a":"A","e":"选A。保险合同的射幸性只就单个合同而言：单个合同可能多年缴费而无赔付。就所有合同整体看，保费与赔款依大数法则趋于平衡，不具射幸性；且射幸性只就有形保障而言。"},{"id":223,"ch":2,"kp":"1.2 保险合同的特征","t":"s","q":"下列关于保险合同的特征中，说法错误的是（    ）。","o":["保险合同的保障性包括有形保障和无形保障两种形式","保险合同是单务合同，而且是附有条件的双务合同","保险的随机性、不确定性决定了保险责任的不确定性，也决定了保险合同是射幸合同","保险合同是最大诚信合同"],"a":"B","e":"选B。B项错在“单务合同”：保险合同是附有条件的双务合同，双方互负义务。A项保障性含无形保障与有形保障，C项射幸性成因、D项最大诚信的表述均正确。"},{"id":224,"ch":2,"kp":"1.2 保险合同的特征","t":"m","q":"保险合同的特征包括（    ）。","o":["保险合同是有偿合同","保险合同是有条件单务合同","保险合同是确定性合同","保险合同是最大诚信合同"],"a":"AD","e":"选AD。保险合同是有偿合同，也是最大诚信合同。B项错在“单务”，应为附有条件的双务合同；C项错在“确定性”，保险合同是射幸合同，给付义务在订约时并不确定。"},{"id":225,"ch":2,"kp":"1.2 保险合同的特征","t":"m","q":"下列关于保险的特征说法正确的是（    ）。","o":["保险的保障性从保险合同订立时起到终止时生效","射幸合同时合同的效果在订约时不能确定的合同","保险合同的最大诚信原则是保险法中保险利益、如实告知义务等规定的法理基础","保险合同是无条件的双务合同"],"a":"BC","e":"选BC。B项射幸合同的定义、C项最大诚信作为保险利益与如实告知义务的法理基础均正确。A项错在保障性自合同约定生效时起算而非订立时；D项错在应为附条件的双务合同。"},{"id":226,"ch":2,"kp":"1.2 保险合同的特征","t":"j","q":"保险合同的有偿性主要体现在受益人要取得保险的风险保障，必须支付相应的代价，即保险费。","o":[],"a":"F","e":"错误。错在“受益人”：有偿性体现在投保人须支付保险费才能取得风险保障。受益人在人身保险中依指定无偿享有保险金请求权，并不承担缴费义务，不能成为有偿性的主体。"},{"id":227,"ch":2,"kp":"1.2 保险合同的特征","t":"j","q":"保险合同是附有条件的双务合同，投保人必须向保险人缴纳保险费以获得保险人对其保险标的的保障，保险人收取保险费后就必须承担保险事故发生或保险合同届满时的赔偿或给付义务。 （   ）","o":[],"a":"T","e":"正确。投保人缴费与保险人承担赔付义务互为条件，且保险人是否履行以保险事故发生或合同约定情形出现为前提，故属附有条件的双务合同，“双务”与“附条件”缺一不可。"},{"id":228,"ch":2,"kp":"1.3 保险合同的种类","t":"s","q":"按照（    ）分类，保险合同可分为财产保险合同与人身保险合同。","o":["保险标的","合同的性质","合同承担风险责任的方式","保险人的承保方式"],"a":"A","e":"选A。按保险标的分类，以财产及其有关利益为标的的是财产保险合同，以人的寿命和身体为标的的是人身保险合同。合同性质、承担风险责任的方式、承保方式都导出其他分类结果。"},{"id":229,"ch":2,"kp":"1.3 保险合同的种类","t":"s","q":"按照标的的分合以及变动情况分类，这一分类标准是（    ）特有的。","o":["人身保险合同","财产保险合同","补偿性保险合同","给付性保险合同"],"a":"B","e":"选B。按保险标的的分合及变动情况分为特定式、总括式、报告式、预约式（开口式），这是财产保险特有的分类，因只有财产标的才有可分合、可变动的问题，人身保险不适用。"},{"id":230,"ch":2,"kp":"1.3 保险合同的种类","t":"s","q":"在流动式保险合同中，投保人定期向保险人报告其财产的（    ），只要报告属实，发生保险责任事故损失，保险人就在约定最高责任限额内予以赔偿。","o":["折旧","实际价值","风险环境","潜在损失"],"a":"B","e":"选B。报告式（流动式）合同不固定保险金额，由投保人定期向保险人报告财产的实际价值，报告属实即在约定最高责任限额内赔偿。折旧、风险环境、潜在损失均非报告内容。"},{"id":231,"ch":2,"kp":"1.3 保险合同的种类","t":"s","q":"（    ）是指不规定财产保险金额，只预定一个保险人承担最高责任的限额的合同。","o":["特定式保险合同","总括式保险合同","报告式保险合同","预约式保险合同"],"a":"C","e":"选C。报告式合同不规定财产保险金额，只预定保险人承担责任的最高限额，由投保人定期报告财产价值。特定式按项目分别列明保额，总括式不分项，预约式（开口式）是不定期合同。"},{"id":232,"ch":2,"kp":"1.3 保险合同的种类","t":"s","q":"预约式保险合同是指保险人与投保人之间就一定的业务范围签订的无限期的保险合同，合同约定保险责任范围，保险财产范围，保险费结算办法及每一风险单位或每一地点的最高保额，预约式保险合同又叫作（    ）。","o":["特定式保险合同","总括式保险合同","流动式保险合同","开口式保险合同"],"a":"D","e":"选D。预约式合同是就一定业务范围签订的不定期合同，约定责任范围、财产范围、保费结算办法及每一风险单位或地点的最高保额，实务中又称开口式保险合同。"},{"id":233,"ch":2,"kp":"1.3 保险合同的种类","t":"s","q":"按照保险标的的分合以及变动情况分类，大型的周转性仓储业投保的最好选择是（    ）。","o":["特定式保险合同","总括式保险合同","报告式保险合同","预约式保险合同"],"a":"C","e":"选C。大型周转性仓储业库存进出频繁、价值变动大，逐笔确定保额不现实，适合投保报告式合同，定期报告库存实际价值，在最高限额内获赔。特定式、总括式、预约式均不便报告变动。"},{"id":234,"ch":2,"kp":"1.3 保险合同的种类","t":"s","q":"补偿性保险合同是指保险人的责任以（    ）为限，补偿被保险人的经济损失的合同。","o":["保险金额","保险利益","实际损失","重置成本"],"a":"A","e":"选A。补偿性合同以保险金额为赔偿的最高限度，在保险金额内按实际损失补偿被保险人。保险利益决定合同效力，实际损失是赔偿的计算依据，重置成本只是估价方式，均非“责任限度”。"},{"id":235,"ch":2,"kp":"1.3 保险合同的种类","t":"s","q":"按照合同的性质分类，补偿性保险合同（    ）。","o":["仅包括财产保险合同","仅包括人身保险合同","包括各类人身保险合同以及部分财产保险合同","包括各类财产保险合同以及部分人身保险合同"],"a":"D","e":"选D。按合同性质分为补偿性与给付性，补偿性合同包括各类财产保险合同以及部分人身保险合同，如医疗费用保险。仅限财产险或仅限人身险均不周延，医疗费用险即人身险中的补偿性合同。"},{"id":236,"ch":2,"kp":"1.3 保险合同的种类","t":"s","q":"按照合同的性质分类，医疗费用合同属于（    ）","o":["给付性保险合同","补偿性保险合同","定值保险合同","不定值保险合同"],"a":"B","e":"选B。医疗费用合同按被保险人实际支出的医疗费用在保额内补偿，不重复获利，属补偿性合同。给付性合同按约定定额给付，如人寿保险；定值、不定值是按保险价值是否事先确定所作的分类。"},{"id":237,"ch":2,"kp":"1.3 保险合同的种类","t":"s","q":"通常情况下，受损保险标的的实际价值以保险事故发生时当地同类财产的市场价格确定的保险合同类型是（    ）。","o":["定值保险合同","不定值保险合同","补偿性保险合同","给付性保险合同"],"a":"B","e":"选B。不定值合同订立时只列保险金额，不预先确定保险价值，事故发生后按当时当地同类财产市场价格核定实际损失，再在保额内赔偿。定值合同事先约定价值，补偿性、给付性属另一分类标准。"},{"id":238,"ch":2,"kp":"1.3 保险合同的种类","t":"s","q":"按照标的价值在订立合同时是否确定分类，大多数财产保险业务均采用（    ）的形式。","o":["定值保险合同","不定值保险合同","补偿性保险合同","给付性保险合同"],"a":"B","e":"选B。定值合同须事先约定保险价值，多适用于价值难以确定的财产，故大多数财产保险业务采用不定值合同，订立时仅列保险金额作为赔偿上限，事后按当时实际价值核定损失。"},{"id":239,"ch":2,"kp":"1.3 保险合同的种类","t":"s","q":"关于定值保险合同与不定值保险合同，下列说法错误的是（    ）。","o":["定值保险合同中，如果保险事故造成保险标的全损，保险人赔偿保险金额的全部，不必对保险标的重新估价","在保险实务中，定值保险合同适用于某些容易确定价值的财产","不定值保险合同在订立时仅载明保险金额作为保险事故发生后赔偿最高限额，不预先确定保险价值","大多数财产保险业务均采用不定值保险合同的形式"],"a":"B","e":"选B。定值合同适用于价值难以确定或不易事后估价的财产，如古玩、船舶，而非“容易确定价值”的财产。A、C、D关于全损按保额赔付、不定值合同只列保额、多数财险采用不定值合同，均正确。"},{"id":240,"ch":2,"kp":"1.3 保险合同的种类","t":"s","q":"按照合同承担风险责任的方式分类，农作物雹灾保险合同属于（    ）。","o":["单一风险合同","综合风险合同","一切险合同","特别风险合同"],"a":"A","e":"选A。农作物雹灾保险只承保雹灾这一种风险，属单一风险合同。综合风险合同承保列举的数种风险，一切险不列举承保风险而仅列责任免除，“特别风险合同”不是该分类项下的类型。"},{"id":241,"ch":2,"kp":"1.3 保险合同的种类","t":"s","q":"在（    ）中，保险人不列举规定承保的具体风险，而是以“责任免除”条款确定其不承保的风险。","o":["单一风险合同","综合风险合同","责任免除合同","一切险合同"],"a":"D","e":"选D。一切险合同不逐一列举承保风险，而以责任免除条款界定不保风险，未列入免除者原则上均承保。单一风险、综合风险均须列举承保风险；“责任免除合同”不是该分类下的合同类型。"},{"id":242,"ch":2,"kp":"1.3 保险合同的种类","t":"s","q":"按照保险人的承保方式分类，共同保险属于（    ）。","o":["定值保险合同","不定值保险合同","原保险合同","再保险合同"],"a":"C","e":"选C。按承保方式分为原保险与再保险，共同保险是多个保险人共同直接向同一被保险人承保同一标的、按约定份额负责，仍属原保险。定值、不定值是按保险价值是否确定所作的分类。"},{"id":243,"ch":2,"kp":"1.3 保险合同的种类","t":"m","q":"下列属于补偿性保险合同的是（    ）。","o":["利润损失保险","医疗费用保险","疾病津贴合同","人寿保险合同"],"a":"ABC","e":"选ABC。利润损失保险、医疗费用保险、疾病津贴合同均以实际损失为限补偿，属补偿性合同。人寿保险按约定金额定额给付，属给付性合同，不以实际损失作为赔付依据。"},{"id":244,"ch":2,"kp":"1.3 保险合同的种类","t":"m","q":"按照保险标的的分合以及变动情况分类，财产保险合同可以分为（    ）。","o":["特定式保险合同","总括式保险合同","报告式保险合同","开口式保险合同"],"a":"ABCD","e":"选ABCD。按保险标的的分合及变动情况，财产保险合同分为特定式、总括式、报告式与预约式（开口式）四类，分别对应按项目列明、统括承保、定期报告价值和预约不定期承保。"},{"id":245,"ch":2,"kp":"1.3 保险合同的种类","t":"m","q":"按照保险人的承保方式分类，保险合同可以分为（    ）。","o":["原保险合同","再保险合同","共同保险合同","重复保险合同"],"a":"AB","e":"选AB。按承保方式，保险合同分为原保险与再保险。共同保险是多个保险人共同直接承保同一标的；重复保险是投保人就同一标的、同一利益、同一事故向两个以上保险人投保，二者并非该分类结果。"},{"id":246,"ch":2,"kp":"1.3 保险合同的种类","t":"m","q":"在保险合同的分类中，下列说法正确的是（    ）。","o":["开口式保险合同中，发生损失时部分损失财产类别，只要在总保险金额限度以内，都可获得赔偿的保险合同","大型的周转性仓储业一般投保预约式保险合同","特定式保险合同又叫分项式保险合同","流动式保险合同是指不规定财产的保险金额，只预定一个保险人承担最高责任的险恶。"],"a":"CD","e":"选CD。特定式合同按项目分别列明保额，又称分项式；流动式（报告式）合同不规定保险金额，只预定最高责任限额，故C、D正确。A项应为不分损失财产类别；B项大型周转性仓储业宜投保报告式。"},{"id":247,"ch":2,"kp":"1.3 保险合同的种类","t":"j","q":"流动式保险合同又叫报告式保险合同，是指不规定财产的保险金额，只预定一个保险人承担最高责任的限额。","o":[],"a":"T","e":"正确。报告式合同又称流动式合同，其特点是不规定财产的保险金额，只预定保险人承担责任的最高限额，由投保人定期报告财产实际价值，报告属实的在限额内赔偿。"},{"id":248,"ch":2,"kp":"1.3 保险合同的种类","t":"j","q":"一切险合同是指保险人承保一切风险的保险合同。","o":[],"a":"F","e":"错误。一切险并非承保一切风险，它只是不列举承保风险，而用责任免除条款列明不保风险，凡未列入免除者才承保，仍受责任免除与保险金额限制，故“承保一切风险”表述错误。"},{"id":249,"ch":2,"kp":"1.3 保险合同的种类","t":"j","q":"再保险合同直接保障的对象是原保险合同的投保人。","o":[],"a":"F","e":"错误。再保险合同的直接保障对象是原保险人（分出公司），由其将承担的部分风险责任转移给再保险人，原保险合同的投保人、被保险人并非再保险合同的当事人。"},{"id":250,"ch":2,"kp":"2.1保险合同的主体","t":"s","q":"《中华人民共和国保险法》规定：“保险人是指与（    ）订立保险合同，并按照合同约定承担赔偿或给付保险金责任的保险公司。","o":["被保险人","投保人","受益人","保单持有人"],"a":"B","e":"选B。保险人须与投保人订立合同并按约定承担赔偿或给付保险金责任。被保险人是受合同保障、享有保险金请求权的人；受益人在人身险中依指定享有请求权；保单持有人不是我国保险法的主体表述。"},{"id":251,"ch":2,"kp":"2.1保险合同的主体","t":"s","q":"与保险人订立保险合同，并按照保险合同约定负有支付保险费义务的人是（    ）。","o":["被保险人","投保人","受益人","保单持有人"],"a":"B","e":"选B。与保险人订立合同并负有支付保险费义务的人是投保人，其为合同当事人。被保险人受合同保障，受益人在人身险中享有保险金请求权，二者均不承担缴费义务。"},{"id":252,"ch":2,"kp":"2.1保险合同的主体","t":"s","q":"（    ）是有权按照保险合同规定向保险人请求赔偿或给付保险金的人。","o":["被保险人","投保人","受益人","保单持有人"],"a":"A","e":"选A。被保险人因其财产或人身受保险合同保障，有权向保险人请求赔偿或给付保险金。投保人是缴费义务人；受益人在人身险中经指定才享有请求权；保单持有人非我国保险法概念。"},{"id":253,"ch":2,"kp":"2.1保险合同的主体","t":"s","q":"在不以死亡为给付保险金条件的人身保险合同中，不能作为被保险人的是（    ）。","o":["具有民事行为能力的自然人","无民事行为能力的自然人","21周岁患有精神性疾病的男性","能够独立承担民事责任的法人"],"a":"D","e":"选D。人身保险的被保险人须为自然人，法人不能成为被保险人。不以死亡为给付保险金条件的合同中，无民事行为能力人也可作为被保险人，故A、B、C可成为被保险人，D项法人不能。"},{"id":254,"ch":2,"kp":"2.1保险合同的主体","t":"s","q":"在（    ）中，被保险人是对他人财产毁损或人身伤害依照法律、契约负有经济赔偿责任的人。","o":["财产保险","人身保险","责任保险","信用保险"],"a":"C","e":"选C。责任保险中被保险人是依法或依约对他人财产毁损、人身伤害负经济赔偿责任的人。财产保险针对自有财产损失，人身保险针对寿命身体，信用保险针对他人失信造成的损失。"},{"id":255,"ch":2,"kp":"2.1保险合同的主体","t":"s","q":"受益人产生的方式是（    ）。","o":["由法律制定","由保险人指定","由亲属制定","由投保人或被保险人指定"],"a":"D","e":"选D。受益人由投保人或被保险人指定产生，投保人指定须经被保险人同意。法律不直接指定具体受益人，保险人无权指定，亲属关系也不当然产生受益权，故A、B、C均错误。"},{"id":256,"ch":2,"kp":"2.1保险合同的主体","t":"s","q":"关于受益人的指定，下列说法错误的是（    ）。","o":["受益人产生的唯一方式是指定","人身保险的受益人由被保险人或者投保人指定","投保人为与其有劳动关系的劳动者投保人人身险，可以指定被保险人及其亲属以外的人为受益人","被保险人若无民事行为能力，可由其监护人指定受益人"],"a":"C","e":"选C。投保人为与其有劳动关系的劳动者投保人身险，不得指定被保险人及其近亲属以外的人为受益人，以防道德风险。A、B、D关于指定方式、指定主体及监护人代行指定均正确。"},{"id":257,"ch":2,"kp":"2.1保险合同的主体","t":"s","q":"下列选项可以成为受益人的是（    ）。","o":["无民事行为能力自然人","限制民事行为能力自然人","法人","以上都可以"],"a":"D","e":"选D。受益人资格一般不受限制，自然人无论有无民事行为能力、是否成年均可被指定，法人亦可作为受益人。故A、B、C三种情形都可以成为受益人。"},{"id":258,"ch":2,"kp":"2.1保险合同的主体","t":"s","q":"关于受益人，下列说法错误的是（    ）。","o":["受益人通过指定产生","受益人的资格受一定限制","受益人的数量可以一人也可以数人","受益人中途也可以变更"],"a":"B","e":"选B。受益人资格一般不受限制，自然人（含无民事行为能力人、限制民事行为能力人）和法人都可被指定，故“资格受一定限制”说法错误。A、C、D关于指定产生、人数不限、可变更均正确。"},{"id":259,"ch":2,"kp":"2.1保险合同的主体","t":"s","q":"在保险合同中，受益人是保险合同的（    ）。","o":["主体中的当事人","主体中关系人","客体中的当事人","客体中的关系人"],"a":"B","e":"选B。保险合同的当事人是投保人与保险人，被保险人与受益人是关系人，故受益人居于主体中的关系人地位。保险标的等是合同保障的对象，属客体范畴，不能与主体混同。"},{"id":260,"ch":2,"kp":"2.1保险合同的主体","t":"s","q":"受益人是享有保险金请求权的人，下列关于受益人说法正确的是（    ）。","o":["投保人指定与其有劳动关系的劳动者为受益人时，无须经被保险人同意","无民事行为能力的自然人不能作为受益人","投保人或被保险人可以指定一人或者数人为受益人","投保人变更受益人时仅须通知保险人"],"a":"C","e":"选C。投保人或被保险人均可指定一人或数人为受益人。A项投保人为劳动者投保指定受益人须经被保险人同意；B项无民事行为能力人可作受益人；D项变更受益人须经被保险人同意，不能仅通知保险人。"},{"id":261,"ch":2,"kp":"2.1保险合同的主体","t":"s","q":"根据《保险法》，被保险人死亡后，保险金作为被保险人的遗产的情况是（    ）。","o":["没有指定受益人","受益人先于被保险人死亡，没有其他受益人","受益人依法丧失受益权，没有其他受益人","以上都是"],"a":"D","e":"选D。没有指定受益人、受益人先于被保险人死亡且无其他受益人、受益人依法丧失受益权且无其他受益人，三种情形下保险金均作为被保险人遗产，由法定继承人继承。"},{"id":262,"ch":2,"kp":"2.1保险合同的主体","t":"s","q":"在保险实务中，关于受益人说法错误的是（    ）。","o":["已确定受益人的情况下，保险金不能视为死者（被保险人）的遗产","已确定受益人的情况下，保险金需先用于清偿死者生前的债务","在受益人未确定的情况下，被保险人的法定继承人就视同受益人","没有指定受益人时，保险金可作为被保险人的遗产"],"a":"B","e":"选B。已确定受益人时，保险金是受益人原始取得的财产，不属被保险人遗产，无须先清偿被保险人生前债务。A、C、D表述均正确，故错误的是B。"},{"id":263,"ch":2,"kp":"2.1保险合同的主体","t":"s","q":"投保人与保险人之间确立保险关系的形式是（  ）。","o":["建立保险基金","订立保险合同","集合与分散风险","交付保险费"],"a":"B","e":"选B。投保人与保险人通过订立保险合同确立保险关系，合同是双方权利义务的载体。建立保险基金、集合与分散风险是保险经营机理，交付保险费是合同义务而非确立保险关系的形式。"},{"id":264,"ch":2,"kp":"2.1保险合同的主体","t":"m","q":"保险合同的关系人包括（    ）。","o":["被保险人","保险人","投保人","受益人"],"a":"AD","e":"选AD。保险合同主体包括当事人与关系人，被保险人和受益人是关系人。保险人是承保并承担赔付责任的一方，投保人是缔约并负缴费义务的一方，二者属当事人，故选AD。"},{"id":265,"ch":2,"kp":"2.1保险合同的主体","t":"m","q":"《中华人民共和国保险法》规定，对投保人的要求包括（    ）。","o":["投保人必须是具有民事行为能力的自然人","投保人必须具有缴付保险费的能力","人身保险的投保人在保险合同订立时，对被保险人应当具有保险利益","必须年满18周岁"],"a":"BC","e":"选BC。投保人须具有缴付保险费的能力，人身保险的投保人在订立合同时对被保险人应当具有保险利益。A项投保人可以是法人，不限于自然人；D项法律并未要求必须年满18周岁。"},{"id":266,"ch":2,"kp":"2.1保险合同的主体","t":"m","q":"关于被保险人，下列说法正确的是（    ）。","o":["财产保险合同中，被保险人必须是法人或者具有民事行为能力的自然人","在死亡为给付保险金条件的人身保险合同中，任何情况下无民事行为能力的人不得成为被保险人","同一保险合同中被保险人可以是一人，也可以是数人","在人身保险中，被保险人既是受保险合同保障的人，也是保险事故发生的本体"],"a":"CD","e":"选CD。同一合同中被保险人可一人也可数人；人身保险中被保险人既是受保障的人，也是保险事故发生的本体。A项财产险被保险人不以具有民事行为能力为必要；B项“任何情况下”过于绝对。"},{"id":267,"ch":2,"kp":"2.1保险合同的主体","t":"m","q":"关于受益人，下列说法正确的是（    ）。","o":["受益人产生的唯一方式是指定","无民事行为能力的自然人不能成为受益人","受益人的数量只能有一个","受益人中途可以被变更"],"a":"AD","e":"选AD。受益人只能由投保人或被保险人指定产生，且可中途变更。B项无民事行为能力人也可成为受益人；C项受益人可以为一人，也可以为数人，故B、C两项说法错误。"},{"id":268,"ch":2,"kp":"2.1保险合同的主体","t":"j","q":"保险合同的主体是保险合同的参加者，是在保险合同中享有权利并承担相应义务的人。","o":[],"a":"T","e":"正确。保险合同的主体即合同的参加者，是在合同中享有权利并承担相应义务的人，包括投保人、保险人等当事人以及被保险人、受益人等关系人。"},{"id":269,"ch":2,"kp":"2.1保险合同的主体","t":"j","q":"保险合同的主体包括保险人和被保险人。","o":[],"a":"F","e":"错误。保险合同主体包括当事人和关系人：当事人为投保人与保险人，关系人为被保险人与受益人。仅列保险人和被保险人，会遗漏投保人、受益人，故表述不完整。"},{"id":270,"ch":2,"kp":"2.1保险合同的主体","t":"j","q":"被保险人是指与保险人订立保险合同，并按照保险合同约定负有支付保险费义务的人。","o":[],"a":"F","e":"错误。题干实为投保人的定义。被保险人是指其财产或人身受保险合同保障、享有保险金请求权的人，其不因合同负有支付保险费的义务，缴费义务由投保人承担。"},{"id":271,"ch":2,"kp":"2.1保险合同的主体","t":"j","q":"在人身保险合同中，有民事行为能力的人和法人可以作为被保险人。","o":[],"a":"F","e":"错误。人身保险合同的被保险人只能是自然人，法人不能作为被保险人；且在不以死亡为给付保险金条件的合同中，无民事行为能力人也可成为被保险人，题干表述片面。"},{"id":272,"ch":2,"kp":"2.1保险合同的主体","t":"j","q":"当投保人为自己的利益投保时，投保人和被保险人同属一人，此时的被保险人可以是视同保险合同的当事人。","o":[],"a":"T","e":"正确。投保人为自己的利益投保时，投保人与被保险人合为一人，此时其兼具当事人与关系人身份，视同保险合同的当事人，合同权利义务集于一身。"},{"id":273,"ch":2,"kp":"2.1保险合同的主体","t":"j","q":"在责任保险中，被保险人是因他人失信，而有可能遭受经济损失的人，或者是因自身失信可能导致他人损失的人。","o":[],"a":"F","e":"错误。题干描述的是信用保险的被保险人。责任保险的被保险人是因对他人财产毁损或人身伤害依法、依约负经济赔偿责任的人，二者保障对象不同。"},{"id":274,"ch":2,"kp":"2.1保险合同的主体","t":"j","q":"受益人产生的唯一方式是指定，有权指定受益人的主体是被保险人、保险人或投保人。","o":[],"a":"F","e":"错误。受益人确由指定产生，但有权指定者只限于被保险人和投保人，且投保人指定须经被保险人同意；保险人无权指定受益人，故题干多列了保险人。"},{"id":275,"ch":2,"kp":"2.1保险合同的主体","t":"j","q":"自然人中无民事行为能力、限制民事行为能力的人不可作为受益人。","o":[],"a":"F","e":"错误。受益人资格一般不受行为能力限制，无民事行为能力人、限制民事行为能力人均可被指定为受益人，其受益权由监护人代为行使。"},{"id":276,"ch":2,"kp":"2.1保险合同的主体","t":"j","q":"受益人的数量可以是一人也可以是数人。","o":[],"a":"T","e":"正确。受益人的人数不受限制，投保人或被保险人可指定一人为受益人，也可指定数人为受益人并确定受益顺序和份额，故“可以是一人也可以是数人”表述正确。"},{"id":277,"ch":2,"kp":"2.1保险合同的主体","t":"j","q":"投保人变更受益人时需保险人或被保险人任意一方同意。","o":[],"a":"F","e":"错误。投保人变更受益人须经被保险人同意并通知保险人，而不是“保险人或被保险人任意一方同意”，保险人的同意不能替代被保险人的同意。"},{"id":278,"ch":2,"kp":"2.1保险合同的主体","t":"j","q":"受益人先于被保险人死亡，没有其他受益人时，保险金作为被保险人的遗产。","o":[],"a":"T","e":"正确。受益人先于被保险人死亡且没有其他受益人时，保险金作为被保险人的遗产；受益人依法丧失受益权且无其他受益人时同样如此，故题干表述正确。"},{"id":279,"ch":2,"kp":"2.2 保险合同的客体","t":"s","q":"保险合同的客体是（    ）。","o":["被保险人","受益人","保险利益","保险标的"],"a":"C","e":"选C。保险合同的客体是保险利益，即投保人或被保险人对保险标的具有的法律上承认的利益。被保险人和受益人是合同主体，保险标的是保险利益的载体而非客体。"},{"id":280,"ch":2,"kp":"2.2 保险合同的客体","t":"s","q":"保险标的是（    ）。","o":["保险合同的客体","保险合同的载体","保险利益的主体","保险利益的载体"],"a":"D","e":"选D。保险标的是保险利益的载体，是承载保险利益的财产及其有关利益或人的寿命和身体。保险合同的客体是保险利益，标的是利益依附的对象，二者不能颠倒。"},{"id":281,"ch":2,"kp":"2.2 保险合同的客体","t":"m","q":"下列关于保险合同的客体说法正确的是（    ）。","o":["保险利益是保险合同的客体","保险标的是保险利益的客体","人身保险的投保人在保险合同订立时，对被保险人应当具有保险利益。","财产保险的被保险人在保险事故发生时，对保险标的应当具有保险利益"],"a":"ACD","e":"选ACD。保险利益是合同客体；人身险投保时、财产险事故发生时分别要求具有保险利益，符合保险法规定。B项错在颠倒关系，应为保险标的是保险利益的载体，而非保险利益的客体。"},{"id":282,"ch":2,"kp":"2.2 保险合同的客体","t":"j","q":"保险合同的客体是保险标的。（   ）","o":[],"a":"F","e":"错误。保险合同的客体是保险利益，即投保人或被保险人对保险标的所具有的法律上承认的利益；保险标的是保险利益的载体，题干把标的与客体混为一谈。"},{"id":283,"ch":2,"kp":"2.2 保险合同的客体","t":"j","q":"保险标的是保险利益的载体（       ）","o":[],"a":"T","e":"正确。保险标的是保险利益的载体，财产保险中表现为财产及其有关利益，人身保险中表现为人的寿命和身体，保险利益依附于保险标的而存在。"},{"id":284,"ch":2,"kp":"3.1保险条款","t":"s","q":"（    ）是记载有关保险合同主体的权利、义务及其他保险事项等条文与款目，是保险合同双方享受权利与承担义务的主要依据。","o":["保险单","投保单","保险凭证","保险条款"],"a":"D","e":"选D。保险条款是记载合同主体权利义务及其他保险事项的条文与款目，是双方享受权利、承担义务的主要依据。保险单、投保单、保险凭证是凭证类文书，其内容由条款构成。"},{"id":285,"ch":2,"kp":"3.1保险条款","t":"s","q":"（    ）是对保险人承担责任的限制，是指保险人不负赔偿和给付责任的范围。","o":["基本责任","特约责任","责任免除","保险责任"],"a":"C","e":"选C。责任免除是对保险人承担责任的限制，即保险人不负赔偿或给付责任的范围。基本责任和特约责任都是保险人承保的责任范围，与“不负赔偿责任”正好相反。"},{"id":286,"ch":2,"kp":"3.1保险条款","t":"s","q":"（    ）是指保险人承担赔偿或者给付保险金责任的最高限额。","o":["保险费","保险金额","保险责任","保险利益"],"a":"B","e":"选B。保险金额是保险人承担赔偿或给付保险金责任的最高限额。保险费是投保人支付的费用，保险责任是承保范围，保险利益是合同客体，均非责任限额。"},{"id":287,"ch":2,"kp":"3.1保险条款","t":"s","q":"保险人实际赔付或给付的保险金额（    ）保险金额。","o":["小于等于","大于等于","等于","以上都可能"],"a":"A","e":"选A。保险人实际赔付或给付的保险金额只能小于或等于保险金额，保险金额是赔付上限；在补偿性合同中还要受实际损失限制，故不可能大于保险金额。"},{"id":288,"ch":2,"kp":"3.1保险条款","t":"s","q":"（    ）是指一定时期内保险人业务经营费用和预定利润的总数同保险金额的比率。","o":["保险费率","纯费率","附加费率","净费率"],"a":"C","e":"选C。附加费率是一定时期内业务经营费用与预定利润总数同保险金额的比率，用于覆盖费用与利润。纯费率即净费率对应损失赔付，二者合为毛费率，即保险费率。"},{"id":289,"ch":2,"kp":"3.1保险条款","t":"s","q":"在补偿性保险中，发生保险事故时由保险人根据（    ）支付保险金，但不超过最高限度。","o":["保险利益","实际损失","保险金额","重置成本"],"a":"B","e":"选B。补偿性保险中保险人按被保险人的实际损失支付保险金，并受保险金额上限约束，体现损失补偿原则。保险利益是合同效力前提，保险金额是赔偿上限，重置成本是估价基础。"},{"id":290,"ch":2,"kp":"3.1保险条款","t":"s","q":"在保险合同的基本条款中，承担违约责任的形式不包括（    ）。","o":["争议处理","实际履行","支付违约金","赔偿损失"],"a":"A","e":"选A。承担违约责任的形式包括实际履行、支付违约金、赔偿损失等；争议处理是解决合同纠纷的途径，属合同争议处理条款的内容，不是承担违约责任的形式。"},{"id":291,"ch":2,"kp":"3.1保险条款","t":"s","q":"一般情况下，属于定额保险的是（    ），","o":["人寿保险","财产保险","疾病保险","伤害保险对各项费用的补偿"],"a":"A","e":"选A。人寿保险按合同约定的保险金额定额给付，属定额保险。财产保险以实际损失为限补偿；疾病保险、伤害保险中的费用补偿部分也按实际支出给付，属补偿性质。"},{"id":292,"ch":2,"kp":"3.1保险条款","t":"m","q":"按照保险条款的性质不同，可将其分为（    ）。","o":["基本条款","法定条款","附加条款","任意条款"],"a":"AC","e":"选AC。按条款性质不同，保险条款分为基本条款与附加条款，基本条款规定合同基本事项，附加条款扩大或限制承保范围。法定条款与任意条款是按条款效力来源划分，不属本题标准。"},{"id":293,"ch":2,"kp":"3.1保险条款","t":"m","q":"保险合同的基本条款中，保险责任通常包括（    ）。","o":["基本责任","特约责任","责任免除","法定责任"],"a":"AB","e":"选AB。保险责任通常包括基本责任和特约责任，前者是基本条款载明的承保责任，后者是经特别约定扩展或限制的责任。责任免除与保险责任相对，不属于保险责任构成；法定责任不是该分类项。"},{"id":294,"ch":2,"kp":"3.1保险条款","t":"m","q":"下列关于保险费率说法正确的是（    ）。","o":["保险费率是指保险人在一定时期按一定保险金额收取保险费的比例","保险费率一般由纯费率和附加费率组成","在财产保险中，主要是依据保险利益与损失赔偿金额的比例来确定","在长期寿险中，根据人的预定死亡（生存）率和预定利率等因素来确定"],"a":"ABD","e":"选ABD。A项费率定义、B项费率由纯费率与附加费率组成、D项长期寿险依预定死亡率和预定利率等因素确定，均正确。C项财产险费率主要依据保险金额与损失赔偿金额的比例即损失率确定。"},{"id":295,"ch":2,"kp":"3.1保险条款","t":"m","q":"一般情况下，下列属于定额保险的是（    ）。","o":["疾病保险","财产保险","年金保险","人寿保险"],"a":"CD","e":"选CD。年金保险与人寿保险均按合同约定的金额定额给付，属定额保险。财产保险按实际损失补偿；疾病保险中的医疗费用部分也以实际支出为限，属补偿性，故不选A、B。"},{"id":296,"ch":2,"kp":"3.1保险条款","t":"m","q":"在保险合同的基本条款中，关于保险期间和保险责任开始的时间说法正确的是（    ）。","o":["保险期间是指保险合同的有效期间","保险合同是保险人为投保人提供保险保障的起讫时间","保险期间是计算保险费的依据，也是保险人履行保险责任的基本依据之一","依法成立的保险合同，自成立起生效"],"a":"ACD","e":"选ACD。保险期间是合同有效期间，是计算保险费和保险人履行责任的基本依据，依法成立的合同自成立时生效。B项错在保险期间是保险人为被保险人而非投保人提供保障的起讫时间。"},{"id":297,"ch":2,"kp":"3.1保险条款","t":"j","q":"保险凭证是记载有关保险合同主体的权利、义务及其他保险事项的条文与款目，是保险合同双方享受权利与承担义务的主要依据。","o":[],"a":"F","e":"错误。题干是保险条款的定义。保险凭证是保险人签发给投保人、证明保险合同已订立的法律凭证，是简化形式的保险单，并不载明全部条款内容。"},{"id":298,"ch":2,"kp":"3.1保险条款","t":"j","q":"投保人不能单独投保附加险，而必须在投保基本险的基础上才能投保附加险。","o":[],"a":"T","e":"正确。附加险依附于基本险而存在，投保人须先投保基本险才能投保附加险，不能单独投保；基本险终止时，附加险随之终止。"},{"id":299,"ch":2,"kp":"3.1保险条款","t":"j","q":"人身保险合同中的保险标的是指被保险人的寿命、身体、责任和信用。","o":[],"a":"F","e":"错误。人身保险合同的保险标的是被保险人的寿命和身体；责任、信用属于财产保险中责任保险、信用保险的保险标的，题干把两类标的混在一起。"},{"id":300,"ch":2,"kp":"3.1保险条款","t":"j","q":"责任免除是对保险人承担责任的限制，即指保险人不负赔偿和给付责任的范围。","o":[],"a":"T","e":"正确。责任免除即除外责任，是对保险人承担责任的限制，指依合同约定保险人不负赔偿或给付责任的范围，与保险责任范围互为补充。"},{"id":301,"ch":2,"kp":"3.1保险条款","t":"j","q":"保险期间是指保险合同的有效期间，即保险人为被保险人提供保险保障的起讫时间。","o":[],"a":"T","e":"正确。保险期间是保险合同的有效期间，即保险人自合同约定生效时起至终止时止为被保险人提供保险保障的起讫时间，是判断事故是否发生在保障期内的依据。"},{"id":302,"ch":2,"kp":"3.1保险条款","t":"j","q":"保险期间是计算保险费的依据，也是保险人履行保险责任的基本依据之一。","o":[],"a":"T","e":"正确。保险期间决定保险人承担责任的时段，是计算保险费的依据，也是保险人履行保险责任的基本依据之一，保险事故发生在保险期间内才可能获得赔付。"},{"id":303,"ch":2,"kp":"3.1保险条款","t":"j","q":"缴纳保险费是被保险人的基本义务。","o":[],"a":"F","e":"错误。缴纳保险费是投保人的基本义务，投保人是与保险人订立合同并负缴费义务的人；被保险人是受合同保障、享有保险金请求权的人，不承担缴费义务。"},{"id":304,"ch":2,"kp":"3.1保险条款","t":"j","q":"附加费率是指一定时期内保险人业务经营费用和预定利润的总数同保险金额的比率。","o":[],"a":"T","e":"正确。附加费率是一定时期内保险人业务经营费用和预定利润的总数同保险金额的比率，与纯费率共同构成保险费率，用于覆盖费用支出和预期利润。"},{"id":305,"ch":2,"kp":"3.1保险条款","t":"j","q":"保险合同条款中，争议处理的方式一般有协商、仲裁、诉讼等。","o":[],"a":"T","e":"正确。保险合同条款中的争议处理条款通常列明协商、仲裁、诉讼等解决途径，当事人可依约选择适用；协商、仲裁、诉讼也是保险纠纷处理的通用方式。"},{"id":306,"ch":2,"kp":"3.1保险条款","t":"j","q":"保险金额是指保险人承担赔偿或者给付的被保险人损失。","o":[],"a":"F","e":"错误。保险金额是保险人承担赔偿或给付保险金责任的最高限额，不是被保险人的损失本身；损失是计算赔款的依据，二者不能等同，题干混淆了责任限额与损失。"},{"id":307,"ch":2,"kp":"3.2保险合同的凭证","t":"s","q":"（    ）是投保人与保险人之间订立保险合同的正式书面凭证。","o":["投保单","保险单","暂保单","批单"],"a":"B","e":"选B。保险单是投保人与保险人订立保险合同的正式书面凭证。投保单是投保人提出的投保申请；暂保单是正式保单签发前的临时凭证；批单用于变更已生效合同的内容。"},{"id":308,"ch":2,"kp":"3.2保险合同的凭证","t":"s","q":"在以死亡为给付保险金条件的保险合同，非经（    ）书面同意，投保人不得将保单不得转让或者质押。","o":["保险人","被保险人","受益人","投保人"],"a":"B","e":"选B。以死亡为给付保险金条件的合同，未经被保险人书面同意，投保人不得将保单转让或质押，以防道德风险。保险人是合同相对方，受益人是享有保险金请求权的人，均非同意主体。"},{"id":309,"ch":2,"kp":"3.2保险合同的凭证","t":"s","q":"变更保险单上所载某些内容的单证叫作（    ）。","o":["投保单","保险单","暂保单","批单"],"a":"D","e":"选D。批单是保险人应投保人要求变更保险单所载某些内容而出具的书面单证，批改后以批单为准。投保单是投保申请，保险单是正式凭证，暂保单是临时凭证。"},{"id":310,"ch":2,"kp":"3.2保险合同的凭证","t":"s","q":"（    ）是投保人与保险人经协商后拟定的书面协议，当事人的权利、义务在协议中载明，并由当事人双方盖章或签字。","o":["投保单","保险单","暂保单","保险协议书"],"a":"D","e":"选D。保险协议书由投保人与保险人协商拟定，逐项载明双方权利义务并由双方签章。投保单是投保人单方要约，暂保单是临时保障凭证，保险单是标准化的正式书面凭证。"},{"id":311,"ch":2,"kp":"3.2保险合同的凭证","t":"s","q":"当保险标的较为特殊或投保人的要求较为特殊，不能采取标准化的保险单或保险凭证时，可以采用（    ）的形式。","o":["“小保单”","暂保单","保险协议书","批单"],"a":"C","e":"选C。保险标的或投保人要求特殊、无法使用标准化保险单或保险凭证时，采用保险协议书逐项约定双方权利义务。\"小保单\"是保险凭证的俗称，暂保单只是正式保单签发前的临时凭证。"},{"id":312,"ch":2,"kp":"3.2保险合同的凭证","t":"s","q":"保险实务中，投保人提出保险要约时，均需填具（    ）。","o":["投保单","保险单","暂保单","保险凭证"],"a":"A","e":"选A。投保单是投保人向保险人提出保险要求的书面形式，即投保人填具的要约。保险单、暂保单、保险凭证均由保险人一方出具，属于承诺后的凭证，不是投保人提出的要约。"},{"id":313,"ch":2,"kp":"3.2保险合同的凭证","t":"s","q":"保险合同的凭证中，（    ）在特定的条件下，有类似有价证券的作用，常被称为“保险证券”。","o":["投保单","保险单","保险凭证","暂保单"],"a":"B","e":"选B。保险单在特定条件下具有类似有价证券的作用，如可质押、可转让，故常被称为\"保险证券\"。保险凭证是简化了的保险单，暂保单是临时凭证，投保单只是投保申请。"},{"id":314,"ch":2,"kp":"3.2保险合同的凭证","t":"m","q":"保险合同的凭证包括（    ）。","o":["投保单","暂保单","保险协议书","批单"],"a":"ABCD","e":"选ABCD。保险合同的凭证包括投保单、保险单、保险凭证、暂保单、保险协议书和批单等，四选项均属合同凭证的组成部分，只是各自的法律地位和适用情形不同。"},{"id":315,"ch":2,"kp":"3.2保险合同的凭证","t":"m","q":"下列关于保险凭证说法正确的是（    ）。","o":["保险凭证又叫背书","保险凭证是一种简化了的保险单","保险凭证的法律效力不及保险单的法律效力","凡保险单上未列明的内容均以相应的保险单的条款为准，二者有抵触时以保险凭证上的内容为有效"],"a":"BD","e":"选BD。保险凭证是简化了的保险单，与保险单具有同等法律效力；凡保险单未列明的内容以保险单条款为准，二者抵触时以保险凭证为准。A把保险凭证说成\"背书\"，C称其效力不及保险单，均错。"},{"id":316,"ch":2,"kp":"3.2保险合同的凭证","t":"m","q":"在保险合同的凭证中，关于保险单说法正确的是（    ）。","o":["保险单是投保人与保险人之间订立保险合同的正式书面凭证","保险单签发后，便是保险合同最主要的组成部分，是保险合同存在的重要凭证","保险单常被称为“保险证券”","保险单出质后，投保人经保险人同意后可转让或解除"],"a":"ABC","e":"选ABC。保险单是订约的正式书面凭证，是合同最主要的组成部分和存在凭证，特定条件下被称为\"保险证券\"。D错：以死亡为给付条件的保单出质后转让或解除，须经被保险人书面同意，而非经保险人同意。"},{"id":317,"ch":2,"kp":"3.2保险合同的凭证","t":"j","q":"作为保险合同的正式书面凭证，保险单包括保险合同的全部内容，包括：声名事项，保险事项，除外事项和条件事项。","o":[],"a":"T","e":"正确。保险单的内容通常分为声明事项（声名事项）、保险事项、除外事项和条件事项四部分，四者共同构成保险合同的全部内容，是保险单结构的标准划分。"},{"id":318,"ch":2,"kp":"3.2保险合同的凭证","t":"j","q":"保险书面协议是保险合同变更时最常用的书面单证。","o":[],"a":"F","e":"错误。保险合同变更时最常用的书面单证是批单，不是保险协议书。保险协议书适用于标的特殊或投保人要求特殊、无法使用标准化保险单的情形。"},{"id":319,"ch":2,"kp":"3.2保险合同的凭证","t":"j","q":"保险单是投保人与保险人之间订立保险合同的正式书面凭证。（  ）","o":[],"a":"T","e":"正确。保险单由保险人签发，载明保险合同的具体内容，是投保人与保险人之间订立保险合同的正式书面凭证，也是合同存在的重要证明。"},{"id":320,"ch":2,"kp":"3.2保险合同的凭证","t":"j","q":"保险凭证的法律效力不及保险单。（  ）","o":[],"a":"F","e":"错误。保险凭证是简化了的保险单，与保险单具有同等法律效力，并非\"效力不及\"；凡保险单未列明的内容以保险单条款为准，二者抵触时以保险凭证为准。"},{"id":321,"ch":2,"kp":"4.1 保险合同的成立","t":"s","q":"保险合同的（    ）要经过要约和承诺两个步骤。","o":["订立","成立","生效","中止"],"a":"A","e":"选A。保险合同的订立必须经过要约与承诺两个步骤。成立强调双方意思表示一致的结果，生效强调条款产生约束力，中止指合同效力暂时停止，三者都不是\"步骤\"。"},{"id":322,"ch":2,"kp":"4.1 保险合同的成立","t":"s","q":"保险合同的最终承诺人是（    ）。","o":["投保人","保险人","被保险人","营销人员"],"a":"B","e":"选B。投保人提出投保要求构成要约，保险人审核同意承保即作出承诺，故保险人是最终承诺人。营销人员只是代理办理投保手续，被保险人是合同保障的对象，都不是承诺主体。"},{"id":323,"ch":2,"kp":"4.1 保险合同的成立","t":"s","q":"保险合同的（    ）是指投保人与保险人就保险合同的条款达成协议。","o":["订立","成立","生效","中止"],"a":"B","e":"选B。保险合同成立指投保人与保险人就合同条款达成协议、意思表示一致。订立是缔约的全过程，生效指条款产生约束力，中止是效力暂停，均不符合题干表述。"},{"id":324,"ch":2,"kp":"4.1 保险合同的成立","t":"s","q":"保险人与投保人在平等自愿的基础上就保险合同的主要条款经过协商最终达成协议的法律行为称为（   ）。","o":["保险合同的订立","保险合同的生效","保险合同的要约","保险合同的承诺"],"a":"A","e":"选A。保险合同的订立是保险人与投保人在平等自愿基础上就主要条款协商并最终达成协议的法律行为，包含要约与承诺的完整过程。生效是条款产生约束力，要约、承诺只是其中的环节。"},{"id":325,"ch":2,"kp":"4.1 保险合同的成立","t":"s","q":"（ ）是指一方当事人就订立合同的主要条款，向另外一方提出订约建议的明确的意思表示。","o":["承诺","要约","保证","解释"],"a":"B","e":"选B。要约是一方当事人就合同主要条款向对方提出订约建议的明确意思表示。承诺是受要约人同意要约的意思表示；保证是保险合同中的担保性条款；解释是对条款含义的说明。"},{"id":326,"ch":2,"kp":"4.1 保险合同的成立","t":"m","q":"保险单包括的事项是（    ）。","o":["保险事项","声明事项","除外事项","条件事项"],"a":"ABCD","e":"选ABCD。保险单通常包括声明事项、保险事项、除外事项和条件事项四类，分别载明当事人与标的情况、承保责任范围、不保责任以及双方的义务性条件。"},{"id":327,"ch":2,"kp":"4.1 保险合同的成立","t":"j","q":"保险合同订立的必要条件是要约和承诺。","o":[],"a":"T","e":"正确。保险合同的订立必须经过要约和承诺两个必要步骤，缺少任何一环合同都不能成立，这是一般合同订立规则的体现。"},{"id":328,"ch":2,"kp":"4.1 保险合同的成立","t":"j","q":"合同的成立意味着双方当事人意思表示一致，要约承诺过程完成。","o":[],"a":"T","e":"正确。合同成立的核心是双方当事人意思表示一致，其标志是要约承诺过程完成；但成立并不等于生效，生效还须满足法定有效条件或所附条件。"},{"id":329,"ch":2,"kp":"4.1 保险合同的成立","t":"j","q":"保险合同的成立标志着保险合同的生效。","o":[],"a":"F","e":"错误。合同成立只表明双方意思表示一致，生效还取决于合同是否合法以及是否附条件、附期限；成立是生效的前提，但二者是两个不同阶段的判断。"},{"id":330,"ch":2,"kp":"4.2 保险合同的生效","t":"s","q":"依法成立的保险合同，自（    ）生效。","o":["所附条件成就时","成立时","投保人缴纳保费后","保险人签发保险单后"],"a":"B","e":"选B。依法成立的保险合同自成立时生效，体现\"成立即生效\"原则；附条件、附期限的合同则按所附条件成就或期限届至确定生效时间，缴费和签单都不是生效要件。"},{"id":331,"ch":2,"kp":"4.2 保险合同的生效","t":"s","q":"保险合同的（    ）是指依法成立的保险合同条款对合同当事人产生约束力。","o":["订立","成立","生效","中止"],"a":"C","e":"选C。保险合同生效指依法成立的合同条款对当事人产生约束力。成立是意思表示一致，订立是缔约过程，中止是效力暂时停止，均不是\"产生约束力\"的表述。"},{"id":332,"ch":2,"kp":"4.2 保险合同的生效","t":"s","q":"保险合同的（    ）意味着依法成立的保险合同，自成立时生效。","o":["订立","成立","法定生效","约定生效"],"a":"C","e":"选C。法定生效指依法成立的合同自成立时生效，即法律直接规定生效时间。约定生效则须待当事人约定的条件成就或期限届至，题干强调\"自成立时\"，故选法定生效。"},{"id":333,"ch":2,"kp":"4.2 保险合同的生效","t":"s","q":"保险合同往往是附条件、附期限生效的合同，只有当事人的行为附合所附条件或达到所附期限时，保险合同才生效。这是保险合同的（    ）。","o":["法定生效","约定生效","条件生效","强制生效"],"a":"B","e":"选B。生效取决于当事人约定的条件成就或期限届至，属约定生效。法定生效是法律直接规定合同自成立时生效，不由当事人另行约定，故A不符合题意。"},{"id":334,"ch":2,"kp":"4.2 保险合同的生效","t":"s","q":"保险合同的成立是保险合同生效的（    ）。","o":["充分条件","必要条件","充分必要条件","无关"],"a":"B","e":"选B。成立是生效的前提，合同不成立就无从生效，故成立是生效的必要条件；但成立后可能因内容违法或所附条件未成就而不生效，故成立不是生效的充分条件。"},{"id":335,"ch":2,"kp":"4.2 保险合同的生效","t":"s","q":"财产保险合同推行的“零时起保制”属于保险合同的（    ）。","o":["广义生效","狭义生效","法定生效","约定生效"],"a":"D","e":"选D。\"零时起保制\"是双方约定保险责任自某日零时开始，生效时间由当事人约定，属约定生效。法定生效是法律直接规定自成立时生效，不由当事人选择。"},{"id":336,"ch":2,"kp":"4.2 保险合同的生效","t":"j","q":"保险合同的成立就意味着保险合同的生效(  )","o":[],"a":"F","e":"错误。合同成立只表明双方意思表示一致，生效还须合同依法成立并符合所附条件或期限；成立在先、生效在后，二者不能等同。"},{"id":337,"ch":2,"kp":"5.1 保险合同的有效与无效","t":"s","q":"保险合同的（    ）是指保险合同具有法律效率并受国家法律保护。","o":["订立","成立","有效","生效"],"a":"C","e":"选C。保险合同有效指其符合法定有效条件、具有法律效力并受国家法律保护。成立仅表明意思表示一致，生效强调条款产生约束力，订立是缔约行为，均不等于\"有效\"。"},{"id":338,"ch":2,"kp":"5.1 保险合同的有效与无效","t":"s","q":"（    ）是指投保人对于投保标的所具有的保险利益必须符合法律规定，符合社会公共利益要求。","o":["主体合意","客体合法","双方当事人权利、义务对等","保险合同有效"],"a":"B","e":"选B。客体合法指投保人对保险标的所具有的保险利益必须符合法律规定、符合社会公共利益要求。主体合意指当事人合意真实，权利义务对等指双方对待给付均衡。"},{"id":339,"ch":2,"kp":"5.1 保险合同的有效与无效","t":"s","q":"在保险合同的效力中，投保人以承担缴付保险费义务为代价换取保险人对其遭受保险事故时的经济保障；保险人则以承诺在被保险人发生保险事故时提供经济保障为代价赢得向投保人收取保险费的权利。这种权利与义务的对等是以（    ）为基础的。","o":["公平合理的保险费率","投保人及时缴纳保险费","保险人向投保人签发保单","完善的理赔流程"],"a":"A","e":"选A。投保人缴付保费换取保险保障、保险人承担赔付责任换取保费，这种权利义务对等须以公平合理的保险费率为基础，费率与风险相匹配才能体现对价公平。"},{"id":340,"ch":2,"kp":"5.1 保险合同的有效与无效","t":"s","q":"保险标的不合法的保险合同属于保险合同的（    ）。","o":["全部无效","部分无效","条件无效","保障无效"],"a":"A","e":"选A。保险标的不合法使合同整体违反法律强制性规定和社会的公共利益，属于全部无效，而不是部分无效、条件无效；全部无效自始不产生法律效力。"},{"id":341,"ch":2,"kp":"5.1 保险合同的有效与无效","t":"s","q":"保险合同（    ）是由于某种事由的发生，使保险合同的效力暂时中止，待条件具备时合同效力仍可恢复。","o":["无效","失效","保全","复效"],"a":"B","e":"选B。失效即合同效力暂时中止，因法定或约定事由发生而暂停，条件具备时可复效恢复。无效是自始不产生效力且不能恢复；复效是恢复效力的行为而非效力状态。"},{"id":342,"ch":2,"kp":"5.1 保险合同的有效与无效","t":"s","q":"主体合意时保险合同的有效条件之一，主要指签订保险合同的当事人双方要合意，是建立在（    ）基础上的合意。","o":["保险利益","最大诚信","近因原则","损失补偿"],"a":"B","e":"选B。保险合同是最大诚信合同，主体合意须建立在双方如实告知、互不隐瞒的最大诚信基础上，欺诈或隐瞒下的\"同意\"不构成有效合意。保险利益是客体要件。"},{"id":343,"ch":2,"kp":"5.1 保险合同的有效与无效","t":"m","q":"下列属于保险合同全部无效的是（    ）。","o":["恶意重复保险合同","投保人对保险标的不具有保险利益","违反国家利益和社会利益的保险合同","保险标的不合法的保险合同"],"a":"BCD","e":"选BCD。投保人不具有保险利益、违反国家利益和社会公共利益、保险标的不合法的合同均属全部无效。恶意重复保险一般只是超过保险价值的部分无效，合同并非全部无效。"},{"id":344,"ch":2,"kp":"5.1 保险合同的有效与无效","t":"m","q":"无效保险合同的处理方式一般包括（    ）。","o":["返还财产","赔偿损失","中止待裁决","追缴财产"],"a":"ABD","e":"选ABD。无效保险合同的处理方式一般包括返还财产、赔偿损失和追缴财产。中止待裁决是效力待定合同的中间状态，不是对无效合同的处理方式。"},{"id":345,"ch":2,"kp":"5.1 保险合同的有效与无效","t":"j","q":"主体不合意的保险合同无效。","o":[],"a":"T","e":"正确。主体合意是保险合同有效的必要条件，一方因欺诈、胁迫或重大误解导致意思表示不真实、双方未真正合意的，合同无效。"},{"id":346,"ch":2,"kp":"5.2 保险合同的保全","t":"s","q":"保险合同（    ）的变更是指保险人、投保人、被保险人及受益人的变更。","o":["主体","客体","当事人","内容"],"a":"A","e":"选A。主体变更指合同当事人及关系人的变更，包括保险人、投保人、被保险人和受益人的变更。客体变更是保险标的的变更，内容变更是权利义务条款的变更。"},{"id":347,"ch":2,"kp":"5.2 保险合同的保全","t":"s","q":"保险合同的变更，主要包括保险合同主体的变更和（    ）的变更。","o":["保险合同客体","保险利益","保险标的","保险合同内容"],"a":"D","e":"选D。保险合同变更主要包括主体变更和内容变更两类，内容变更表现为保险金额、保险期限、保险责任范围、险种等条款事项的变更，客体变更已含于内容变更之中。"},{"id":348,"ch":2,"kp":"5.2 保险合同的保全","t":"s","q":"保险合同保全是指保险人根据合同约定及投保人、被保险人或者受益人的要求而提供的一系列（ ）合同效力的服务。","o":["维持","延续","暂停","终止"],"a":"A","e":"选A。保险合同保全是保险人为维持合同持续有效而提供的一系列服务，如合同变更、复效、保单贷款等，其目的是延续合同效力而非暂停或终止。"},{"id":349,"ch":2,"kp":"5.2 保险合同的保全","t":"s","q":"保险合同主体变更中不常见的是（）。","o":["保险人变更","投保人变更","被保险人变更","受益人变更"],"a":"A","e":"选A。保险人作为承保主体，其变更在实务中较少见；投保人、被保险人、受益人的变更则较为常见，如保单转让、指定或变更受益人等。"},{"id":350,"ch":2,"kp":"5.2 保险合同的保全","t":"s","q":"保险合同内容的变更是指保险合同主体享受的权利和承担的义务所发生的变更，表现为（    ）的变更。","o":["保险合同主体","保险合同客体","保险合同条款及事项","以上都是"],"a":"C","e":"选C。保险合同内容的变更表现为合同条款及事项的变更，如保险金额、保险期限、保险责任范围的调整。主体变更、客体变更是与内容变更并列的其他分类。"},{"id":351,"ch":2,"kp":"5.2 保险合同的保全","t":"s","q":"人寿保险合同的（    ）是指在保险合同存续期间，由于某种原因的发生而使保险合同的效力暂时失效。","o":["终止","中止","解除","复效"],"a":"B","e":"选B。中止指合同存续期间因未按期缴费等原因使效力暂时停止，在法定期限内可申请复效。终止是效力永久消灭，解除是提前消灭合同，复效是恢复效力的行为。"},{"id":352,"ch":2,"kp":"5.2 保险合同的保全","t":"s","q":"《中华人民共和国保险法》规定，合同约定分期支付保险费，投保人支付首期保险费后，除合同另有约定外，投保人超过约定的期限（    ）未支付当期保险费的，合同效力中止，或者由保险人按照合同约定的条件减少保险金额。","o":["30天","45天","60天","90天"],"a":"C","e":"选C。依《保险法》规定，分期缴费的合同，投保人支付首期保费后，超过约定期限六十日未支付当期保险费的，合同效力中止或由保险人按约定减少保险金额。"},{"id":353,"ch":2,"kp":"5.2 保险合同的保全","t":"s","q":"在合同中止期间发生的保险事故，保险人（    ）。","o":["照常承担赔偿或给付保险金的责任","按约定减少承担赔偿或给付保险金的责任","不承担赔偿或给付保险金的责任","责任依法裁定"],"a":"C","e":"选C。合同效力中止期间，合同暂不产生保障效力，保险人对该期间发生的保险事故不承担赔偿或给付保险金的责任，事故损失由投保方自行承担。"},{"id":354,"ch":2,"kp":"5.2 保险合同的保全","t":"s","q":"一般而言，保险合同复效的前提条件不包括（    ）。","o":["签订新保单","合同效力中止但尚未撤销","被保险人重新体检、提供健康声明、保险人重新核保","投保人补交保费及利息"],"a":"A","e":"选A。复效是恢复原合同的效力，不需另签新保单。复效须合同仅中止而未解除、被保险人经重新核保符合可保条件、投保人补交保费及其利息。"},{"id":355,"ch":2,"kp":"5.2 保险合同的保全","t":"j","q":"保险合同的复效是指保险人根据合同约定及投保人、被保险人或者受益人的要求而提供的一系列维持合同效力的服务。","o":[],"a":"F","e":"错误。题干把\"保全\"的定义安到了\"复效\"上。复效是合同效力中止后，经投保人申请、补交保费及利息并经保险人同意，使原合同恢复效力。"},{"id":356,"ch":2,"kp":"5.2 保险合同的保全","t":"j","q":"在财产保险合同中，保险单不随着保险标的所有权的转移而自动转让。","o":[],"a":"F","e":"错误。财产保险中保险利益随保险标的所有权转移，保险单通常随标的转让而转让，只需按规定通知保险人并办理批改，并非\"不随转移而自动转让\"。"},{"id":357,"ch":2,"kp":"5.2 保险合同的保全","t":"j","q":"在合同中止期间发生的保险事故，保险人不承担赔偿或给付保险金的责任。","o":[],"a":"T","e":"正确。合同效力中止期间合同暂不产生保障效力，保险人对该期间发生的保险事故不承担赔偿或给付保险金的责任，复效后保障才恢复。"},{"id":358,"ch":2,"kp":"5.2 保险合同的保全","t":"j","q":"在财产保险中，如果保险金额超过保险标的的保险价值，该保险合同无效。    （    ）","o":[],"a":"F","e":"错误。保险金额超过保险价值属超额保险，并非合同无效，只是超过部分无效，保险人按保险价值赔偿，超过部分对应的保险费应当退还。"},{"id":359,"ch":2,"kp":"5.3保险合同的终止","t":"s","q":"人身意外伤害保险中，被保险人因疾病而死亡，属于保险合同终止中的（    ）。","o":["自然终止","保险人保险赔付义务已经履行完毕而终止","因保险标的全部灭失而终止","因解除而终止"],"a":"C","e":"选C。人身意外伤害保险以被保险人的身体为保险标的，被保险人因疾病死亡使保险标的全部灭失，合同因此终止。该死亡不属意外伤害保险责任，故非赔付完毕终止。"},{"id":360,"ch":2,"kp":"5.3保险合同的终止","t":"s","q":"保险合同的解除方式不包括（    ）。","o":["约定解除","法定解除","裁决解除","强制解除"],"a":"D","e":"选D。保险合同解除方式包括约定解除、协商解除、法定解除和裁决解除。\"强制解除\"不是法律和实务中的解除方式，故不属于解除方式的范畴。"},{"id":361,"ch":2,"kp":"5.3保险合同的终止","t":"s","q":"合同当事人在订立保险合同时达成一致，在合同履行过程中，某种情形出现时，合同一方当事人可行使解除权，使合同的效力消灭，这属于保险合同解除中的（    ）。","o":["约定解除","协商解除","法定解除","裁决解除"],"a":"A","e":"选A。约定解除是双方在订立合同时事先约定解除条件，条件出现时一方即可行使解除权。协商解除是争议发生后双方另行合意解除，不以事先约定为条件。"},{"id":362,"ch":2,"kp":"5.3保险合同的终止","t":"s","q":"根据《保险法》，投保人因重大过失未履行如实告知义务，对保险事故的发生有严重影响的，保险人对保险合同解除前发生的保险事故（    ）","o":["不承担赔偿责任或给付保险金的责任，但应当退还保险费","不承担赔偿或给付保险金的责任，不退还保险费","根据双方协商，承担部分赔偿或给付保险金的责任，不退还保险费","根据双方协商，承担部分赔偿或给付保险金的责任，退还保险费"],"a":"A","e":"选A。投保人因重大过失未履行如实告知义务且对事故发生有严重影响的，保险人对解除前的事故不承担赔付责任，但应当退还保险费；故意不告知才不退保费。"},{"id":363,"ch":2,"kp":"5.3保险合同的终止","t":"s","q":"投保人故意未履行如实告知义务，对保险事故发生产生严重影响，保险人对于保险合同解除前发生的保险事故（    ）。","o":["承担赔偿或给付保险金的责任","不承担赔偿或给付保险金的责任，不退还保险费","不承担赔偿或给付的责任，退还保险费","承担部分赔偿或给付保险金的责任"],"a":"B","e":"选B。投保人故意不履行如实告知义务且对事故发生有严重影响的，保险人可解除合同，对解除前的事故不承担赔付责任并不退还保险费，以示对故意行为的制裁。"},{"id":364,"ch":2,"kp":"5.3保险合同的终止","t":"s","q":"根据《保险法》，已投保人身意外伤害险的被保险人在未通知保险人的情况下转行高危职业工作，由于投保人或被保险人未履行（    ），保险人有权解除保险合同。","o":["如实告知义务","维护保险标的安全义务","危险增加的通知义务","如实申报义务"],"a":"C","e":"选C。被保险人转行高危职业使危险程度显著增加而未通知保险人，违反的是危险增加的通知义务，保险人有权解除合同。如实告知义务针对的是订立合同时的询问事项。"},{"id":365,"ch":2,"kp":"5.3保险合同的终止","t":"s","q":"《中华人民共和国保险法》规定，保险标的发生部分损失的，在保险人赔偿后的（    ）内，投保人可以解除合同。","o":["15日","30日","60日","90日"],"a":"B","e":"选B。依《保险法》规定，保险标的发生部分损失的，保险人赔偿后三十日内投保人可以解除合同；保险人解除的，除合同另有约定外应提前十五日通知投保人。"},{"id":366,"ch":2,"kp":"5.3保险合同的终止","t":"s","q":"韩梅梅投保一年期家财险10万元，保险期限内火灾使保险财产全部被焚毁，保险人赔偿10万元后保单终止。该保单终止的原因属于（    ）。","o":["自然终止","保险人保险赔付义务履行完毕终止","因保险标的全部灭失而终止","因解除而终止"],"a":"B","e":"选B。保险人已按保险金额十万元全额赔付，赔付义务履行完毕，合同因此终止。因标的全部灭失而终止指未获赔付的灭失情形，本案例已赔偿完毕，故选B。"},{"id":367,"ch":2,"kp":"5.3保险合同的终止","t":"s","q":"保险合同终止的原因中，保险合同自然终止是指（    ）。","o":["保险合同期限届满而终止","保险人已经履行赔付或给付全部保险金义务","非保险事故造成保险标的灭失","保险合同被解除"],"a":"A","e":"选A。自然终止指保险合同期限届满、效力自然消灭，是终止最常见的原因。赔付完毕、标的灭失、合同解除都属特定情形下的终止原因，不是自然终止。"},{"id":368,"ch":2,"kp":"5.3保险合同的终止","t":"s","q":"根据《保险法》，投保人故意造成被保险人死亡、伤残或者疾病的，保险人不承担给付保险金的责任。投保人已交足2年以上保险费的，保险人应当按照合同约定向其他权利人（    ）。","o":["承担或给付部分保险金","不承担或给付保险金，并退还保险费","退还保险单的现金价值","不承担或给付保险金，并不退还保险费"],"a":"C","e":"选C。投保人故意造成被保险人死亡、伤残或疾病属道德风险，保险人不承担给付责任；已交足二年以上保费的，应向其他权利人退还保单现金价值，而非退还保费或给付保险金。"},{"id":369,"ch":2,"kp":"5.3保险合同的终止","t":"s","q":"根据《中华人民共和国保险法》，（    ）中，保险责任开始后，合同当事人不得解除合同。","o":["家庭财产保险合同","机动车辆保险合同","货物运输合同","人身意外伤害保险合同"],"a":"C","e":"选C。货物运输保险合同和运输工具航程保险合同，保险责任开始后当事人不得解除合同，因运输风险与费用已确定，需维护交易的稳定性。"},{"id":370,"ch":2,"kp":"5.3保险合同的终止","t":"s","q":"根据《保险法》，投保人或被保险人未履行维护保险标的安全义务，保险人有权利（    ）。","o":["变更保险合同","减少保险费","减少保险金额","解除保险合同"],"a":"D","e":"选D。投保人、被保险人未按约定履行维护保险标的安全义务的，保险人有权要求增加保险费或者解除合同，这是法律赋予保险人的救济手段，故本题选解除合同。"},{"id":371,"ch":2,"kp":"5.3保险合同的终止","t":"s","q":"保险合同终止的最普遍、最基本的原因是（    ）。","o":["自然终止","保险人保险赔付义务已经履行完毕而终止","因保险标的全部灭失而终止","因解除而终止"],"a":"A","e":"选A。自然终止即保险期限届满而合同效力消灭，是保险合同终止最普遍、最基本的原因；赔付完毕、标的灭失、因解除终止均属个别情形。"},{"id":372,"ch":2,"kp":"5.3保险合同的终止","t":"s","q":"在财产保险中，被保险人未按合同约定，将财产保险的保险标的危险显著增加的情况及时通知保险人，对因保险标的危险程度显著增加而发生的保险事故，保险人（    ）。","o":["承担赔偿保险金的责任","不承担赔偿保险金的责任","只按原承保风险与新风险的比例赔偿保险金","承担赔偿保险金的责任，但投保人必须补缴保费"],"a":"B","e":"选B。保险标的危险程度显著增加而未及时通知保险人的，对因该危险增加所发生的保险事故，保险人不承担赔偿责任；保险人还可要求增加保费或解除合同。"},{"id":373,"ch":2,"kp":"5.3保险合同的终止","t":"s","q":"保险合同终止最普遍、最基本的原因是（    ）。","o":["保险合同届满终止","保险标的灭失而终止","保险人完全履约而终止","因法定情况出现而终止"],"a":"A","e":"选A。保险合同届满终止即自然终止，是合同终止最普遍、最基本的原因。标的灭失、完全履约、法定解除均属特定情形下的终止，不具有普遍性。"},{"id":374,"ch":2,"kp":"5.3保险合同的终止","t":"s","q":"下列情况中，保险人无权解除保险合同的是（    ）。","o":["保险标的危险程度增加并未通知保险人","被保险人欺诈索赔","投保人未履行维护保险标的安全义务","货物运输保险标的未经保险人同意而转让"],"a":"D","e":"选D。货物运输保险中，保险责任开始后当事人不得解除合同，且运输货物保单可随货物转让，保险人无权因未经其同意转让而解除。A、B、C均为法定解除情形。"},{"id":375,"ch":2,"kp":"5.3保险合同的终止","t":"m","q":"下列情况中保险人可以解除保险合同的包括（    ）。","o":["投保人未履行维护保险标的安全义务","保险标的发生部分损失","被保险人未履行危险增加的通知义务","投保人不履行如实告知义务"],"a":"ABCD","e":"选ABCD。危险程度增加未通知、被保险人欺诈索赔、未履行维护标的安全义务、投保人不履行如实告知义务，均属保险人可解除合同的法定或约定情形；部分损失后保险人亦可解除。"},{"id":376,"ch":2,"kp":"5.3保险合同的终止","t":"m","q":"在投保人未履行如实申报年龄的情况下，保险人行使解除合同权时必须同时具备的条件是（    ）。","o":["投保人申报的被保险人年龄不真实，且保险人不知投保人未如实申报","被保险人的真实年龄不符合合同约定","保险合同成立不满两年","投保人缴纳保费不足一年"],"a":"ABC","e":"选ABC。年龄误告解除须同时具备三个条件：申报年龄不真实且保险人不知情、被保险人的真实年龄不符合合同约定、合同成立不满二年。缴费不足一年不是解除条件。"},{"id":377,"ch":2,"kp":"5.3保险合同的终止","t":"m","q":"以下情形，保险人有权要求增加保险费或解除保险合同的是（    ）。","o":["保险标的的危险程度显著增加","被保险人被第三方提起诉讼","投保人、被保险人未履行维护保险标的安全的义务","被保险人变更指定受益人"],"a":"AC","e":"选AC。保险标的危险程度显著增加，以及投保人、被保险人未履行维护标的安全义务，保险人有权要求增加保险费或解除合同。被保险人被起诉、变更受益人不影响承保风险。"},{"id":378,"ch":2,"kp":"5.3保险合同的终止","t":"j","q":"投保人故意隐瞒事实，不履行如实告知义务，若未影响保险人决定是否承保和适用保险费率时，保险人无权解除保险合同。","o":[],"a":"F","e":"错误。按教材口径，投保人故意隐瞒事实属于故意违反如实告知义务，保险人可据此解除合同，题干以“未影响”为由否定解除权不能成立；若为过失未告知，才着重判断是否足以影响承保或提高费率。"},{"id":379,"ch":2,"kp":"5.3保险合同的终止","t":"j","q":"投保人故意造成被保险人死亡、伤残或者疾病的，保险人不承担给付保险金的责任。投保人已交足2年以上保险费的，保险人应当按照合同约定向其他权利人退还保险单的现金价值。","o":[],"a":"T","e":"正确。投保人故意造成被保险人死亡、伤残或疾病属道德风险，保险人不承担给付保险金的责任；已交足二年以上保费的，应向其他权利人退还保单现金价值。"},{"id":380,"ch":2,"kp":"5.3保险合同的终止","t":"j","q":"货物运输保险合同自保险责任开始后，保险人和投保人都不得解除合同。","o":[],"a":"T","e":"正确。货物运输保险及运输工具航程保险，保险责任开始后保险人与投保人均不得解除合同，以适应运输经营对保障稳定性、不可撤销性的要求。"},{"id":381,"ch":2,"kp":"5.3保险合同的终止","t":"j","q":"投保人未按约定履行支付保险费义务，合同效力中止后起3年内双方未就恢复合同效力达成协议的，保险人有权解除合同。","o":[],"a":"F","e":"错误。合同效力中止后，自中止之日起满二年双方未就恢复效力达成协议的，保险人有权解除合同；题干把\"二年\"误写成\"三年\"，故表述错误。"},{"id":382,"ch":2,"kp":"6.1 保险合同条款的解释原则","t":"s","q":"（    ）一般只能适用于文义不清、条款用词不准确、混乱模糊的情形。","o":["文义解释原则","意图解释原则","补充解释原则","交叉解释原则"],"a":"B","e":"选B。意图解释原则一般只适用于文义不清、条款用词不准确、含义混乱模糊的情形，此时才需据订约背景探求真实意图。文义解释是首要和常规的解释方法。"},{"id":383,"ch":2,"kp":"6.1 保险合同条款的解释原则","t":"s","q":"在保险合同条款的解释原则中，（    ）在解释时要根据保险合同的文字、订约时的背景、客观实际情况进行分析推定。","o":["文义解释原则","意图解释原则","有利于被保险人和受益人的解释原则","批注优于正文，后批优于先批的解释原则"],"a":"B","e":"选B。意图解释原则根据保险合同的文字、订约时的背景和客观实际情况分析推定当事人的真实意图。文义解释只按通常文字含义并结合上下文解释。"},{"id":384,"ch":2,"kp":"6.1 保险合同条款的解释原则","t":"s","q":"保险合同条款的解释原则中，按照保险合同条款通常的文字并结合上下文解释的原则是（    ）。","o":["文义解释原则","意图解释原则","学理解释原则","补充解释原则"],"a":"A","e":"选A。文义解释原则按照条款通常的文字含义并结合上下文进行解释，是最基本、最优先的解释方法。学理解释不是条款解释原则，补充解释用于填补条款遗漏。"},{"id":385,"ch":2,"kp":"6.1 保险合同条款的解释原则","t":"s","q":"关于保险合同条款的解释原则，下列说法中错误的是（    ）。","o":["文义解释原则中专门术语应按本行业的通用含义解释","意图解释原则只能适用于文义不清、条款用词不准确、混乱模糊的情形","当保险条款出现含糊不清的意思时，应作出有利于保险人的解释","当合同有修正时，采用批注优于正文、后批优于先批的原则"],"a":"C","e":"选C。条款含义含糊不清时，应作出有利于被保险人和受益人的解释，而非有利于保险人。A、B、D均为教材关于文义解释、意图解释和批注优先规则的正确表述。"},{"id":386,"ch":2,"kp":"6.1 保险合同条款的解释原则","t":"s","q":"下列不属于保险合同条款解释原则的是（    ）。","o":["文义解释原则","意图解释原则","司法解释原则","补充解释原则"],"a":"C","e":"选C。条款解释原则包括文义解释、意图解释、补充解释以及批注优于正文、后批优于先批等规则。司法解释是条款解释效力的分类，不属于解释原则。"},{"id":387,"ch":2,"kp":"6.1 保险合同条款的解释原则","t":"m","q":"保险合同条款的解释原则包括（    ）。","o":["意图解释原则","司法解释原则","学理解释原则","补充解释原则"],"a":"AD","e":"选AD。解释原则包括文义解释、意图解释和补充解释等，故A、D正确。司法解释属解释效力的分类，学理解释是学理上的无权解释，二者都不是条款解释原则。"},{"id":388,"ch":2,"kp":"6.1 保险合同条款的解释原则","t":"j","q":"在保险合同存在修正并且与原合同相矛盾时，应采用正文优于批注、书写优于打印、后批优于先批的解释原则。","o":[],"a":"F","e":"错误。正确的规则是批注优于正文、书写优于打印、后批优于先批；题干把\"批注优于正文\"颠倒为\"正文优于批注\"，故表述错误。"},{"id":389,"ch":2,"kp":"6.1 保险合同条款的解释原则","t":"j","q":"在保险合同条款的解释原则中，按照保险合同通常的文字含义并结合上下文解释的原则是学理解释原则。","o":[],"a":"F","e":"错误。按合同通常文字含义并结合上下文解释的是文义解释原则，不是学理解释原则；学理解释是学者和社会团体对法律所作的法理性解释，不具法律效力。"},{"id":390,"ch":2,"kp":"6.2保险合同条款的解释效力","t":"s","q":"保险合同条款的解释中，保监会对保险合同条款中有关规章类或视同规章部分的解释属于（    ）。","o":["仲裁解释","立法解释","司法解释","行政解释"],"a":"D","e":"选D。保险监管机关对合同条款中有关规章类或视同规章部分的解释属于行政解释。立法解释由立法机关作出，司法解释由法院作出，仲裁解释由仲裁机构在裁决中作出。"},{"id":391,"ch":2,"kp":"6.2保险合同条款的解释效力","t":"s","q":"保险合同条款的解释中，全国人大常委会对《中华人民共和国保险法》的解释属于（    ）。","o":["司法解释","仲裁解释","行政解释","立法解释"],"a":"D","e":"选D。全国人大常委会对《保险法》所作的解释属于立法解释，因其是立法机关对法律本身含义的阐明。司法解释由司法机关作出，行政解释由行政机关作出。"},{"id":392,"ch":2,"kp":"6.2保险合同条款的解释效力","t":"m","q":"对保险合同条款的解释中，属于有权解释的是（    ）。","o":["学理解释","仲裁解释","行政解释","立法解释"],"a":"BCD","e":"选BCD。有权解释是具有法律约束力的解释，包括立法解释、司法解释、行政解释和仲裁解释。学理解释无法定约束力，属无权解释。"},{"id":393,"ch":2,"kp":"6.2保险合同条款的解释效力","t":"j","q":"学理解释是指一般社会团体、专家学者等对法律、法规所进行的法理性的解释。这些解释不具有法律效力。","o":[],"a":"T","e":"正确。学理解释是一般社会团体、专家学者从法理角度对法律法规所作的解释，仅供理解和参考，不具有法律约束力，属于无权解释。"},{"id":394,"ch":2,"kp":"6.2保险合同条款的解释效力","t":"j","q":"对于保险人单方面制定或保险人与投保人协商制定的条款，其解释权在保险人手中。","o":[],"a":"F","e":"错误。条款解释权不由保险人单方掌握；对保险人单方制定的格式条款发生争议时，应作有利于被保险人和受益人的解释，双方协商制定的条款按通常解释规则处理。"},{"id":395,"ch":2,"kp":"7.1 保险合同纠纷产生的原因","t":"m","q":"保险合同纠纷产生的原因主要包括（    ）。","o":["保险公司的原因导致的纠纷","投保方的原因导致的纠纷","被保险人的原因导致的纠纷","受益人的原因导致的纠纷"],"a":"AB","e":"选AB。教材把保险合同纠纷产生的原因归纳为保险公司的原因和投保方的原因两大类；投保方已涵盖投保人、被保险人、受益人，故C、D不再单列。"},{"id":396,"ch":2,"kp":"7.2保险合同纠纷的处理方式","t":"s","q":"保险合同纠纷中，争议双方在第三方机构组织下，通过谈判、协商以和解方式解决纠纷的方式叫做（    ）。","o":["协商","仲裁","调解","诉讼"],"a":"C","e":"选C。调解是在第三方机构组织下，双方通过谈判协商以和解方式解决纠纷。协商由双方自行沟通、无第三方介入；仲裁和诉讼由仲裁机构或法院裁决。"},{"id":397,"ch":2,"kp":"7.2保险合同纠纷的处理方式","t":"s","q":"在保险合同纠纷的处理方式中，仲裁实行（    ）的制度，并在裁决书作出之日发生法律效力。","o":["“一裁终局”","“一审一裁”","“两审终审”","“两裁终裁”"],"a":"A","e":"选A。仲裁实行\"一裁终局\"制度，裁决书作出之日即发生法律效力，当事人不得就同一纠纷再申请仲裁或提起诉讼。\"两审终审\"是诉讼审级制度。"},{"id":398,"ch":2,"kp":"7.2保险合同纠纷的处理方式","t":"s","q":"（ ）是指合同双方在自愿、互谅、实事求是的基础之上，对出现的争议直接沟通，有好磋商，消除纠纷，求大同存小异，对争议问题达成一致意见，自行解决争议的方式。","o":["诉讼","仲裁","协商","调解"],"a":"C","e":"选C。协商是合同双方在自愿、互谅、实事求是基础上直接沟通、友好磋商，自行达成一致以解决争议。调解有第三方机构组织，仲裁和诉讼由裁判机构处理。"},{"id":399,"ch":2,"kp":"7.2保险合同纠纷的处理方式","t":"m","q":"保险合同纠纷的处理方式包括（    ）。","o":["协商","仲裁","事实发现法","替代争议解决方式"],"a":"AB","e":"选AB。保险合同纠纷的处理方式中，协商与仲裁是教材明确列举的具体方式。事实发现法属于理赔调查的方法，替代争议解决方式是对非诉讼方式的统称，不属于本题所指的处理方式。"},{"id":400,"ch":2,"kp":"7.2保险合同纠纷的处理方式","t":"m","q":"下列关于保险合同纠纷的处理方式说法正确的是（    ）。","o":["协商是争议双方在第三方机构组织下，通过谈判、协商以和解方式解决纠纷的方式。","仲裁协议可以是订立合同时的仲裁条款，也可以是在争议发生前、发生时、发生后达成的仲裁协议","主要的调解机构包括仲裁委员会、法院、人民调解委员会等。","在我国，保险合同纠纷案属民事诉讼"],"a":"BCD","e":"选BCD。仲裁协议可为合同中的仲裁条款，也可在争议发生前、发生时或发生后达成；调解机构包括仲裁委员会、法院、人民调解委员会；保险合同纠纷属民事诉讼。A错，有第三方组织的应为调解。"},{"id":401,"ch":2,"kp":"7.2保险合同纠纷的处理方式","t":"j","q":"保险合同纠纷的处理方式中，因保险合同纠纷提起的诉讼，如果保险标的物是运输工具或者运输中货物，由被告住所地或者运输工具登记注册地、运输目的地、保险事故发生地的人民法院管辖。","o":[],"a":"T","e":"正确。因保险合同纠纷提起的诉讼，保险标的物为运输工具或运输中货物的，由被告住所地或运输工具登记注册地、运输目的地、保险事故发生地法院管辖。"},{"id":402,"ch":2,"kp":"7.2保险合同纠纷的处理方式","t":"j","q":"在保险合同纠纷的处理方式中，仲裁是解决争议最激烈的方式。","o":[],"a":"F","e":"错误。解决争议最激烈的方式是诉讼，而非仲裁；仲裁具有自愿、灵活、保密和一裁终局的特点，程序相对缓和，题干把诉讼的特征安到了仲裁上。"},{"id":403,"ch":3,"kp":"1.1 保险利益及其确立条件","t":"s","q":"（    ）是指投保人或被保险人对投保标的所具有的法律上承认的利益。","o":["经济利益","保险利益","保险金额","法定利益"],"a":"B","e":"选B。保险利益是投保人或被保险人对投保标的所具有的法律上承认的利益。A经济利益只是保险利益须具备的条件之一；C保险金额是保险人赔偿或给付的最高限额；D法定利益并非教材用语。"},{"id":404,"ch":3,"kp":"1.1 保险利益及其确立条件","t":"s","q":"在海洋运输货物保险中，依据国际保险惯例，如果贸易价格采用到岸价格即CIF价格，那么，海洋运输货物保险的保险金额的确定就允许在成本、保险费、运费的基础上再另加10%，即按货物CIF价格的110%投保。这10%属于保险利益中的（    ）。","o":["现有利益","期待利益","约定利益","超额利益"],"a":"B","e":"选B。期待利益是基于现有利益在未来可以获得的利益，货物运抵目的地后的预期利润即属此类，故CIF价另加10%为期待利益。A现有利益是投保时已存在的利益；C、D不是保险利益的分类。"},{"id":405,"ch":3,"kp":"1.1 保险利益及其确立条件","t":"s","q":"根据保险利益的确立条件，投保人对下列（  ）财产不具有确定的保险利益。","o":["企业根据生产计划，预期到年终能够实现的营业利润","房屋出租人根据租凭合同应该取得的预期租金","具有民事行为能力的自然人计划在明年购买的房产","人身保险中，具有抚养关系的被保险人"],"a":"C","e":"选C。计划明年购买的房产尚未取得，既无现有利益，也无基于既存权利的期待利益，不属确定的保险利益。A预期营业利润、B预期租金均属期待利益；D人身保险中抚养关系可产生保险利益。"},{"id":406,"ch":3,"kp":"1.1 保险利益及其确立条件","t":"s","q":"保险利益必须是确定的利益，包括（    ）。","o":["现有利益和期待利益","将有利益和期待利益","合法利益和期待利益","现有利益和合法利益"],"a":"A","e":"选A。保险利益必须是确定的利益，包括现有利益和期待利益两类。B将有利益不是规范表述；合法利益是保险利益的另一项独立条件，C、D把它混入确定利益的分类。"},{"id":407,"ch":3,"kp":"1.1 保险利益及其确立条件","t":"s","q":"保险利益必须是经济利益。经济利益是指投保人对投保标的的利益必须是能够以货币来计算、衡量和估价的利益。人生的生命或身体虽然无价，但在某些情况下。人身保险的保险利益也是可以计算的，例如（    ）。","o":["父母对子女生命的保险利益","雇主对雇员生命的保险利益","债权人对债务人生命的保险利益","祖父母对孙女生命的保险利益"],"a":"C","e":"选C。债权人对债务人生命的保险利益以债权数额为限，可以金钱计算，是人身保险中保险利益可计算的情形。A、B、D基于亲属、抚养或雇佣关系产生，不以具体金额计算。"},{"id":408,"ch":3,"kp":"1.1 保险利益及其确立条件","t":"s","q":"赵女士通过房屋抵押向A银行购买一套价值1000万元的房屋，赵女士自付100万，贷款900万，两年后赵女士偿还贷款200万，此时银行对该房屋的保险利益为（    ）。","o":["700万元","800万元","900万元","1000万元"],"a":"A","e":"选A。银行是抵押权人，其保险利益以未偿还贷款余额为限，900万元贷款已偿还200万元，故为700万元。B、C、D或按房屋价值或按原贷款额计算，均超过银行实际利益。"},{"id":409,"ch":3,"kp":"1.1 保险利益及其确立条件","t":"s","q":"保险利益为确定的经济利益，即指（    ）。","o":["现有利益","期待利益","现有利益和期待利益","任何经济利益"],"a":"C","e":"选C。保险利益为确定的经济利益，既包括现有利益，也包括基于现有利益产生的期待利益。A、B只取其一，不完整；D任何经济利益过宽，还须为法律承认且确定。"},{"id":410,"ch":3,"kp":"1.1 保险利益及其确立条件","t":"s","q":"下列关于保险利益的确立条件说法错误的是（    ）。","o":["任何损害社会公共利益而产生的利益都不能作为保险利益","保险利益必须是确定的利益，因此投保人或被保险人可以为其现有利益投保，但不可以为其期待利益投保","不能用货币计量其价值的利益不能称为保险利益","在人身保险中，投保人在订立保险合同时必须与被保险人之间存在已经确定的既存利害关系"],"a":"B","e":"选B。确定利益包括现有利益和期待利益，期待利益同样可以投保，B的后半句说反了。A体现合法性要求；C体现经济性要求；D符合人身保险保险利益须于订约时存在的要求。"},{"id":411,"ch":3,"kp":"1.1 保险利益及其确立条件","t":"m","q":"下列关于保险利益的确立条件说法正确的是（    ）。","o":["投保人违反公序良俗的行为所取得的利益，不具有保险利益","保险利益必须是确定的利益，包括现有利益和期待利益","保险利益必须是经济利益，某些无价的古董、名人字画无法成为保险利益","房屋出租人根据租凭合同应该取得的预期租金可以作为保险利益"],"a":"ABD","e":"选ABD。保险利益须合法、确定、有经济价值：违反公序良俗取得的利益不具保险利益，现有利益与期待利益均可，预期租金属期待利益。C错，古董字画可以估价，能成为保险利益。"},{"id":412,"ch":3,"kp":"1.1 保险利益及其确立条件","t":"j","q":"投保人或被保险人损害公共利益而取得的利益不能作为保险利益。","o":[],"a":"T","e":"正确。保险利益必须是法律承认的利益，损害社会公共利益或违反公序良俗取得的利益不受法律保护，不能作为保险利益，否则将诱发道德风险。"},{"id":413,"ch":3,"kp":"1.1 保险利益及其确立条件","t":"j","q":"在某些情况下，人身保险的保险利益也是可以计算的，如雇主对雇员生命的保险利益，可以以其生产价值为限。","o":[],"a":"F","e":"错误。人身保险中保险利益可按金额计算的是债权人对债务人的保险利益，以债权额为限；雇主对雇员基于雇佣关系产生保险利益，不能按生产价值计算。"},{"id":414,"ch":3,"kp":"1.1 保险利益及其确立条件","t":"j","q":"体现保险双方当事人履行各自权利与义务关系的依据是保险利益。（    ）","o":[],"a":"F","e":"错误。体现保险双方权利义务关系依据的是保险合同，保险利益是保险合同的有效要件和保障对象，不是双方权利义务的依据。"},{"id":415,"ch":3,"kp":"1.2 保险利益原则的含义及意义","t":"s","q":"在财产保险中，当保险标的发生保险事故时，只有对受损标的具有（    ）的被保险人才具有索赔资格。","o":["保险凭证","合法所有权","保险利益","确定经济利益"],"a":"C","e":"选C。财产保险坚持保险利益原则，事故发生时只有对受损标的具有保险利益的被保险人才能索赔。A保险凭证只是合同凭证；B所有权仅为保险利益来源之一；D是保险利益的性质。"},{"id":416,"ch":3,"kp":"1.2 保险利益原则的含义及意义","t":"s","q":"关于坚持保险利益原则的意义，下列说法不正确的是（    ）。","o":["划清保险和赌博的界线","防止逆向选择的发生","防止道德风险的发生","界定保险人承担赔偿或给付责任的最高限额"],"a":"B","e":"选B。保险利益原则的意义在于划清保险与赌博的界线、防止道德风险、界定保险人赔偿或给付的最高限额。B防止逆向选择主要与最大诚信原则的告知义务相关，不属该原则的意义。"},{"id":417,"ch":3,"kp":"1.2 保险利益原则的含义及意义","t":"s","q":"在坚持保险利益原则的意义中，如果允许投保人以不具有保险利益的保险标的投保，那么就意味着该标的受损对他而言不仅没有损失。而且还可以获得保险赔偿，就可能诱发投保人为谋取保险赔款故意破坏保险标的的行为，即坚持保险利益（    ）。","o":["从根本上划清了保险和赌博的界线","有效防止道德风险发生","有效防止逆向选择","界定了保险人承担赔偿的最高限额"],"a":"B","e":"选B。无保险利益而投保，标的受损对投保人并无损失却可获赔，会诱发故意破坏标的骗赔，属道德风险，故坚持保险利益原则可有效防止道德风险。A针对赌博；C、D与题干情形不符。"},{"id":418,"ch":3,"kp":"1.2 保险利益原则的含义及意义","t":"s","q":"在保险的基本原则中，根据（    ），即使是已经生效的财产保险合同，如果投保人或被保险人失去了对保险标的拥有的保险利益，保险合同也会随着失效。","o":["最大诚信原则","近因原则","保险利益原则","损失补偿原则"],"a":"C","e":"选C。保险利益原则要求被保险人在事故发生时对保险标的具有保险利益，已生效的财产保险合同若丧失保险利益，合同随之失效。A、B、D均不产生此种效果。"},{"id":419,"ch":3,"kp":"1.2 保险利益原则的含义及意义","t":"m","q":"在安装工程保险中，对安装工程具有保险利益的是（    ）。","o":["承包人","工程所有人","技术顾问","工程师"],"a":"ABCD","e":"选ABCD。安装工程保险中，工程所有人、承包人、分包人、技术顾问、工程师以及贷款银行等对工程均具有保险利益，都可能因工程受损而遭受经济损失。"},{"id":420,"ch":3,"kp":"1.2 保险利益原则的含义及意义","t":"m","q":"根据保险利益原则，下列投保行为无效的是（    ）。","o":["李先生为自己购买的体育彩票购买保险","赵女士为自己仍未出生的胎儿购买保险","钱先生为自家门前马路上的路灯购买保险","孙女士为本公司老板购买人身保险"],"a":"ACD","e":"选ACD。彩票具有射幸性、路灯属公共财产、公司老板与孙女士无法定保险利益关系，三项投保均无效。B未选，母亲与未出生子女有血亲关系，被视为具有保险利益的情形。"},{"id":421,"ch":3,"kp":"1.2 保险利益原则的含义及意义","t":"j","q":"保险利益原则是保险的基本原则，其本质内容是要求保险人必须对投保标的具有保险利益。","o":[],"a":"F","e":"错误。保险利益原则要求投保人或被保险人对保险标的具有保险利益，而不是要求保险人具有保险利益，题干把主体说反了。"},{"id":422,"ch":3,"kp":"1.2 保险利益原则的含义及意义","t":"j","q":"当保险标的因保险责任事故的发生遭到损失时，被保险人在某些情况下能获得超过保险利益的赔偿。","o":[],"a":"F","e":"错误。保险利益原则界定了赔偿的最高限额，被保险人获得的赔偿不能超过其对保险标的具有的保险利益，不能因发生事故而获得额外利益。"},{"id":423,"ch":3,"kp":"1.2 保险利益原则的含义及意义","t":"j","q":"保险与赌博均是基于偶然事件的发生而获益或受损。","o":[],"a":"T","e":"正确。保险与赌博都以偶然事件的发生为条件，但保险以保险利益和损失补偿为限，赌博则无此限制，这正是保险利益原则划清二者界线的原因。"},{"id":424,"ch":3,"kp":"1.2 保险利益原则的含义及意义","t":"j","q":"保险利益原则的限定有效地控制了道德风险的重要诱因，保护了被保险人的生命安全与被保险财产的安全。","o":[],"a":"T","e":"正确。保险利益原则要求投保人不能为无保险利益的标的投保，从源头上减少了为骗取赔款而故意制造事故的诱因，从而保护被保险人的生命安全和财产安全。"},{"id":425,"ch":3,"kp":"1.2 保险利益原则的含义及意义","t":"j","q":"保险合同保障的是被保险人的保险利益，补偿的是受益人的经济利益损失。","o":[],"a":"F","e":"错误。保险合同保障的是被保险人的保险利益，补偿的是被保险人因保险事故遭受的经济损失；受益人只在人身保险中享有保险金请求权，不是补偿对象。"},{"id":426,"ch":3,"kp":"1.2 保险利益原则的含义及意义","t":"j","q":"保险人的赔偿金额不能超过保险利益。","o":[],"a":"T","e":"正确。保险利益是保险人赔偿的最高限额，赔偿金额不能超过被保险人对保险标的所具有的保险利益，以防止被保险人获得额外利益。"},{"id":427,"ch":3,"kp":"1.3保险利益原则在实务中的应用","t":"s","q":"周先生通过抵押贷款购买一辆50万元的机动车，自付20万，银行贷款30万，一年后周先生偿还贷款20元，此时银行对此机动车的保险利益是（    ）。","o":["10万","20万","30万","50万"],"a":"A","e":"选A。银行作为抵押权人，保险利益以未偿还贷款余额为限，30万元贷款已偿还20万元，剩余10万元。B、C、D或按原贷款额或按车辆价值计算，均超出银行实际利益。"},{"id":428,"ch":3,"kp":"1.3保险利益原则在实务中的应用","t":"s","q":"雇主对雇员在受雇期间因从事与职业行为有关的工作而患职业病或伤、残、亡等依法应承担的医疗费、工伤补贴等属于（    ）的保险利益。","o":["财产损失保险","责任保险","信用保险","人身保险"],"a":"B","e":"选B。雇主依法对雇员职业病、伤残、死亡承担的医疗费、工伤补贴等，是被保险人依法应负的赔偿责任，属责任保险的保险利益。A、C、D与赔偿责任的性质不符。"},{"id":429,"ch":3,"kp":"1.3保险利益原则在实务中的应用","t":"s","q":"在经济交往中，权利人与义务人之间基于各类经济合同而存在经济上的利益关系。一般而言，义务人大多是应权利人的要求而以其自己的信用为标的购买（    ）。","o":["财产损失保险","责任保险","信用保险","保证保险"],"a":"D","e":"选D。义务人应权利人要求，以自己的信用为标的投保的是保证保险，保障权利人因义务人违约遭受的损失。A、B与信用无关；C信用保险由权利人投保。"},{"id":430,"ch":3,"kp":"1.3保险利益原则在实务中的应用","t":"s","q":"在经济交往中，权利人与义务人之间基于各类经济合同而存在经济上的利益关系。当权利人对义务人的信用有担心时，可以以义务人的信用为标的购买（    ）。","o":["财产损失保险","责任保险","信用保险","保证保险"],"a":"C","e":"选C。权利人对义务人的信用有担心时，以义务人的信用为标的投保的是信用保险，由权利人作为投保人。D保证保险由义务人为自己的信用投保；A、B与信用风险无关。"},{"id":431,"ch":3,"kp":"1.3保险利益原则在实务中的应用","t":"s","q":"在人身保险的保险利益确定中，投保时下列哪种情况中保险利益无法形成（    ）。","o":["父母与子女之间","养父母与子女之间","债权人与债务人之间","离异夫妻之间"],"a":"D","e":"选D。夫妻离婚后已无法定亲属关系，相互之间不再具有保险利益。A父母子女、B养父母与养子女、C债权人与债务人均属法律承认的保险利益关系。"},{"id":432,"ch":3,"kp":"1.3保险利益原则在实务中的应用","t":"s","q":"人身保险中，下列情况中不具有保险利益的是（    ）。","o":["保证人对被保证人","债务人对债权人","父母对子女","雇主对雇员"],"a":"B","e":"选B。人身保险中债权人对债务人有保险利益，债务人对债权人则没有，方向相反。A保证人对被保证人、C父母对子女、D雇主对雇员均有保险利益。"},{"id":433,"ch":3,"kp":"1.3保险利益原则在实务中的应用","t":"s","q":"2007年，吴某为其妻子投保一份10年期人寿保险，2010年两人离婚，则该保险合同（    ）。","o":["自然终止","效力中止","继续生效","自动解除"],"a":"C","e":"选C。人身保险只要求投保人在订立合同时对被保险人具有保险利益，合同存续期间离婚并不导致合同失效，故合同继续有效。A、B、D均无法律依据。"},{"id":434,"ch":3,"kp":"1.3保险利益原则在实务中的应用","t":"s","q":"在海洋运输货物保险中，对于投保人的保险利益时效规定是（    ）。","o":["投保人必须在投保时对保险标的具有保险利益","投保人必须在订立合同时对保险标的具有保险利益","投保人必须在运输时对保险标的具有保险利益","投保人必须在损失发生时对保险标的具有保险利益"],"a":"D","e":"选D。海洋运输货物保险中，投保时投保人可以不具有保险利益，但损失发生时被保险人必须具有保险利益。A、B、C均不符合货物运输保险的时效规定。"},{"id":435,"ch":3,"kp":"1.3保险利益原则在实务中的应用","t":"s","q":"在保险利益原则中，投保时投保人必须具有保险利益，但在索赔时保险人不追究有无保险利益的规定，适用的险种是（    ）。","o":["船舶保险","终身人寿保险","职业责任保险","信用保证保险"],"a":"B","e":"选B。人身保险（含终身人寿保险）只要求在订立合同时具有保险利益，索赔时不再追究。A船舶保险、C职业责任保险、D信用保证保险均属财产保险，须在事故发生时具有保险利益。"},{"id":436,"ch":3,"kp":"1.3保险利益原则在实务中的应用","t":"s","q":"下列关于保险利益原则说法错误的是（    ）。","o":["在抵押贷款中，抵押权人对抵押财产所具有的保险利益只限于他所贷出款项的额度","义务人为自己的信用购买保险称为信用保险","财产保险中，投保人在合同订立时无需对保险标的具有保险利益","人身保险订立合同时，投保人对被保险人不具有保险利益的，合同无效"],"a":"B","e":"选B。义务人为自己的信用投保称为保证保险，由权利人投保的才是信用保险，B把二者说反了。A、C、D分别符合抵押权人保险利益范围、财产险时效和人身险订约要件。"},{"id":437,"ch":3,"kp":"1.3保险利益原则在实务中的应用","t":"s","q":"财产保险的保险利益产生于(  )的关系。","o":["人与人","人与物","物与物","没有关系"],"a":"B","e":"选B。财产保险的保险利益是投保人或被保险人与保险标的（物）之间的关系，表现为因物受损而遭受经济损失；人身保险的保险利益才是人与人之间的关系。"},{"id":438,"ch":3,"kp":"1.3保险利益原则在实务中的应用","t":"s","q":"在人身保险中，投保人对被保险人的保险利益分为两种情况，即（   ）对被保险人的保险利益。","o":["专属投保人和非专属投保人","直属投保人和非直属投保人","直接投保人和非直接投保人","以上都不是"],"a":"A","e":"选A。人身保险中，投保人对被保险人的保险利益分为专属投保人的保险利益和非专属投保人的保险利益。B、C、D均为生造表述，不符合教材分类。"},{"id":439,"ch":3,"kp":"1.3保险利益原则在实务中的应用","t":"m","q":"在财产损失保险中,投保人具有保险利益的情况包括（  ）。","o":["医生对因其工作上的疏忽或过失而造成他人人身伤害或财产损失的经济赔偿责任","经营者对其合法的预期利益","在经济交往中，权利人对义务人的信用","货物所有人对其货物"],"a":"BD","e":"选BD。财产损失保险的保险利益表现为对标的本身及其预期利益的经济利益，货物所有人、经营者的合法预期利益均属之。A属责任保险，C属信用保险，均非财产损失保险。"},{"id":440,"ch":3,"kp":"1.3保险利益原则在实务中的应用","t":"m","q":"在人身保险中，保险利益存在的情况包括（    ）。","o":["祖父母对孙子女","债权人对债务人","叔侄之间","养父母对养子女"],"a":"ABD","e":"选ABD。人身保险中，祖父母对孙子女、债权人对债务人、养父母对养子女均可形成保险利益。C叔侄之间无法定抚养、赡养或扶养关系，一般不认定具有保险利益。"},{"id":441,"ch":3,"kp":"1.3保险利益原则在实务中的应用","t":"m","q":"关于保险利益原则的时间效力下列说法正确的是（    ）。","o":["财产保险要求投保人在保险合同订立时对保险标的具有保险利益","财产保险要求投保人在保险事故发生时对保险标的具有保险利益","人身保险要求投保人在保险合同订立时对被保险人具有保险利益","人身保险要求投保人在保险事故发生时对被保险人具有保险利益"],"a":"BC","e":"选BC。财产保险要求被保险人在保险事故发生时具有保险利益，人身保险要求投保人在合同订立时具有保险利益。A、D把两类保险的时间要求说反。"},{"id":442,"ch":3,"kp":"1.3保险利益原则在实务中的应用","t":"j","q":"责任保险的保险标的是被保险人依法对他人的财产损失或人身伤亡承担的民事损害的经济赔偿责任。","o":[],"a":"T","e":"正确。责任保险的保险标的是被保险人对第三者依法应负的民事损害赔偿责任，包括人身伤亡和财产损失的经济赔偿，而不是有形的财产本身。"},{"id":443,"ch":3,"kp":"1.3保险利益原则在实务中的应用","t":"j","q":"在经济交往中，权利人对义务人的信用有担心时，可以以义务人的信用为标的购买保险，称之为保证保险。","o":[],"a":"F","e":"错误。权利人对义务人的信用有担心时，以义务人信用为标的投保的是信用保险；保证保险是义务人为自己的信用投保，题干把二者混淆了。"},{"id":444,"ch":3,"kp":"1.3保险利益原则在实务中的应用","t":"j","q":"在经济交往中，债务人根据债权人的要求为自己的信用购买的保险称之为保证保险。","o":[],"a":"T","e":"正确。经济交往中，债务人即义务人根据债权人的要求为自己的信用投保，属于保证保险，由义务人作为投保人。"},{"id":445,"ch":3,"kp":"1.3保险利益原则在实务中的应用","t":"j","q":"在财产保险中，被保险人在保险事故发生时对保险标的具有保险利益，但投保时对保险标的不具有保险利益的，不得向保险人请求赔偿保险金。","o":[],"a":"F","e":"错误。财产保险只要求被保险人在保险事故发生时具有保险利益，投保时是否具有不影响索赔，题干把保险利益的时间效力说反了。"},{"id":446,"ch":3,"kp":"1.3保险利益原则在实务中的应用","t":"j","q":"在人身保险中，投保人对被保险人的保险利益分为被保险人的保险利益专属投保人和非专属投保人，两者保险利益在一定条件下均能转移。","o":[],"a":"F","e":"错误。专属投保人的保险利益不能转移，只有非专属投保人的保险利益在一定条件下可以转移，题干称两者均能转移。"},{"id":447,"ch":3,"kp":"2.1 最大诚信原则的含义","t":"s","q":"最大诚信的含义是指当事人自愿地向对方充分而准确地告知有关保险的所有（    ）。","o":["保险条款","风险事故","重要事实","风险因素"],"a":"C","e":"选C。最大诚信是指当事人自愿向对方充分而准确地告知有关保险的所有重要事实。A保险条款只是告知的载体；B风险事故、D风险因素是风险要素，不是告知对象。"},{"id":448,"ch":3,"kp":"2.1 最大诚信原则的含义","t":"s","q":"保险合同当事人订立合同及在合同有效期内，应依法向对方提供影响对方做出订约与履约决定的全部实质性重要事实，同时绝对信守合同订立的约定与承诺，这是（    ）的要求。","o":["保险利益原则","最大诚信原则","近因原则","损失补偿原则"],"a":"B","e":"选B。题干所述是最大诚信原则的要求，即双方提供影响订约与履约的全部实质性重要事实并信守承诺。A、C、D均不涉及如实告知与信守承诺。"},{"id":449,"ch":3,"kp":"2.1 最大诚信原则的含义","t":"s","q":"在保险活动中，规定最大诚信原则的原因不包括（    ）。","o":["保险经营中信息的不对称","保险合同的保障性","保险合同的射幸性","保险合同的附合性"],"a":"B","e":"选B。规定最大诚信原则的原因在于保险经营的信息不对称、保险合同的射幸性和附合性。B保险合同的保障性不是要求最大诚信的原因。"},{"id":450,"ch":3,"kp":"2.1 最大诚信原则的含义","t":"s","q":"保险实务中，保险标的往往广泛而复杂，保险人较投保人处于信息劣势地位，于是要求投保方基于（    ）履行告知与保证义务。","o":["保险利益原则","近因原则","最大诚信原则","损失补偿原则"],"a":"C","e":"选C。保险标的广泛而复杂，保险人处于信息劣势，故要求投保方依最大诚信原则履行告知与保证义务。A、B、D与本情形无关。"},{"id":451,"ch":3,"kp":"2.1 最大诚信原则的含义","t":"s","q":"从规定最大诚信原则的原因而言，保险合同（    ）的特性要求在保险活动中遵守最大诚信原则。","o":["附合性和射幸性","附合性和保障性","有偿性和附合性","有偿性和保障性"],"a":"A","e":"选A。保险合同的附合性使投保人只能接受保险人单方拟定的条款，射幸性使双方对价并不确定，二者共同要求在保险活动中遵守最大诚信原则。B、C、D均含不相关特性。"},{"id":452,"ch":3,"kp":"2.1 最大诚信原则的含义","t":"m","q":"下列关于最大诚信原则说法正确的是（    ）。","o":["最早以法律形式规定最大诚信原则的是英国《1906年海上保险法》","实质性重要事实是指那些影响保险双方当事人是否签约、签约条件、是否继续履约、如何履约的每一项事实","保险经营中信息的不对称要求在保险活动中遵守最大诚信原则","保险合同是典型的双务合同，合同中的内容由保险人单方制定，投保人只能采取同意或不同意，或以附加条款方式接受，因此要求最大诚信原则。"],"a":"ABC","e":"选ABC。最大诚信原则最早由英国《1906年海上保险法》以法律形式规定，其依据是信息不对称及合同的附合性、射幸性。D错，附合性才是理由，双务性不是。"},{"id":453,"ch":3,"kp":"2.1 最大诚信原则的含义","t":"j","q":"最大诚信原则中实质性重要事实是指那些影响双方当事人是否签约、签约条件、是否继续履约、如何履约的每一项事实。","o":[],"a":"T","e":"正确。实质性重要事实即影响双方当事人是否签约、签约条件、是否继续履约及如何履约的每一项事实，是最大诚信原则中告知与说明的核心内容。"},{"id":454,"ch":3,"kp":"2.1 最大诚信原则的含义","t":"j","q":"最大诚信原则要求投保方履行说明和保证的义务。","o":[],"a":"F","e":"错误。最大诚信原则要求保险人履行说明义务，投保方履行告知和保证义务，题干把说明安在投保方身上，颠倒了义务主体。"},{"id":455,"ch":3,"kp":"2.2 最大诚信原则的内容","t":"s","q":"最大诚信原则的内容不包括（    ）。","o":["说明","告知","承诺","弃权与禁止反言"],"a":"C","e":"选C。最大诚信原则的内容包括说明、告知、保证和弃权与禁止反言。承诺不是独立内容，确认保证、承诺保证只是保证或告知的具体形式。"},{"id":456,"ch":3,"kp":"2.2 最大诚信原则的内容","t":"s","q":"最大诚信原则中，（    ）是指合同订立前保险人应将保险合同及保险经营中与投保人或被保险人利害相关的实质性重要事实据实通告投保人或被保险人。","o":["说明","告知","保证","弃权与禁止反言"],"a":"A","e":"选A。说明是指合同订立前保险人应将与投保人或被保险人利害相关的实质性重要事实据实通告对方。B告知是投保方的义务；C保证、D弃权与禁止反言均不符题意。"},{"id":457,"ch":3,"kp":"2.2 最大诚信原则的内容","t":"s","q":"最大诚信原则中说明义务的内容包括（    ）。","o":["保险费","保险期间","免责条款","上述都包括"],"a":"D","e":"选D。保险人的说明义务包括保险费、保险期间、保险责任、免责条款等内容，A、B、C均只是其中一部分，故选上述都包括。"},{"id":458,"ch":3,"kp":"2.2 最大诚信原则的内容","t":"s","q":"根据《中华人民共和国保险法》，保险人在投保单、保险单或者其他保险凭证上必须作出足以引起投保人注意的提示，并对该条款的内容以书面或者口头形式向投保人作出（    ）。","o":["明确列明","明确说明","询问告知","无限告知"],"a":"B","e":"选B。对免除保险人责任的条款，保险人除作出足以引起投保人注意的提示外，还须以书面或口头形式向投保人明确说明。A明确列明、C询问告知、D无限告知均非本条要求。"},{"id":459,"ch":3,"kp":"2.2 最大诚信原则的内容","t":"s","q":"最大诚信原则中，（    ）是指合同订立前、订立时及在合同履行期间，要求当事人按照法律实事求是，尽自己所知、毫无保留地向对方所做的口头或书面陈述。","o":["说明","告知","保证","弃权与禁止反言"],"a":"B","e":"选B。告知是指合同订立前、订立时及履行期间，当事人按法律实事求是、尽自己所知、毫无保留地向对方作口头或书面陈述。A说明是保险人的义务；C、D与题干定义不符。"},{"id":460,"ch":3,"kp":"2.2 最大诚信原则的内容","t":"s","q":"郑某在购买寿险时告知其在过去的3年内从未患过大病，即符合最大诚信原则中的（    ）。","o":["明确说明","明确列明","确认告知","承诺告知"],"a":"C","e":"选C。郑某就过去三年未患大病这一既往事实向保险人如实陈述，属于确认告知。D承诺告知针对将来行为；A、B是保险人的说明方式，主体不符。"},{"id":461,"ch":3,"kp":"2.2 最大诚信原则的内容","t":"s","q":"如实告知义务为（    ）订立合同时必须履行的基本义务。","o":["保险人","投保人","被保险人","受益人"],"a":"B","e":"选B。如实告知义务是投保人订立保险合同时必须履行的基本义务，保险人不承担如实告知义务，C、D亦非该义务的主体。"},{"id":462,"ch":3,"kp":"2.2 最大诚信原则的内容","t":"s","q":"最大诚信原则告知义务的履行方式中，（    ）是指法律或保险人对告知的内容没有明确性的规定，投保方应将与保险标的的危险状况及有关重视事实如实告知保险人。","o":["确认告知","承诺告知","无限告知","主观告知"],"a":"C","e":"选C。法律或保险人对告知内容没有明确限定，投保方须将与危险状况有关的全部重要事实如实告知，属于无限告知。A、B是告知的其他形式；D主观告知不是规范表述。"},{"id":463,"ch":3,"kp":"2.2 最大诚信原则的内容","t":"s","q":"最大诚信原则中，（    ）是保证义务的履行主体。","o":["保险人","保险代理人","投保人","受益人"],"a":"C","e":"选C。保证义务的履行主体是投保人或被保险人，其须承诺为或不为一定行为、保证某种状态存在。A保险人是说明义务主体；B、D不是保证义务主体。"},{"id":464,"ch":3,"kp":"2.2 最大诚信原则的内容","t":"s","q":"（    ）是一项从属于主要合同的承诺，是保险人接受承保或承担保险责任所需投保人或被保险人履行某种义务的基本条件。","o":["说明","告知","保证","弃权与禁止反言"],"a":"C","e":"选C。保证是从属于保险合同的承诺，是保险人接受承保或承担保险责任所需投保人或被保险人履行某种义务的基本条件。A、B、D均不符合这一界定。"},{"id":465,"ch":3,"kp":"2.2 最大诚信原则的内容","t":"s","q":"在保险合同中，王某承诺今后不再吸烟，属于最大诚信原则中的（    ）。","o":["确认告知","承诺告知","确认保证","承诺保证"],"a":"D","e":"选D。王某承诺今后不再吸烟，是对将来行为的保证，属于承诺保证。C确认保证是对现在或过去事实的保证；A、B是告知的形式，与保证不同。"},{"id":466,"ch":3,"kp":"2.2 最大诚信原则的内容","t":"s","q":"海上保险合同中的默示保证不包括（    ）。","o":["船舶的适航、适货保证","不转移标的的保证","不改变航道的保证","航行合法的保证"],"a":"B","e":"选B。海上保险合同的默示保证包括船舶适航适货、不改变航道和航行合法三项。B不转移标的的保证不属于默示保证。"},{"id":467,"ch":3,"kp":"2.2 最大诚信原则的内容","t":"s","q":"《保险法》规定的合同解除权中，根据最大诚信原则，自保险人知道有解除事由之日起，超过30日不行使而消灭。自合同成立之日起超过（    ）的，保险人不得解除保险合同；发生保险事故的，保险人的应当承担赔偿或给付保险金的责任。","o":["1年","2年","3年","5年"],"a":"B","e":"选B。保险人自知道解除事由之日起超过30日不行使即消灭，自合同成立之日起超过2年的，保险人不得解除合同，发生保险事故的仍应承担赔偿或给付责任。"},{"id":468,"ch":3,"kp":"2.2 最大诚信原则的内容","t":"s","q":"下列关于弃权与禁止反言说法错误的是（    ）。","o":["在保险事故发生后，保险人明知有拒绝赔付的抗辩权，但仍要求投保人和被保险人提供损失证明，因而增加了投保人在时间及金钱上的负担。该行为视为保险人放弃抗辩权","保险人明知投保人的损失证明有纰漏和不实之处，但仍无条件予以接受，则可视为对纰漏和不实之处抗辩权的放弃","保险事故发生后，保单持有人应于约定或法定时间内通知保险人，但逾期通知，保险人仍表示接受的，则认为是对逾期通知抗辩权的放弃","保险代理人的弃权行为不等同于保险人的弃权行为，保险人有权拒绝承担赔偿责任"],"a":"D","e":"选D。保险代理人在授权范围内的弃权行为视为保险人的弃权，保险人不得再拒绝承担赔偿责任，D的说法错误。A、B、C均属弃权的典型情形。"},{"id":469,"ch":3,"kp":"2.2 最大诚信原则的内容","t":"s","q":"《保险法》规定的合同解除权中，根据最大诚信原则，自保险人知道有解除事由之日起，超过（    ）不行使而消灭。","o":["30日","45日","60日","90日"],"a":"A","e":"选A。根据最大诚信原则和《保险法》规定，保险人自知道有解除事由之日起超过30日不行使，合同解除权即消灭。B、C、D均不是法定期限。"},{"id":470,"ch":3,"kp":"2.2 最大诚信原则的内容","t":"s","q":"当法律或保险人对告知的内容没有明确的规定时，投保人应将有关保险标的的风险情况及有关重要事实如实告知保险人的情况称为（  ）。","o":["有限告知","无限告知","询问告知","主观告知"],"a":"B","e":"选B。法律或保险人对告知内容没有明确规定时，投保人须将有关风险情况及重要事实如实告知，称为无限告知。A有限告知、C询问告知均以保险人询问为限。"},{"id":471,"ch":3,"kp":"2.2 最大诚信原则的内容","t":"s","q":"保险合同一方既然已放弃他在合同中的某种权利，将来不得再向他方主张这种权利（   ）","o":["明示弃权","告知","禁止反言","默示弃权"],"a":"C","e":"选C。一方已放弃合同中的某种权利，将来不得再向他方主张，称为禁止反言。A明示弃权与D默示弃权是弃权的形式，B告知与题干含义无关。"},{"id":472,"ch":3,"kp":"2.2 最大诚信原则的内容","t":"m","q":"最大诚信原则的内容包括（    ）。","o":["说明","告知","承诺","弃权与禁止反言"],"a":"ABD","e":"选ABD。最大诚信原则包括说明、告知、保证以及弃权与禁止反言。C承诺不是独立内容，承诺告知与承诺保证只是告知、保证的具体形式。"},{"id":473,"ch":3,"kp":"2.2 最大诚信原则的内容","t":"m","q":"最大诚信原则中，说明义务的内容应包括（    ）。","o":["保险费率","保险期限","保险责任","免责条款"],"a":"ABCD","e":"选ABCD。保险人的说明义务应包括保险费率、保险期限、保险责任、免责条款等内容，凡与投保人利害相关的实质性重要事实均应说明。"},{"id":474,"ch":3,"kp":"2.2 最大诚信原则的内容","t":"m","q":"下列关于最大诚信原则中说明义务正确的是（    ）。","o":["明确说明是保险人应当主动履行的一项法定义务，履行的时间为保险合同订立时","保险代理人也是说明义务的主体之一","对于保险费率的明确说明，是保险人履行说明义务的重心","说明义务的履行方式包括
