/* ---------- 交互 ---------- */
function chooseOption(key) {
  const s = state.session;
  if (!s || s.submitted) return;
  const q = currentQuestion();
  if (!q || s.revealed[q.id]) return;
  const cur = answerSet(s.answers[q.id] || '');
  if (q.t === 'm') {
    if (cur.has(key)) cur.delete(key); else cur.add(key);
    s.answers[q.id] = Array.from(cur).sort().join('');
  } else {
    s.answers[q.id] = key;
  }
  persistSession();
  updateOptionsUI();
  updateSubmitButton();
}

function updateOptionsUI() {
  const s = state.session;
  const q = currentQuestion();
  if (!s || !q) return;
  const sel = answerSet(s.answers[q.id] || '');
  $$('.opt, .judge-opt').forEach(btn => {
    if (btn.disabled) return;
    btn.classList.toggle('selected', sel.has(btn.dataset.key));
  });
}

function updateSubmitButton() {
  const s = state.session;
  const q = currentQuestion();
  if (!s || !q) return;
  const btn = $('[data-act="submit-answer"]');
  if (btn) btn.disabled = !s.answers[q.id];
}

function submitCurrent() {
  const s = state.session;
  if (!s) return;
  if (s.kind === 'exam') { toast('考试中不显示答案，交卷后统一批改', 'warn'); return; }
  const q = currentQuestion();
  const ans = s.answers[q.id];
  if (!ans) { toast('请先选择答案', 'warn'); return; }
  if (s.revealed[q.id]) return;
  const ok = isCorrect(q, ans);
  s.revealed[q.id] = true;
  s.results[q.id] = ok;
  recordAnswer(q.id, ans, ok);
  persistSession();
  render();
  if (ok && store.settings.autoNext && s.i < s.ids.length - 1) {
    const idx = s.i;
    setTimeout(() => {
      if (state.session === s && !s.submitted && s.i === idx) nextQuestion();
    }, 900);
  }
}

function nextQuestion() {
  const s = state.session;
  if (!s) return;
  if (s.i < s.ids.length - 1) {
    s.i += 1;
    persistSession();
    render();
  } else if (s.kind === 'exam') {
    openAnswerSheet();
    toast('已经是最后一题，可检查答题卡后交卷');
  } else {
    const unanswered = s.ids.filter(id => !s.answers[id]).length;
    if (unanswered > 0) {
      confirmDialog('还有题目未作答', `本组还有 ${unanswered} 题未作答，现在结束将计为错误。`, { okText: '生成报告' }).then(ok => { if (ok) finishSession(); });
    } else {
      finishSession();
    }
  }
}

function prevQuestion() {
  const s = state.session;
  if (!s || s.i === 0) return;
  s.i -= 1;
  persistSession();
  render();
}

function gotoQuestion(idx) {
  const s = state.session;
  if (!s || idx < 0 || idx >= s.ids.length) return;
  s.i = idx;
  persistSession();
  closeModal();
  render();
}

function toggleFav(id) {
  id = Number(id);
  const idx = store.fav.indexOf(id);
  if (idx >= 0) { store.fav.splice(idx, 1); toast('已取消收藏'); }
  else { store.fav.push(id); toast('已加入收藏', 'ok'); }
  save();
  $$(`[data-fav-id="${id}"]`).forEach(btn => {
    btn.classList.toggle('fav-on', isFav(id));
    if (btn.classList.contains('icon-btn')) btn.title = isFav(id) ? '取消收藏（B）' : '收藏（B）';
  });
  renderSidebar();
  renderMobileNav();
  if (state.view === 'fav') render();
}

function toggleFlag() {
  const s = state.session;
  const q = currentQuestion();
  if (!s || !q) return;
  if (s.flags[q.id]) delete s.flags[q.id]; else s.flags[q.id] = true;
  persistSession();
  render();
}

function openAnswerSheet() {
  const s = state.session;
  if (!s) return;
  const exam = s.kind === 'exam';
  const answered = Object.keys(s.answers).length;
  const flagged = Object.keys(s.flags).length;
  openModal({
    title: '答题卡',
    desc: `${exam ? '考试' : '练习'} · 已答 ${answered} / ${s.ids.length} 题${flagged ? ` · 标记 ${flagged} 题` : ''}`,
    wide: s.ids.length > 24,
    body: `<div class="palette" style="grid-template-columns:repeat(10,1fr);gap:6px">${paletteButtons(s, exam)}</div>
      <div class="palette-legend">
        ${exam ? `<span><i style="background:var(--primary-soft);border:1px solid color-mix(in srgb,var(--primary) 25%,transparent)"></i>已答</span><span><i style="background:var(--surface-3)"></i>未答</span><span><i style="background:var(--amber)"></i>标记</span>` : `<span><i style="background:var(--green-soft);border:1px solid var(--green-line)"></i>正确</span><span><i style="background:var(--red-soft);border:1px solid var(--red-line)"></i>错误</span><span><i style="background:var(--surface-3)"></i>未答</span>`}
      </div>
      <div class="row mt16" style="gap:8px;flex-wrap:wrap">
        ${flagged ? `<span class="pill" style="color:var(--amber)">${icon('flag')} 已标记 ${flagged} 题</span>` : ''}
        ${exam ? `<button class="btn btn-ghost btn-sm" data-act="goto-first-flagged">${icon('flag')} 跳到标记题</button>` : ''}
      </div>`,
    actions: exam
      ? [{ label: '继续答题', value: false, cls: 'btn-ghost' }, { label: '交卷', value: true, cls: 'btn-primary' }]
      : [{ label: '关闭', value: false, cls: 'btn-primary' }]
  }).then(v => {
    if (exam && v === true) submitExam(false);
  });
  const jump = $('#modalRoot').querySelector('[data-act="goto-first-flagged"]');
  if (jump) jump.addEventListener('click', () => {
    const idx = s.ids.findIndex(id => s.flags[id]);
    if (idx >= 0) gotoQuestion(idx);
  });
}

/* ---------- 结束与报告 ---------- */
function finishSession(auto = false) {
  const s = state.session;
  if (!s || s.submitted) return;
  if (AI.open) closeAI();
  s.submitted = true;
  const ids = s.ids;
  let correct = 0;
  ids.forEach(id => {
    const q = QBYID.get(id);
    const ans = s.answers[id] || '';
    const ok = isCorrect(q, ans);
    s.results[id] = ok;
    if (ok) correct += 1;
    if (!s.revealed[id]) {
      recordAnswer(id, ans, ok);
      s.revealed[id] = true;
    }
  });
  const total = ids.length;
  const time = Math.round((Date.now() - s.start) / 1000);
  const score = total ? Math.round((correct / total) * 100) : 0;
  const wrongList = ids.filter(id => !s.results[id]);
  const unanswered = ids.filter(id => !s.answers[id]).length;
  const byChapter = CHAPTERS.map(c => {
    const cids = ids.filter(id => QBYID.get(id).ch === c.id);
    const cok = cids.filter(id => s.results[id]).length;
    return { id: c.id, name: c.name, total: cids.length, correct: cok };
  }).filter(x => x.total > 0);
  const byType = TYPE_ORDER.map(t => {
    const tids = ids.filter(id => QBYID.get(id).t === t);
    const tok = tids.filter(id => s.results[id]).length;
    return { t, name: TYPE_NAME[t], total: tids.length, correct: tok };
  }).filter(x => x.total > 0);
  const pass = score >= store.settings.passScore;
  state.result = {
    kind: s.kind, title: s.title, total, correct, score, time, wrongList, unanswered,
    pass, byChapter, byType, ts: Date.now(), auto: !!auto,
    passScore: store.settings.passScore
  };
  state.review = {
    ...s,
    submitted: true
  };
  state.session = null;
  store.live = null;
  store.hist.unshift({
    kind: s.kind, ts: Date.now(), total, correct, score,
    dur: time, title: s.title
  });
  store.hist = store.hist.slice(0, 120);
  saveNow();
  state.resultShowAll = false;
  navigate('result');
  setTimeout(() => {
    if (auto) toast('考试时间已到，已自动交卷', 'warn', 3600);
  }, 100);
}

function submitExam(skipConfirm) {
  const s = state.session;
  if (!s || s.kind !== 'exam') return;
  const unanswered = s.ids.filter(id => !s.answers[id]).length;
  if (!skipConfirm && unanswered > 0) {
    confirmDialog('确认交卷？', `还有 ${unanswered} 题未作答，未作答题目将计为错误。`, { okText: '确认交卷' }).then(ok => {
      if (ok) finishSession();
    });
    return;
  }
  if (!skipConfirm && unanswered === 0) {
    confirmDialog('确认交卷？', `已完成全部 ${s.ids.length} 题，交卷后立即批改并生成报告。`, { okText: '确认交卷' }).then(ok => {
      if (ok) finishSession();
    });
    return;
  }
  finishSession(!!skipConfirm);
}

function exitPractice() {
  const s = state.session;
  if (!s) { navigate('home'); return; }
  const isExam = s.kind === 'exam';
  confirmDialog(
    isExam ? '放弃本次考试？' : '结束本组练习？',
    isExam ? '本次考试将不计分，已作答内容不会写入成绩与统计。' : '已提交的题目会保留在统计与错题本中，未提交的作答不会记录。',
    { okText: isExam ? '放弃考试' : '结束练习', danger: true }
  ).then(ok => {
    if (!ok) return;
    state.session = null;
    store.live = null;
    save();
    navigate('home');
    toast(isExam ? '已放弃本次考试' : '已结束本组练习');
  });
}

    <div class="result-copy">

      <div class="result-badges">
        <span class="badge ${r.pass ? 'badge-green' : 'badge-amber'}">${icon(r.pass ? 'checkcircle' : 'info')} ${r.pass ? '达到及格线' : '未达及格线'}（${r.passScore} 分）</span>
        <span class="badge badge-muted">${icon('clock')} 用时 ${fmtDuration(r.time)}</span>

    </div>
    <div class="result-actions">
      ${r.wrongList.length ? `<button class="btn btn-primary" data-act="redo-wrong">${icon('refresh')} 重练 ${r.wrongList.length} 道错题</button>` : `<button class="btn btn-primary" data-act="start-smart-20">${icon('zap')} 再来一组</button>`}
      ${r.wrongList.length ? `<button class="btn btn-ghost" data-act="start-smart-20">${icon('zap')} 再来一组</button>` : ''}
      <button class="btn btn-ai" data-act="ai-review">${icon('sparkles')} AI 复盘</button>
      <button class="btn btn-ghost" data-act="go-home">${icon('home')} 返回首页</button>
    </div>
  </div>
  <div class="result-stats">
    <div class="result-stat"><b>${r.correct}</b><span>答对</span></div>
    <div class="result-stat"><b style="color:var(--red)">${r.total - r.correct}</b><span>答错</span></div>
    <div class="result-stat"><b>${r.unanswered}</b><span>未作答</span></div>

  <div class="grid-2">
    <div class="card chart-card">
      <h3>章节表现</h3><div class="cc-sub">找到需要补强的章节</div>
      ${r.byChapter.map(c => {
        const p = c.total ? c.correct / c.total : 0;
        return `<div class="type-bar">
          <div class="tb-head"><span>${esc(c.name)}</span><b>${c.correct}/${c.total} · ${pct(c.correct, c.total)}%</b></div>
          <div class="progress ${p >= 0.8 ? 'green' : p >= 0.6 ? '' : 'amber'}"><i style="width:${p * 100}%"></i></div>
        </div>`;
      }).join('')}
    </div>
    <div class="card chart-card">
      <h3>题型表现</h3><div class="cc-sub">不同题型的掌握程度</div>

        return `<div class="type-bar">

function renderReviewItem(id, review) {
  const q = QBYID.get(id);
  if (!q) return '';
  const ok = review.results[id];
  const mine = review.answers[id] || '';
  const perm = review.perm ? review.perm[id] : null;
  const list = optionList(q, perm);
  return `<details class="review-item">
    <summary>
      <span class="ri-mark ${ok ? 'ok' : 'bad'}">${ok ? '✓' : '✕'}</span>
      <span class="ri-stem"><b>${esc(q.q)}</b><span class="ri-ans">${ok ? '回答正确' : `你的答案：${esc(mine ? displayAnswer(q, mine, perm) : '未作答')}`} · 正确答案：${esc(displayAnswer(q, q.a, perm))}</span></span>
      <span class="q-row-toggle">${icon('down')}</span>
    </summary>
    <div class="review-body">
      ${q.t === 'j' ? `<div class="ropt ${ok ? 'ok' : ''}">判断题：${q.a === 'T' ? '正确' : '错误'}</div>` : list.map(o => {
        const isAns = answerSet(q.a).has(o.key);
        const isMine = answerSet(mine).has(o.key);
        return `<div class="ropt ${isAns ? 'ok' : isMine && !ok ? 'bad' : ''}">${o.letter}．${esc(o.text)}${isAns ? '　✓ 正确答案' : isMine ? '　✕ 你的选择' : ''}</div>`;
      }).join('')}
      <div class="rline"><span>知识点：${esc(kpLabel(q))}</span><span>章节：${esc(chapterOf(q).name)}</span></div>
      ${q.e ? `<div class="q-row-explain">${icon('bulb')}<div><b>离线解析</b>${esc(mapOptionLetters(q.e, q, perm))}</div></div>` : ''}
      ${store.notes[q.id] ? `<div class="q-row-note" style="margin-top:8px">${icon('note')} ${esc(store.notes[q.id])}</div>` : ''}
      <div class="row" style="gap:6px;flex-wrap:wrap">
        <button class="btn btn-ai btn-sm" data-act="open-ai-q" data-id="${q.id}" data-mode="explain">${icon('sparkles')} AI 解析</button>
        <button class="btn btn-ghost btn-sm" data-act="practice-one" data-id="${q.id}">${icon('play')} 重做本题</button>
        <button class="btn btn-ghost btn-sm" data-act="peek-q" data-id="${q.id}">${icon('eye')} 完整题目</button>
      </div>
    </div>
  </details>`;
}

function exportResult() {
  const r = state.result;
  const review = state.review;
  if (!r || !review) return;
  const lines = [];
  lines.push(`# ${r.title} · 练习报告`, '');
  lines.push(`- 得分：${r.score} 分（${r.pass ? '达标' : '未达标'}，及格线 ${r.passScore}）`);
  lines.push(`- 正确：${r.correct} / ${r.total}，未作答：${r.unanswered}`);
  lines.push(`- 用时：${fmtDuration(r.time)}`);
  lines.push(`- 时间：${new Date(r.ts).toLocaleString('zh-CN')}`, '');
  lines.push('## 错题清单', '');
  r.wrongList.forEach((id, i) => {
    const q = QBYID.get(id);
    if (!q) return;
    const mine = review.answers[id] || '';
    lines.push(`### ${i + 1}. ${q.q}`);
    if (q.o.length) q.o.forEach((o, oi) => lines.push(`${String.fromCharCode(65 + oi)}．${o}`));
    lines.push(`- 你的答案：${mine ? displayAnswer(q, mine, review.perm ? review.perm[id] : null) : '未作答'}`);
    lines.push(`- 正确答案：${displayAnswer(q, q.a, review.perm ? review.perm[id] : null)}`);
    lines.push(`- 解析：${mapOptionLetters(q.e || '—', q, review.perm ? review.perm[id] : null)}`);
    lines.push(`- 知识点：${kpLabel(q)}（${chapterOf(q).name}）`, '');
  });
  downloadFile(`练习报告-${todayKey()}.md`, lines.join('\n'), 'text/markdown;charset=utf-8');
  toast('报告已导出', 'ok');
}

function examPool(scope) {
  if (scope === 'unseen') return QS.filter(q => !store.prog[q.id]);
  if (scope === 'wrong') return QS.filter(q => store.wrong[q.id]);
  if (scope === 'weak') {
    const weak = weakKps(8, 2);
    if (!weak.length) return QS.slice();
    const keys = new Set(weak.map(w => w.ch + '|' + w.kp));
    return QS.filter(q => q.kp && keys.has(q.ch + '|' + q.kp));
  }
  return QS.slice();
}

function bestExamScore() {
  const exams = store.hist.filter(h => h.kind === 'exam');
  if (!exams.length) return '暂无';
  return Math.max(...exams.map(h => h.score));
}

function startExam() {
  const cfg = state.examSetup;
  let pool = examPool(cfg.scope);
  if (!pool.length) { toast('该范围内暂无题目', 'warn'); return; }
  const count = Math.min(cfg.count, pool.length);
  const ids = sample(pool.map(q => q.id), count);
  startExamSession({
    ids,
    title: `${count} 题 · ${cfg.duration} 分钟`,
    duration: cfg.duration
  });
}

/* ---------- 计时 ---------- */
function updateTimerDisplays() {
  const s = state.session;
  if (!s) return;
  $$('[data-timer]').forEach(el => {
    if (el.dataset.timer === 'up') {
      el.textContent = fmtDuration((Date.now() - s.start) / 1000);
    } else {
      const left = s.duration ? Math.max(0, (s.start + s.duration * 60000 - Date.now()) / 1000) : 0;
      el.textContent = fmtDuration(left);
      if (left <= 300) {
        const timer = $('#examTimer');
        if (timer) timer.classList.add('warn');
        el.classList.add('warn');
      }
    }
  });
}

function tick() {
  updateTimerDisplays();
  const s = state.session;
  if (s && s.kind === 'exam' && s.duration && !s.submitted) {
    const left = s.start + s.duration * 60000 - Date.now();
    if (left <= 0) {
      if (!state._autoSubmitting) {
        state._autoSubmitting = true;
        finishSession(true);
        setTimeout(() => { state._autoSubmitting = false; }, 3000);
      }
    }
  }
}

/* ---------- 键盘答题 ---------- */
function handleAnswerKey(e) {
  const s = state.session;
  const q = currentQuestion();
  if (!s || !q || s.submitted) return false;
  const key = e.key;
  const lower = key.toLowerCase();
  if (['arrowleft', 'arrowright', 'enter'].includes(lower) || ['1', '2', '3', '4'].includes(key)) e.preventDefault();
  if (lower === 'arrowright') { nextQuestion(); return true; }
  if (lower === 'arrowleft') { prevQuestion(); return true; }
  if (lower === 'enter') {
    if (s.kind === 'practice' && !s.revealed[q.id]) {
      if (s.answers[q.id]) submitCurrent();
      else toast('请先选择答案', 'warn');
    } else {
      nextQuestion();
    }
    return true;
  }
  if (lower === 'b') { toggleFav(q.id); return true; }
  if (lower === 'f' && s.kind === 'exam') { toggleFlag(); return true; }
  if (lower === 'e') { openAI({ tab: 'explain', qid: q.id }); return true; }
  if (!s.revealed[q.id]) {
    const list = optionList(q, s.perm[q.id]);
    let opt = null;
    if (q.t === 'j' && lower === 'a') opt = list[0];
    else if (q.t === 'j' && lower === 'b') opt = list[1];
    else if (['a', 'b', 'c', 'd'].includes(lower)) opt = list.find(o => o.letter.toLowerCase() === lower || o.key.toLowerCase() === lower);
    if (['1', '2', '3', '4'].includes(key)) opt = list[Number(key) - 1];
    if (opt) { chooseOption(opt.key); return true; }
  }
  return false;
}

  const totalDays = 91;

  for (let i = 0; i < totalDays; i++) {
    const d = shiftDay(start, i);
    const k = todayKey(d);
    const n = (store.days[k] && store.days[k].n) || 0;
    const level = n === 0 ? 0 : n < 5 ? 1 : n < 12 ? 2 : n < 25 ? 3 : 4;
    cells.push(`<i data-l="${level}" title="${d.getMonth() + 1}月${d.getDate()}日 · ${n} 题"></i>`);

  return `<div class="heat-wrap"><div class="heat">${cells.join('')}</div></div>

/* ---------------- 题库浏览 ---------------- */
const BROWSE_PAGE_SIZE = 20;

function filteredBrowse() {
  const b = state.browse;
  let list = QS.slice();
  if (b.ch !== 'all') list = list.filter(q => q.ch === b.ch);
  if (b.type !== 'all') list = list.filter(q => q.t === b.type);
  if (b.status === 'unseen') list = list.filter(q => !store.prog[q.id]);
  else if (b.status === 'wrong') list = list.filter(q => store.wrong[q.id]);
  else if (b.status === 'mastered') list = list.filter(q => store.prog[q.id] && (store.prog[q.id].c || 0) >= 2);
  else if (b.status === 'answered') list = list.filter(q => store.prog[q.id]);
  else if (b.status === 'fav') list = list.filter(q => isFav(q.id));
  else if (b.status === 'note') list = list.filter(q => store.notes[q.id]);
  if (b.q.trim()) {
    const terms = b.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
    list = list.filter(q => {
      const blob = qSearchBlob(q);
      return terms.every(t => blob.includes(t));
    });
  }
  return list;
}

function renderBrowse() {
  const b = state.browse;
  return `
  <div class="page-head">
    <div><h2>题库浏览</h2><p>${TOTAL} 道题全部收录，答案、知识点与离线解析随题展示。</p></div>
    <div class="head-actions">
      <button class="btn btn-ghost" data-act="export-browse">${icon('download')} 导出当前筛选</button>
    </div>
  </div>
  <div class="card filterbar">
    <div class="search-field">${icon('search')}<input id="browseSearch" type="search" placeholder="搜索题干、选项、知识点…" value="${esc(b.q)}" data-input="browse-search" autocomplete="off"></div>
    <select class="select" data-change="browse-ch" aria-label="章节">
      <option value="all" ${b.ch === 'all' ? 'selected' : ''}>全部章节</option>
      ${CHAPTERS.map(c => `<option value="${c.id}" ${b.ch === c.id ? 'selected' : ''}>${c.name}</option>`).join('')}
    </select>
    <select class="select" data-change="browse-type" aria-label="题型">
      <option value="all" ${b.type === 'all' ? 'selected' : ''}>全部题型</option>
      ${TYPE_ORDER.map(t => `<option value="${t}" ${b.type === t ? 'selected' : ''}>${TYPE_NAME[t]}</option>`).join('')}
    </select>
    <select class="select" data-change="browse-status" aria-label="状态">
      <option value="all" ${b.status === 'all' ? 'selected' : ''}>全部状态</option>
      <option value="unseen" ${b.status === 'unseen' ? 'selected' : ''}>未练习</option>
      <option value="wrong" ${b.status === 'wrong' ? 'selected' : ''}>答错过</option>
      <option value="mastered" ${b.status === 'mastered' ? 'selected' : ''}>已掌握</option>
      <option value="fav" ${b.status === 'fav' ? 'selected' : ''}>已收藏</option>
      <option value="note" ${b.status === 'note' ? 'selected' : ''}>有笔记</option>
    </select>
    <button class="icon-btn" data-act="reset-browse" title="重置筛选">${icon('refresh')}</button>
  </div>
  <div id="browseResults">${browseResultsHTML()}</div>`;
}

function browseResultsHTML() {
  const list = filteredBrowse();
  const b = state.browse;
  const pages = Math.max(1, Math.ceil(list.length / BROWSE_PAGE_SIZE));
  if (b.page > pages) b.page = pages;
  const start = (b.page - 1) * BROWSE_PAGE_SIZE;
  const pageList = list.slice(start, start + BROWSE_PAGE_SIZE);
  const pageBtns = [];
  const addPage = (p, label = p, active = false, disabled = false) => pageBtns.push(`<button class="${active ? 'active' : ''}" data-act="browse-page" data-page="${p}" ${disabled ? 'disabled' : ''}>${label}</button>`);
  if (pages > 1) {
    addPage(b.page - 1, icon('left'), false, b.page === 1);
    const nums = new Set([1, pages, b.page - 1, b.page, b.page + 1]);
    Array.from(nums).filter(p => p >= 1 && p <= pages).sort((a, c) => a - c).forEach((p, i, arr) => {
      if (i > 0 && p - arr[i - 1] > 1) pageBtns.push(`<span class="pager-info">…</span>`);
      addPage(p, p, p === b.page);
    });
    addPage(b.page + 1, icon('right'), false, b.page === pages);
  }
  const rows = pageList.map(q => {
    const p = store.prog[q.id];
    const isOpen = b.open.has(q.id);
    const note = store.notes[q.id];
    const statusCls = store.wrong[q.id] ? 'bad' : p && p.ok ? 'ok' : isFav(q.id) ? 'fav' : '';
    return `<article class="q-row ${isOpen ? 'open' : ''}" data-row="${q.id}">
      <button class="q-row-head" data-act="toggle-row" data-id="${q.id}">
        <span class="q-row-status ${statusCls}"></span>
        <span class="q-row-content">
          <span class="q-row-meta">
            <span class="badge ${TYPE_BADGE[q.t]}">${TYPE_SHORT[q.t]}</span>
            <span class="qch">${esc(chapterOf(q).name)}</span>
            <span class="qch">· ${esc(kpLabel(q))}</span>
            ${p ? `<span class="qch">· 正确率 ${pct(p.r, p.s)}%</span>` : ''}
            ${isFav(q.id) ? `<span class="badge badge-star">${icon('star')} 收藏</span>` : ''}
          </span>
          <h4>${highlight(q.q, b.q.trim())}</h4>
        </span>
        <span class="q-row-toggle">${icon('down')}</span>
      </button>
      <div class="q-row-body">
        ${q.t === 'j' ? `<div class="q-row-opts"><div class="q-row-opt ${q.a === 'T' ? 'correct' : ''}"><b>正确</b>该说法成立</div><div class="q-row-opt ${q.a === 'F' ? 'correct' : ''}"><b>错误</b>该说法不成立</div></div>` : `<div class="q-row-opts">${q.o.map((o, i) => {
          const l = String.fromCharCode(65 + i);
          return `<div class="q-row-opt ${answerSet(q.a).has(l) ? 'correct' : ''}"><b>${l}．</b>${highlight(o, b.q.trim())}</div>`;
        }).join('')}</div>`}
        <div class="q-row-answer">
          <span>正确答案</span><b>${answerLetters(q)}</b>
          <span style="color:var(--faint)">${esc(truncate(correctOptionSummary(q), 42))}</span>
          <span class="qra-actions">
            <button class="btn btn-primary btn-sm" data-act="practice-one" data-id="${q.id}">${icon('play')} 练这题</button>
            <button class="btn btn-ghost btn-sm" data-act="toggle-fav" data-id="${q.id}" data-fav-id="${q.id}">${icon('star')} ${isFav(q.id) ? '已收藏' : '收藏'}</button>
            <button class="btn btn-ai btn-sm" data-act="open-ai-q" data-id="${q.id}" data-mode="explain">${icon('sparkles')} AI</button>
          </span>
        </div>
        ${q.e ? `<div class="q-row-explain">${icon('bulb')}<div><b>离线解析</b>${esc(q.e)}</div></div>` : ''}
        ${note ? `<div class="q-row-note">${icon('note')} ${esc(note)}</div>` : ''}
      </div>
    </article>`;
  }).join('');
  return `<div class="list-meta">
      <span>共 <b style="color:var(--ink-2)">${list.length}</b> 题</span>
      <span class="faint">·</span>
      <span>已练 ${list.filter(q => store.prog[q.id]).length} · 错题 ${list.filter(q => store.wrong[q.id]).length}</span>
      ${b.q.trim() ? `<span class="pill">关键词：${esc(b.q.trim())}</span>` : ''}
      <span class="lm-right"><button class="btn btn-ghost btn-sm" data-act="start-filtered">${icon('play')} 练筛选结果</button></span>
    </div>
    <div class="browse-list">${rows || `<div class="card empty-state"><div class="empty-icon">${icon('search')}</div><h3>没有匹配的题目</h3><p>换个关键词，或重置筛选条件试试。</p><button class="btn btn-primary" data-act="reset-browse">重置筛选</button></div>`}</div>
    ${pages > 1 ? `<div class="pager">${pageBtns.join('')}</div>` : ''}`;
}

function refreshBrowse() {
  const el = $('#browseResults');
  if (el) el.innerHTML = browseResultsHTML();
  const input = $('#browseSearch');
  if (input && document.activeElement !== input && state.browse.q !== input.value) input.value = state.browse.q;
}

function resetBrowse() {
  state.browse = { ch: 'all', type: 'all', status: 'all', q: '', page: 1, open: new Set() };
  render();
}

registerChanges({
  'browse-ch': (el) => { state.browse.ch = el.value === 'all' ? 'all' : Number(el.value); state.browse.page = 1; render(); },
  'browse-type': (el) => { state.browse.type = el.value; state.browse.page = 1; render(); },
  'browse-status': (el) => { state.browse.status = el.value; state.browse.page = 1; render(); }

registerInputs({

function renderWrong() {
  const ids = Object.keys(store.wrong).map(Number).filter(id => QBYID.has(id));
  if (!ids.length) {
    return `<div class="page-head"><div><h2>错题本</h2><p>答错自动收录，连续答对两次自动移出。</p></div></div>
      <div class="card empty-state"><div class="empty-icon" style="background:var(--green-soft);color:var(--green)">${icon('checkcircle')}</div><h3>错题本是空的</h3><p>这通常是个好兆头。去练习或考试中检验一下自己吧，答错的题会自动出现在这里。</p><div class="row" style="justify-content:center;gap:8px"><button class="btn btn-primary" data-act="go-practice">开始练习</button><button class="btn btn-ghost" data-act="go-exam">模拟考试</button></div></div>`;
  }
  const byCh = CHAPTERS.map(c => ({ c, ids: ids.filter(id => QBYID.get(id).ch === c.id) })).filter(x => x.ids.length);

    return s ? pct(r, s) : 0;
  })();
  return `
  <div class="page-head">
    <div><h2>错题本 <span class="badge badge-red" style="vertical-align:middle">${ids.length}</span></h2><p>共 ${ids.length} 道待攻克 · 这些题的历史正确率 ${avgAcc}%。</p></div>
    <div class="head-actions">
      <button class="btn btn-primary" data-act="start-wrong">${icon('play')} 全部重练</button>
      <button class="btn btn-ghost" data-act="export-wrong">${icon('download')} 导出错题</button>
      <button class="btn btn-ghost" data-act="clear-wrong">${icon('trash')} 清空</button>

  </div>
  <div class="suggest-card card mb16" style="display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap">

    <button class="btn btn-ai btn-sm" data-act="ai-wrong">${icon('sparkles')} 让 AI 分析错题</button>

    <div class="group-bar"><h3>${esc(c.name)}</h3><span class="gb-count">${cids.length} 题</span><div class="progress"><i style="width:${pct(cids.length, ids.length)}%"></i></div></div>
    <div class="wrong-grid">${cids.map(id => wrongCardHTML(id, 'wrong')).join('')}</div>`).join('')}`;
}

/* ---------------- 导出 ---------------- */
function downloadMarkdown(filename, lines) {
  downloadFile(filename, lines.join('\n'), 'text/markdown;charset=utf-8');
  toast('已导出 ' + filename, 'ok');
}

function questionsToMarkdown(list, title) {
  const lines = [`# ${title}`, '', `> 共 ${list.length} 题 · 导出于 ${new Date().toLocaleString('zh-CN')}`, ''];
  CHAPTERS.forEach(c => {
    const qs = list.filter(q => q.ch === c.id);
    if (!qs.length) return;
    lines.push(`## ${c.name}`, '');
    qs.forEach((q, i) => {
      lines.push(`### ${i + 1}. ${q.q}`);
      if (q.t !== 'j') q.o.forEach((o, oi) => lines.push(`${String.fromCharCode(65 + oi)}．${o}`));
      lines.push('', `**答案：** ${answerLetters(q)}`, `**解析：** ${q.e || '—'}`, `**知识点：** ${kpLabel(q)}`, `**题型：** ${TYPE_NAME[q.t]}`, '');
    });
  });
  return lines;
}

function exportBrowse() {
  const list = filteredBrowse();
  if (!list.length) { toast('当前筛选没有题目', 'warn'); return; }
  downloadMarkdown(`题库导出-${list.length}题-${todayKey()}.md`, questionsToMarkdown(list, '题库导出'));
}

function exportWrong() {
  const list = Object.keys(store.wrong).map(Number).filter(id => QBYID.has(id));
  if (!list.length) { toast('错题本是空的', 'warn'); return; }
  const lines = [`# 错题本`, '', `> 共 ${list.length} 题 · 导出于 ${new Date().toLocaleString('zh-CN')}`, ''];
  const ordered = QS.filter(q => list.includes(q.id));
  CHAPTERS.forEach(c => {
    const qs = ordered.filter(q => q.ch === c.id);
    if (!qs.length) return;
    lines.push(`## ${c.name}`, '');
    qs.forEach((q, i) => {
      const w = store.wrong[q.id];
      lines.push(`### ${i + 1}. ${q.q}`);
      if (q.t !== 'j') q.o.forEach((o, oi) => lines.push(`${String.fromCharCode(65 + oi)}．${o}`));
      lines.push('', `**正确答案：** ${answerLetters(q)}`, `**解析：** ${q.e || '—'}`, `**上次作答：** ${w && w.la ? displayAnswer(q, w.la) : '—'}`, `**知识点：** ${kpLabel(q)}`);
      if (store.notes[q.id]) lines.push(`**笔记：** ${store.notes[q.id]}`);
      lines.push('');
    });
  });
  downloadMarkdown(`错题本-${todayKey()}.md`, lines);
}

function exportAllBank() {
  downloadMarkdown(`完整题库-${TOTAL}题-${todayKey()}.md`, questionsToMarkdown(QS, '2026 新员工上岗资格考试题库（含答案）'));
}

function exportStats() {
  const g = globalStats();
  const ts = typeStats();
  const lines = [`# 学习统计报告`, '', `> 导出于 ${new Date().toLocaleString('zh-CN')}`, ''];
  lines.push('## 总览', '');
  lines.push(`- 题库总量：${TOTAL} 题`);
  lines.push(`- 已练题目：${g.answered} 题（覆盖 ${pct(g.answered, TOTAL)}%）`);
  lines.push(`- 累计作答：${g.attempts} 次，正确 ${g.rights} 次，正确率 ${pct(g.rights, g.attempts)}%`);
  lines.push(`- 已掌握：${g.mastered} 题；错题：${g.wrong} 题；收藏：${g.fav} 题`);
  lines.push(`- 连续学习：${g.streak} 天`, '');
  lines.push('## 题型', '');
  TYPE_ORDER.forEach(t => { const x = ts[t]; lines.push(`- ${TYPE_NAME[t]}：${x.seen}/${x.total} 题，正确率 ${pct(x.rights, x.attempts)}%`); });
  lines.push('', '## 章节', '');
  CHAPTERS.forEach(c => {
    const s = chapterStats(c.id);
    lines.push(`- ${c.name}：已练 ${s.seen}/${s.total}，正确率 ${s.attempts ? pct(s.rights, s.attempts) + '%' : '—'}`);
  });
  lines.push('', '## 薄弱知识点', '');
  const weak = weakKps(10);
  if (!weak.length) lines.push('- 暂无足够数据');
  weak.forEach(w => lines.push(`- ${w.kp}（${chapterOf({ ch: w.ch }).name}）：正确率 ${pct(w.rights, w.attempts)}%，作答 ${w.attempts} 次`));
  lines.push('', '## 最近记录', '');
  store.hist.slice(0, 20).forEach(h => lines.push(`- ${new Date(h.ts).toLocaleString('zh-CN')} · ${h.title} · ${h.score} 分（${h.correct}/${h.total}）`));
  downloadMarkdown(`学习统计-${todayKey()}.md`, lines);
}

registerActions({
  'go-browse': () => navigate('browse'),
  'go-wrong': () => navigate('wrong'),
  'go-stats': () => navigate('stats'),
  'toggle-row': (el) => {
    const id = Number(el.dataset.id);
    const row = el.closest('.q-row');
    const open = state.browse.open.has(id);
    if (open) state.browse.open.delete(id); else state.browse.open.add(id);
    row.classList.toggle('open', !open);
    el.setAttribute('aria-expanded', String(!open));
  },
  'browse-page': (el) => { state.browse.page = Number(el.dataset.page); render(); },
  'reset-browse': () => resetBrowse(),
  'start-filtered': () => {
    const list = filteredBrowse();
    if (!list.length) { toast('当前筛选没有题目', 'warn'); return; }
    const ids = list.map(q => q.id);
    startPractice({ ids, title: '筛选练习 · ' + list.length + ' 题' });
  },
  'export-browse': () => exportBrowse(),
  'remove-wrong': (el) => {
    const id = Number(el.dataset.id);
    delete store.wrong[id];
    save();
    render();
    toast('已移出错题本', 'ok');
  },
  'clear-wrong': () => {
    const n = Object.keys(store.wrong).length;
    if (!n) return;
    confirmDialog('清空错题本？', `将移除 ${n} 道错题记录（答题历史与正确率统计保留），此操作不可撤销。`, { okText: '清空', danger: true }).then(ok => {
      if (!ok) return;
      store.wrong = {};
      saveNow();
      render();
      toast('错题本已清空', 'ok');
    });
  },
  'export-wrong': () => exportWrong(),
  'export-bank': () => exportAllBank(),
  'clear-ai-cache': () => {
    const n = Object.keys(store.aiCache).length;
    store.aiCache = {};
    AI.explain = { text: '', error: '', busy: false, ts: 0, fromCache: false, flavor: 'default' };
    saveNow();
    render();
    toast(n ? `已清理 ${n} 条 AI 解析缓存` : '没有可清理的缓存', n ? 'ok' : '');
  },
  'export-stats': () => exportStats(),
  'ai-wrong': () => {
    const list = Object.keys(store.wrong).map(Number).filter(id => QBYID.has(id));
    if (!list.length) { toast('错题本是空的', 'warn'); return; }
    const sampleList = QS.filter(q => list.includes(q.id)).slice(0, 12);
    const text = sampleList.map(q => `- ${q.q}（答案 ${answerLetters(q)}，知识点 ${kpLabel(q)}）`).join('\n');
    openAI({
      tab: 'chat',
      prompt: `我在保险上岗资格考试刷题，以下是我的部分错题：\n${text}\n\n请归纳这些错题背后的共性薄弱知识点，按重要性排序，并给出针对性的复习顺序和记忆方法。`
    });
  },
  'ai-stats': () => {
    const g = globalStats();
    const weak = weakKps(8).map(w => `${w.kp}（正确率 ${pct(w.rights, w.attempts)}%）`).join('、');
    openAI({
      tab: 'chat',
      prompt: `这是我的学习数据：题库 ${TOTAL} 题，已练 ${g.answered} 题，累计正确率 ${pct(g.rights, g.attempts)}%，错题 ${g.wrong} 道，连续学习 ${g.streak} 天。薄弱知识点：${weak || '暂无'}。请帮我分析当前水平，指出最该优先突破的 3 个方向，并给出一份 7 天复习计划（每天 30–45 分钟）。`
    });
  },
  'ai-plan': () => {
    const g = globalStats();
    openAI({
      tab: 'chat',
      prompt: `我准备参加 2026 年新员工上岗资格考试（保险基础知识），目前题库共 ${TOTAL} 题，我已练 ${g.answered} 题，正确率 ${pct(g.rights, g.attempts)}%，错题 ${g.wrong} 道。请根据这些数据，为我规划今天 30 分钟的学习安排，具体到今天练什么、练多少题、怎么复盘。`
    });
  },
  'set-theme': (el) => { store.settings.theme = el.dataset.theme; save(); applyTheme(); render(); },
  'set-font': (el) => { store.settings.fontSize = Number(el.dataset.size); save(); applyFontSize(); render(); },
  'toggle-key': () => { state.showKey = !state.showKey; render(); },
  'toggle-ai-nokey': () => {
    store.settings.ai.allowNoKey = !store.settings.ai.allowNoKey;
    save();
    render();
  },
  'ai-preset': (el) => {
    const key = el.dataset.preset;
    const p = AI_PRESETS[key];
    store.settings.ai.preset = key;
    if (key !== 'custom') {
      store.settings.ai.base = p.base;
      store.settings.ai.model = p.model;
    }
    save();
    render();
    toast('已切换至 ' + p.name);
  },
  'test-ai': () => testAIConnection(),
  'ai-help': () => showAIHelp(),
  'export-data': () => {
    const copy = clone(store);
    delete copy.settings.ai.key;
    downloadFile(`刷题进度备份-${todayKey()}.json`, JSON.stringify(copy, null, 1), 'application/json;charset=utf-8');
    toast('备份已导出（不含 API Key）', 'ok');
  },
  'import-data': () => { const f = $('#importFile'); if (f) f.click(); },
  'reset-progress': () => {
    confirmDialog('清空学习进度？', '将删除当前账号的答题记录、错题、收藏、笔记、AI 缓存和统计记录，并同步清空云端进度；AI 配置会保留。建议先导出备份。', { okText: '清空进度', danger: true }).then(ok => {
      if (!ok) return;
      const settings = store.settings;
      store = defaultStore();
      store.settings = settings;
      store.createdAt = Date.now();
      saveNow();
      state.session = null;
      state.result = null;
      state.review = null;
      render();
      toast('学习进度已清空', 'ok');
    });
  },
  'reset-all': () => {
    confirmDialog('清除本机缓存并退出？', '只会清除这台设备上的缓存和登录状态，云端账号数据不会删除；下次登录会从云端恢复。', { okText: '清除并退出', danger: true }).then(ok => {
      if (!ok) return;
      try {
        if (activeUser && activeUser.id) clearLocalUser(activeUser.id);
        clearSession();
      } catch (e) {}
      location.reload();
    });
  }
});

registerInputs({
  'ai-base': debounce((el) => { store.settings.ai.base = el.value.trim(); store.settings.ai.preset = 'custom'; save(); }, 300),
  'ai-model': debounce((el) => { store.settings.ai.model = el.value.trim(); save(); }, 300),
  'ai-key': debounce((el) => { store.settings.ai.key = el.value.trim(); save(); }, 300),
  'ai-temp': (el) => {
    store.settings.ai.temp = Number(el.value);
    const v = $('#tempVal'); if (v) v.textContent = Number(el.value).toFixed(1);
    save();
  },
  'setting-goal': debounce((el) => {
    const n = clamp(Number(el.value) || 30, 5, 300);
    store.settings.dailyGoal = n; save();
  }, 350),
  'setting-exam-date': (el) => { store.settings.examDate = el.value; save(); },
  'setting-pass': debounce((el) => {
    store.settings.passScore = clamp(Number(el.value) || 60, 30, 100); save();
  }, 350)
});

registerChanges({
  'import-file': (el) => {
    const file = el.files && el.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (!data || typeof data !== 'object' || !data.settings) throw new Error('文件格式不正确');
        confirmDialog('导入备份？', '导入将覆盖当前的学习进度与设置（API Key 会保留当前值）。', { okText: '导入' }).then(ok => {
          if (!ok) return;
          const currentKey = store.settings.ai.key;
          store = mergeStore(data);
          if (!store.settings.ai.key) store.settings.ai.key = currentKey;
          saveNow();
          state.session = null;
          state.result = null;
          render();
          toast('备份导入成功', 'ok');
        });
      } catch (e) {
        toast('导入失败：' + e.message, 'bad', 4000);
      }
      el.value = '';
    };
    reader.readAsText(file);
  }
});


/* ---- js/50-ai.js ---- */
/* ============================================================
   AI 学习助手：流式解析、追问、Markdown、缓存与配置
   ============================================================ */

const AI = {
  open: false,
  tab: 'explain',
  qid: null,
  explain: { text: '', error: '', busy: false, ts: 0, fromCache: false, flavor: 'default' },
  chat: [],
  busy: false,
  ctrl: null,
  draft: '',
  lastError: '',
  pending: null
};

const EXPLAIN_PROMPTS = {
  default: '请解析这道题：\n1. 用一句话点出核心考点；\n2. 说明正确答案为什么正确；\n3. 逐项分析其余选项为什么错（判断题则说明判断依据）；\n4. 给出一个易混点提醒或记忆口诀。\n请控制在 500 字以内，条理清晰。',
  simple: '请用最通俗易懂的语言讲解这道题，假设我是零基础的新员工。可以用生活化的类比，最后用一句话总结考点。',
  options: '请逐项分析这道题的 A、B、C、D 四个选项：每个选项为什么对、为什么错，分别对应哪个知识点。如果是判断题，请说明让该说法成立/不成立的关键条件。',
  mnemonic: '请为这道题涉及的知识点设计一个好记的记忆方法：可以是口诀、对比表、关键词串联或场景联想，并说明怎么用。',
  confusable: '请指出这道题最容易混淆的概念，做一个简明对比表（至少 2 组），并提醒考试中常见的设坑方式。'
};

const QUICK_EXPLAIN = [
  { label: '通俗讲解', flavor: 'simple' },
  { label: '逐项分析', flavor: 'options' },
  { label: '记忆口诀', flavor: 'mnemonic' },
  { label: '易混对比', flavor: 'confusable' }
];
const QUICK_CHAT = [
  { label: '今日学习计划', prompt: '请根据我的学习进度，为我制定今天 30 分钟的学习计划，要具体到练什么、练多少题。' },
  { label: '分析薄弱点', prompt: '请分析我当前的薄弱知识点，并按优先级给出复习建议。' },
  { label: '出 3 道模拟题', prompt: '请围绕保险基础知识出一个知识点的 3 道模拟题（单选、多选、判断各一道），先出题，再在最后统一给答案和解析。' },
  { label: '帮我复盘错题', prompt: '请告诉我错题复盘的正确方法，并结合保险考试的特点给出一个可执行的复盘流程。' }
];

const AI_SYSTEM_EXPLAIN = '你是一位资深的保险从业资格考试辅导老师，擅长把抽象的保险原理讲得清晰、准确、好记。题库给出的标准答案视为绝对正确，不要质疑、修改或给出其他答案。题目提供了离线解析时，请以离线解析为事实基础进行补充和深化，不要与之矛盾。如果题目提供了【用户界面显示顺序】，提到选项时请使用该顺序的字母并同时带上选项内容，避免用户界面与原始顺序不一致造成歧义。请使用简体中文，结构清楚，适度使用小标题、列表和对比表；不要输出与题目无关的客套话。';
const AI_SYSTEM_CHAT = '你是一位耐心、专业的保险考试学习教练，服务对象是准备参加 2026 年新员工上岗资格考试（保险基础知识）的学员。你可以讲解题目、梳理知识点、制定计划、出题检验。涉及具体题目时，以题库标准答案为准，不要给出矛盾答案；题目附有离线解析时，以其为事实基础补充。如有【用户界面显示顺序】，请按该顺序称呼选项并带上选项内容。回答使用简体中文，简洁实用，能落地。';

function aiConfigured() {
  const ai = store.settings.ai;
  return !!(ai.base && ai.model && ai.base.trim() && ai.model.trim() &&
    ((ai.key && ai.key.trim()) || ai.allowNoKey || isLocalBase(ai.base)));
}
function isLocalBase(base) {
  return /^https?:\/\/(localhost|127\.0\.0\.1|0\.0\.0\.0|\[::1\])/i.test(base || '');
}
function aiCacheKey(q, perm) {
  return `${q.id}|${store.settings.ai.model || 'default'}|${perm && perm.length ? perm.join('') : 'orig'}`;
}
function aiModelLabel() {
  return store.settings.ai.model || '未配置模型';
}

function questionContext(q, perm) {
  if (!q) return '';
  const opts = q.t === 'j'
    ? '【选项】正确 / 错误'
    : q.o.map((o, i) => `${String.fromCharCode(65 + i)}．${o}`).join('\n');
  const shown = perm && q.t !== 'j'
    ? '\n【用户界面显示顺序】' + optionList(q, perm).map(o => `${o.letter}．${o.text}`).join('；') + '\n（如提到选项，请优先用选项内容指代；必须用字母时，请使用上面的界面显示字母。）'
    : '';
  const answerLine = q.t === 'j'
    ? (q.a === 'T' ? '正确' : '错误')
    : `${answerLetters(q)}（${q.o.filter((o, i) => answerSet(q.a).has(String.fromCharCode(65 + i))).join('；')}）`;
  return `【章节】${chapterOf(q).name}
【知识点】${kpLabel(q)}
【题型】${TYPE_NAME[q.t]}
【题干】${q.q}
${opts}
【标准答案】${answerLine}
【离线解析】${q.e || '无'}${shown}`;
}
function currentPermFor(q) {
  return state.session && state.session.perm ? state.session.perm[q.id] : null;
}

function statsContext() {
  const g = globalStats();
  const ts = typeStats();
  const weak = weakKps(6).map(w => `${w.kp}（正确率 ${pct(w.rights, w.attempts)}%）`).join('；');
  return `【学习数据】题库 ${TOTAL} 题，已练 ${g.answered} 题，累计作答 ${g.attempts} 次，正确率 ${pct(g.rights, g.attempts)}%，错题 ${g.wrong} 道，收藏 ${g.fav} 道，连续学习 ${g.streak} 天。
【题型】单选 ${ts.s.seen}/${ts.s.total}，多选 ${ts.m.seen}/${ts.m.total}，判断 ${ts.j.seen}/${ts.j.total}。
【薄弱知识点】${weak || '暂无足够数据'}`;
}

/* ---------------- 打开 / 关闭 ---------------- */
function openAI(opts = {}) {
  const hadQid = AI.qid;
  let qid = opts.qid !== undefined ? opts.qid : AI.qid;
  qid = qid != null ? Number(qid) : null;
  if (qid != null && !QBYID.has(qid)) qid = null;
  if (qid !== hadQid) {
    AI.explain = { text: '', error: '', busy: false, ts: 0, fromCache: false, flavor: 'default' };
    AI.chat = [];
    AI.qid = qid;
    if (qid) {
      const q = QBYID.get(qid);
      const cached = store.aiCache[aiCacheKey(q, currentPermFor(q))];
      if (cached && cached.t) {
        AI.explain.text = cached.t;
        AI.explain.ts = cached.ts || 0;
        AI.explain.fromCache = true;
      }
    }
  }
  AI.tab = opts.tab || (qid ? 'explain' : 'chat');
  if (opts.tab === 'explain' && !qid) AI.tab = 'chat';
  AI.open = true;
  state.aiOpen = true;
  AI.pending = opts.prompt || null;
  AI.lastError = '';
  renderAIShell();
  const drawer = $('#aiDrawer');
  drawer.classList.add('open');
  drawer.setAttribute('aria-hidden', 'false');
  const scrim = $('#aiScrim');
  scrim.hidden = false;
  scrim.classList.add('show');
  document.body.classList.add('ai-open');
  if (AI.tab === 'chat' && AI.pending) {
    const p = AI.pending;
    AI.pending = null;
    sendChat(p);
  } else if (opts.auto && AI.tab === 'explain' && qid && !AI.explain.text) {
    sendExplain('default');
  }
}
function closeAI() {
  AI.open = false;
  state.aiOpen = false;
  if (AI.ctrl) { try { AI.ctrl.abort(); } catch (e) {} AI.ctrl = null; }
  AI.busy = false;
  AI.explain.busy = false;
  const drawer = $('#aiDrawer');
  if (drawer) { drawer.classList.remove('open'); drawer.setAttribute('aria-hidden', 'true'); }
  const scrim = $('#aiScrim');
  if (scrim) { scrim.classList.remove('show'); setTimeout(() => { if (!AI.open) scrim.hidden = true; }, 260); }
  document.body.classList.remove('ai-open');
}

/* ---------------- 渲染 ---------------- */
function renderAIShell() {
  const drawer = $('#aiDrawer');
  if (!drawer) return;
  const q = AI.qid ? QBYID.get(AI.qid) : null;
  const contextText = q
    ? `第 ${q.id} 题 · ${TYPE_NAME[q.t]} · ${kpLabel(q)}`
    : '学习教练模式 · 可问计划、知识点、错题';
  drawer.innerHTML = `
    <div class="ai-head">
      <div class="ai-orb">${icon('sparkles')}</div>
      <div class="ai-title"><b>AI 学习助手</b><span>${aiConfigured() ? esc(aiModelLabel()) : '尚未配置，点击设置'}</span></div>
      <button class="icon-btn sm bare" data-act="ai-settings" title="AI 设置">${icon('settings')}</button>
      <button class="icon-btn sm bare" data-act="ai-close" title="关闭" aria-label="关闭 AI 助手">${icon('close')}</button>
    </div>
    <div class="ai-context">${icon(q ? 'book' : 'user')}<span>${esc(contextText)}</span>${q ? `<button class="badge badge-muted" style="margin-left:auto" data-act="ai-peek" data-id="${q.id}">查看题目</button>` : ''}</div>
    <div class="ai-tabs">
      <button class="${AI.tab === 'explain' ? 'active' : ''}" data-act="ai-tab" data-tab="explain" ${q ? '' : 'disabled style="opacity:.45"'}>本题解析</button>
      <button class="${AI.tab === 'chat' ? 'active' : ''}" data-act="ai-tab" data-tab="chat">自由提问</button>
    </div>
    <div class="ai-body" id="aiBody"></div>
    <div class="ai-quick" id="aiQuick"></div>
    <div class="ai-compose">
      <textarea class="textarea" id="aiInput" rows="1" placeholder="${!aiConfigured() ? '请先在设置中配置 AI 模型' : AI.tab === 'explain' ? '针对这道题继续追问…' : '问问知识点、计划或错题…'}" ${!aiConfigured() ? 'disabled' : ''}>${esc(AI.draft)}</textarea>
      <button class="ai-send" id="aiSend" data-act="ai-send" title="发送（Enter）" aria-label="发送">${icon('send')}</button>
    </div>
    <div class="ai-foot">AI 内容由模型生成，仅供理解参考，请以题库答案与教材为准</div>`;
  updateAIBody();
  updateAIQuick();
  updateAISendState();
  const input = $('#aiInput');
  if (input) {
    input.addEventListener('input', () => { AI.draft = input.value; });
    autoGrow(input);
  }
}

function updateAIQuick() {
  const el = $('#aiQuick');
  if (!el) return;
  if (!aiConfigured() || AI.busy) { el.innerHTML = ''; return; }
  if (AI.tab === 'explain') {
    if (!AI.qid) { el.innerHTML = ''; return; }
    el.innerHTML = QUICK_EXPLAIN.map(q => `<button data-act="ai-flavor" data-flavor="${q.flavor}">${q.label}</button>`).join('');
  } else {
    el.innerHTML = QUICK_CHAT.map((q, i) => `<button data-act="ai-chat-quick" data-i="${i}">${q.label}</button>`).join('');
  }
}

function updateAISendState() {
  const btn = $('#aiSend');
  if (!btn) return;
  if (AI.busy) {
    btn.className = 'ai-send stop';
    btn.dataset.act = 'ai-stop';
    btn.innerHTML = icon('stop');
    btn.title = '停止生成';
  } else {
    btn.className = 'ai-send';
    btn.dataset.act = 'ai-send';
    btn.innerHTML = icon('send');
    btn.title = '发送（Enter）';
  }
  const input = $('#aiInput');
  if (input) input.disabled = AI.busy || !aiConfigured();
  btn.disabled = !aiConfigured() && !AI.busy;
}

function updateAIBody() {
  const body = $('#aiBody');
  if (!body) return;
  const q = AI.qid ? QBYID.get(AI.qid) : null;
  body.innerHTML = aiBodyHTML(q);
  scrollAIBottom();
}

function aiBodyHTML(q) {
  if (!aiConfigured()) {
    return `<div class="ai-setup">
      <div class="ai-orb" style="margin:0 auto 10px;width:44px;height:44px;border-radius:14px">${icon('sparkles')}</div>
      <h4>先连接一个 AI 模型</h4>
      <p>支持 DeepSeek、通义千问、智谱、Moonshot、OpenAI 以及本地 Ollama。配置一次即可长期使用，Key 只保存在本机。</p>
      <button class="btn btn-primary btn-sm" data-act="ai-settings">${icon('settings')} 去配置</button>
      <button class="btn btn-ghost btn-sm" data-act="ai-help" style="margin-top:6px">${icon('info')} 如何配置</button>
    </div>`;
  }
  if (AI.tab === 'explain') {
    if (!q) {

/* ---------------- 请求 ---------------- */
function normalizeBase(base) {
  return (base || '').trim().replace(/\/+$/, '');
}
function chatEndpoint(base) {
  const b = normalizeBase(base);
  if (/\/chat\/completions$/i.test(b)) return b;
  return b + '/chat/completions';
}
function aiHeaders(hasBody = true) {
  const h = { Accept: 'text/event-stream' };
  if (hasBody) h['Content-Type'] = 'application/json';
  const key = (store.settings.ai.key || '').trim();
  if (key) h['Authorization'] = 'Bearer ' + key;
  return h;
}
function friendlyHTTPError(status, body) {
  let detail = '';
  try {
    const j = JSON.parse(body);
    detail = (j.error && (j.error.message || j.error.code)) || j.message || '';
  } catch (e) {
    detail = String(body || '').slice(0, 160);
  }
  const map = {
    400: '请求参数有误，请检查模型名称',
    401: 'API Key 无效或未填写',
    402: '账户余额不足',
    403: '没有访问权限，请检查 Key 或模型权限',
    404: '接口地址或模型不存在，请检查 Base URL 与模型名',
    429: '请求过于频繁或额度耗尽，请稍后再试',
    500: 'AI 服务端错误，请稍后重试',
    502: 'AI 网关错误，请稍后重试',
    503: 'AI 服务暂时不可用'
  };
  return (map[status] || `请求失败（HTTP ${status}）`) + (detail ? `：${detail}` : '');
}
function friendlyNetworkError(err) {
  const msg = err && err.message ? err.message : String(err);
  if (/abort/i.test(msg)) return '请求已停止';
  return '无法连接 AI 服务。常见原因：API 地址填写错误、网络不通，或浏览器跨域（CORS）被服务商拦截。可尝试更换支持 CORS 的接口地址，或使用本地 Ollama。';
}

async function streamChat(messages, opts = {}) {
  const ai = store.settings.ai;
  if (!ai.base || !ai.model) throw new Error('请先在设置中填写 API 地址与模型名称');
  const controller = new AbortController();
  AI.ctrl = controller;
  let idleTimer = null;
  const resetTimer = () => {
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => { try { controller.abort(); } catch (e) {} }, 100000);
  };
  resetTimer();
  try {
    const res = await fetch(chatEndpoint(ai.base), {
      method: 'POST',
      headers: aiHeaders(true),
      body: JSON.stringify({
        model: ai.model.trim(),
        messages,
        temperature: Number(ai.temp),
        stream: true
      }),
      signal: controller.signal
    }).catch(err => {
      if (/abort/i.test((err && err.message) || '')) throw err;
      throw new Error(friendlyNetworkError(err));
    });
    if (!res.ok) {
      const text = await res.text().catch(() => '');
      throw new Error(friendlyHTTPError(res.status, text));
    }
    const ct = (res.headers.get('content-type') || '').toLowerCase();
    if (!res.body || ct.includes('application/json')) {
      const json = await res.json();
      const content = json.choices && json.choices[0] && (json.choices[0].message && json.choices[0].message.content || json.choices[0].text) || '';
      if (content) opts.onDelta(content, content);
      return content;
    }
    const reader = res.body.getReader();
    const decoder = new TextDecoder('utf-8');
    let buffer = '';
    let out = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      resetTimer();
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();
      for (const rawLine of lines) {
        const line = rawLine.trim();
        if (!line || !line.startsWith('data:')) continue;
        const data = line.slice(5).trim();
        if (!data || data === '[DONE]') continue;
        let json;
        try { json = JSON.parse(data); } catch (e) { continue; }
        if (json.error) throw new Error(friendlyHTTPError(500, JSON.stringify(json)));
        const choice = json.choices && json.choices[0];
        const delta = choice && ((choice.delta && choice.delta.content) || (choice.message && choice.message.content)) || '';
        if (delta) {
          out += delta;
          opts.onDelta(delta, out);
        }
      }
    }
    buffer += decoder.decode();
    if (!out && buffer.trim()) {
      const line = buffer.trim();
      if (line.startsWith('data:')) {
        try {
          const json = JSON.parse(line.slice(5).trim());
          const c = json.choices && json.choices[0] && json.choices[0].delta && json.choices[0].delta.content;
          if (c) { out += c; opts.onDelta(c, out); }
        } catch (e) {}
      }
    }
    return out;
  } finally {
    clearTimeout(idleTimer);
    if (AI.ctrl === controller) AI.ctrl = null;
  }
}

async function callAIOnce(messages, opts = {}) {
  const ai = store.settings.ai;
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), opts.timeout || 35000);
  try {
    const res = await fetch(chatEndpoint(ai.base), {
      method: 'POST',
      headers: aiHeaders(true),
      body: JSON.stringify({
        model: ai.model.trim(),
        messages,
        temperature: 0.2,
        stream: false,
        max_tokens: opts.maxTokens || 64
      }),
      signal: controller.signal
    }).catch(err => { throw new Error(friendlyNetworkError(err)); });
    if (!res.ok) {
      const text = await res.text().catch(() => '');
      throw new Error(friendlyHTTPError(res.status, text));
    }
    const json = await res.json();
    return (json.choices && json.choices[0] && json.choices[0].message && json.choices[0].message.content) || '';
  } finally {
    clearTimeout(timer);
  }
}

/* ---------------- 解析 ---------------- */
async function sendExplain(flavor = 'default') {
  const q = AI.qid ? QBYID.get(AI.qid) : null;
  if (!q) { toast('请先选择一道题目', 'warn'); return; }
  if (AI.busy) return;
  if (!aiConfigured()) { toast('请先配置 AI 模型', 'warn'); renderAIShell(); return; }
  AI.tab = 'explain';
  AI.explain = { text: '', error: '', busy: true, ts: 0, fromCache: false, flavor };
  AI.busy = true;
  AI.lastError = '';
  renderAIShell();
  const prompt = (EXPLAIN_PROMPTS[flavor] || EXPLAIN_PROMPTS.default) + '\n\n' + questionContext(q, currentPermFor(q));
  let text = '';
  try {
    await streamChat(
      [
        { role: 'system', content: AI_SYSTEM_EXPLAIN },
        { role: 'user', content: prompt }
      ],
      {
        onDelta: (delta, full) => {
          text = full;
          AI.explain.text = text;
          scheduleAIBodyUpdate();
        }
      }
    );
    AI.explain.text = text;
    AI.explain.busy = false;
    AI.busy = false;
    AI.explain.ts = Date.now();
    AI.explain.fromCache = false;
    if (flavor === 'default' && text.trim()) {
      const perm = currentPermFor(q);
      store.aiCache[aiCacheKey(q, perm)] = { t: text, ts: AI.explain.ts, model: aiModelLabel() };
      pruneAICache();
      save();
    }
    renderAIShell();
  } catch (e) {
    AI.busy = false;
    AI.explain.busy = false;
    if (/abort/i.test(e.message || '')) {
      AI.explain.text = text;
      renderAIShell();
      return;
    }
    AI.explain.error = e.message || String(e);
    AI.explain.text = text;
    renderAIShell();
  }
}

function pruneAICache() {
  const entries = Object.entries(store.aiCache).sort((a, b) => (b[1].ts || 0) - (a[1].ts || 0));
  if (entries.length > 60) {
    store.aiCache = Object.fromEntries(entries.slice(0, 60));
  }
}

/* ---------------- 自由对话 ---------------- */
async function sendChat(presetText) {
  if (AI.busy) return;
  if (!aiConfigured()) { toast('请先配置 AI 模型', 'warn'); renderAIShell(); return; }
  const input = $('#aiInput');
  let text = presetText;
  if (text == null) {
    text = (input ? input.value : AI.draft) || '';
  }
  text = text.trim();
  if (!text) return;
  AI.tab = 'chat';
  AI.draft = '';
  if (input) input.value = '';
  const q = AI.qid ? QBYID.get(AI.qid) : null;
  AI.chat.push({ role: 'user', content: text });
  AI.chat.push({ role: 'assistant', content: '', streaming: true });
  AI.busy = true;
  AI.lastError = '';
  renderAIShell();
  const history = AI.chat.filter(m => !m.error).slice(-13, -1).map(m => ({ role: m.role, content: m.content }));
  const system = AI_SYSTEM_CHAT + '\n\n' + (q ? '当前正在学习的题目：\n' + questionContext(q, currentPermFor(q)) : statsContext());
  let acc = '';
  try {
    await streamChat([{ role: 'system', content: system }, ...history], {
      onDelta: (delta, full) => {
        acc = full;
        const last = AI.chat[AI.chat.length - 1];
        if (last && last.role === 'assistant') last.content = acc;
        scheduleAIBodyUpdate();
      }
    });
    const last = AI.chat[AI.chat.length - 1];
    if (last) { last.content = acc; last.streaming = false; }
    AI.busy = false;
    if (!acc.trim()) {
      if (last) { last.error = '模型没有返回内容，请换一个模型或重试。'; last.content = ''; }
    }
    renderAIShell();
  } catch (e) {
    const last = AI.chat[AI.chat.length - 1];
    AI.busy = false;
    if (/abort/i.test(e.message || '')) {
      if (last) { last.content = acc; last.streaming = false; }
      renderAIShell();
      return;
    }
    if (last && !acc) {
      last.error = e.message || String(e);
      last.content = '';
    } else if (last) {
      last.content = acc;
      last.streaming = false;
      last.error = e.message || String(e);
    }
    renderAIShell();
  }
}

function stopAI() {
  if (AI.ctrl) { try { AI.ctrl.abort(); } catch (e) {} }
  AI.busy = false;
  AI.explain.busy = false;
  const last = AI.chat[AI.chat.length - 1];
  if (last && last.streaming) last.streaming = false;
  updateAIBody();
  updateAISendState();
  updateAIQuick();
}

/* ---------------- Markdown ---------------- */
function renderMarkdown(src) {
  if (!src) return '';
  let s = String(src).replace(/\r\n?/g, '\n');
  const codeBlocks = [];
  s = s.replace(/```([a-zA-Z0-9_+-]*)\n?([\s\S]*?)```/g, (m, lang, code) => {
    const i = codeBlocks.length;
    codeBlocks.push({ lang, code });
    return `\u0000CODE${i}\u0000`;
  });
  s = esc(s);
  const lines = s.split('\n');
  const html = [];
  const listStack = [];
  let para = [];
  let quote = [];
  const flushPara = () => {
    if (para.length) { html.push(`<p>${inlineMd(para.join('<br>'), codeBlocks)}</p>`); para = []; }
  };
  const flushQuote = () => {
    if (quote.length) { html.push(`<blockquote>${inlineMd(quote.join('<br>'), codeBlocks)}</blockquote>`); quote = []; }
  };
  const closeLists = (toLevel = 0) => {
    while (listStack.length > toLevel) {
      html.push(`</${listStack.pop()}>`);
    }
  };
  const openList = (type) => {
    if (listStack.length && listStack[listStack.length - 1] === type) return;
    if (listStack.length === 1 && listStack[0] !== type) { closeLists(0); }
    html.push(`<${type}>`);
    listStack.push(type);
  };
  const splitRow = (line) => line.replace(/^\s*\|/, '').replace(/\|\s*$/, '').split('|').map(c => c.trim());

  for (let i = 0; i < lines.length; i++) {
    let line = lines[i];
    const trimmed = line.trim();
    if (!trimmed) {
      flushPara(); flushQuote(); closeLists();
      continue;
    }
    const codeMatch = trimmed.match(/^\u0000CODE(\d+)\u0000$/);
    if (codeMatch) {
      flushPara(); flushQuote(); closeLists();
      const block = codeBlocks[Number(codeMatch[1])];
      if (block) html.push(`<pre><code>${esc(block.code.replace(/\n$/, ''))}</code></pre>`);
      continue;
    }
    const heading = trimmed.match(/^(#{1,4})\s+(.*)$/);
    if (heading) {
      flushPara(); flushQuote(); closeLists();
      const level = Math.min(4, heading[1].length);
      html.push(`<h${level}>${inlineMd(heading[2], codeBlocks)}</h${level}>`);
      continue;
    }
    if (/^(-{3,}|\*{3,}|_{3,})$/.test(trimmed)) {
      flushPara(); flushQuote(); closeLists();
      html.push('<hr>');
      continue;
    }
    if (/^(?:&gt;|>)\s?/.test(trimmed)) {
      flushPara(); closeLists();
      quote.push(trimmed.replace(/^(?:&gt;|>)\s?/, ''));
      continue;
    }
    flushQuote();
    // 表格：当前行含 |，下一行是分隔行
    if (trimmed.includes('|') && i + 1 < lines.length && /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)+\|?\s*$/.test(lines[i + 1])) {
      flushPara(); closeLists();
      const headers = splitRow(trimmed);
      const aligns = splitRow(lines[i + 1]).map(c => /^:-+:$/.test(c) ? 'center' : /^-+:$/.test(c) ? 'right' : 'left');
      i += 1;
      const rows = [];
      while (i + 1 < lines.length && lines[i + 1].includes('|') && lines[i + 1].trim()) {
        i += 1;
        rows.push(splitRow(lines[i]));
      }
      html.push('<table><thead><tr>' + headers.map((h, hi) => `<th style="text-align:${aligns[hi] || 'left'}">${inlineMd(h, codeBlocks)}</th>`).join('') + '</tr></thead><tbody>' +
        rows.map(r => '<tr>' + r.map((c, ci) => `<td style="text-align:${aligns[ci] || 'left'}">${inlineMd(c, codeBlocks)}</td>`).join('') + '</tr>').join('') + '</tbody></table>');
      continue;
    }
    const ul = trimmed.match(/^[-*+]\s+(.*)$/);
    const ol = trimmed.match(/^\d+[.)]\s+(.*)$/);
    if (ul || ol) {
      flushPara();
      const type = ul ? 'ul' : 'ol';
      openList(type);
      html.push(`<li>${inlineMd(ul ? ul[1] : ol[1], codeBlocks)}</li>`);
      continue;
    }
    closeLists();
    para.push(line);
  }
  flushPara(); flushQuote(); closeLists();
  return html.join('');
}

function inlineMd(text, codeBlocks) {
  let s = text;
  s = s.replace(/`([^`]+)`/g, (m, c) => `<code>${c}</code>`);
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/__([^_]+)__/g, '<strong>$1</strong>');
  s = s.replace(/~~([^~]+)~~/g, '<del>$1</del>');
  s = s.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>');
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  s = s.replace(/\u0000CODE(\d+)\u0000/g, (m, i) => {
    const block = codeBlocks[Number(i)];
    return block ? `<pre><code>${esc(block.code.replace(/\n$/, ''))}</code></pre>` : '';
  });
  return s;
}

async function sbAuth(path, opts = {}) {
  const cfg = cloudConfig();
  if (!cloudConfigured()) throw new CloudError('尚未配置 Supabase 地址与 anon key', 0, false);
  const headers = {
    apikey: cfg.anonKey,
    'Content-Type': 'application/json',
    Accept: 'application/json'
  };
  if (opts.token) headers.Authorization = 'Bearer ' + opts.token;
  else headers.Authorization = 'Bearer ' + cfg.anonKey;
  let res;
  try {
    res = await fetch(cfg.url + path, {
      method: opts.method || (opts.body ? 'POST' : 'GET'),
      headers,
      body: opts.body ? JSON.stringify(opts.body) : undefined
    });
  } catch (e) {
    throw new CloudError('无法连接云端服务，请检查网络或 Supabase 地址', 0, true);
  }
  const text = await res.text().catch(() => '');
  let json = null;
  try { json = text ? JSON.parse(text) : null; } catch (e) {}
  if (!res.ok) {
    const msg = errorMessageFrom(json, text || ('请求失败（HTTP ' + res.status + '）'));
    throw new CloudError(msg, res.status, false);
  }

}

async function sbRest(path, opts = {}) {
  let s = await ensureSession();
  const cfg = cloudConfig();
  const headers = {
    apikey: cfg.anonKey,
    Authorization: 'Bearer ' + s.access_token,
    'Content-Type': 'application/json',
    Accept: 'application/json'
  };
  if (opts.prefer) headers.Prefer = opts.prefer;
  const doFetch = token => fetch(cfg.url + '/rest/v1/' + path, {
    method: opts.method || 'GET',
    headers: Object.assign({}, headers, { Authorization: 'Bearer ' + token }),
    body: opts.body
  });
  let res;
  try {
    res = await doFetch(s.access_token);
  } catch (e) {
    throw new CloudError('网络连接失败，数据暂未同步', 0, true);
  }
  if (res.status === 401) {
    const next = await refreshSession();
    if (!next) throw new CloudError('登录状态已过期，请重新登录', 401);
    s = next;
    try {
      res = await doFetch(s.access_token);
    } catch (e) {
      throw new CloudError('网络连接失败，数据暂未同步', 0, true);
    }
  }
  const text = await res.text().catch(() => '');
  let json = null;
  try { json = text ? JSON.parse(text) : null; } catch (e) {}
  if (!res.ok) {
    throw new CloudError(errorMessageFrom(json, text || ('同步失败（HTTP ' + res.status + '）')), res.status, false);
  }
  return json;
}

function scheduleCloudSync(delay = 1400) {

async function syncNow(opts = {}) {
  if (!cloudBooted || !activeUser || !cloudConfigured()) return false;
  if (cloudSyncInFlight) { cloudSyncQueued = true; return false; }
  cloudSyncInFlight = true;
  const sentAt = Date.now();
  setCloudStatus('syncing');
  try {
    const s = await ensureSession();
    const uid = activeUser.id;
    const row = await saveCloudState(uid, cloudPayload());
    const meta = readMeta(uid);
    const changedDuringSync = !!(meta.localUpdatedAt && meta.localUpdatedAt > sentAt + 50);
    writeMeta(uid, {
      dirty: changedDuringSync,
      localUpdatedAt: meta.localUpdatedAt || sentAt,
      cloudUpdatedAt: row && row.updated_at ? row.updated_at : new Date().toISOString(),
      lastSyncAt: Date.now()
    });
    cloudLastSync = Date.now();
    setCloudStatus(changedDuringSync ? 'dirty' : 'synced');
    if (opts.toast) toast(changedDuringSync ? '已同步，仍有新改动待上传' : '云端已同步', changedDuringSync ? 'warn' : 'ok');
    if (cloudSyncQueued || changedDuringSync) { cloudSyncQueued = false; scheduleCloudSync(400); }

  } catch (e) {
    cloudSyncQueued = false;
    if (e.network) setCloudStatus('offline', e.message);
    else setCloudStatus('error', e.message);

}

/* ---------------- 登录态恢复 ---------------- */
function consumeAuthHash() {
  const h = location.hash || '';
  if (!h || (!/[#&]access_token=/.test(h) && !/[#&]error=/.test(h) && !/[#&]type=/.test(h))) return null;
  const p = new URLSearchParams(h.slice(1));
  const err = p.get('error_description') || p.get('error');
  if (err) {
    authState.msg = decodeURIComponent(err.replace(/\+/g, ' '));
    authState.msgType = 'error';
    history.replaceState(null, '', location.pathname + location.search);
    return null;
  }
  const token = p.get('access_token');
  if (!token) return null;
  const s = {
    access_token: token,
    refresh_token: p.get('refresh_token') || '',
    expires_at: Date.now() + (Number(p.get('expires_in')) || 3600) * 1000,
    token_type: p.get('token_type') || 'bearer',
    user: null
  };
  if (p.get('type') === 'recovery') {
    recoveryMode = true;
    authState.recovery = true;
  }
  writeSession(s);
  history.replaceState(null, '', location.pathname + location.search);
  return s;
}
async function restoreCloudSession() {
  const hashSession = consumeAuthHash();
  let s = hashSession || readSession();
  if (!s || !s.access_token) return null;
  cloudSession = s;
  if (!s.user) {
    try { s.user = await authGetUser(s.access_token); writeSession(s); }
    catch (e) { if (e.network) return { session: s, offline: true }; clearSession(); return null; }
  }
  if (s.expires_at && s.expires_at < Date.now() + 60000) {
    try {
      const next = await refreshSession();
      if (!next) return null;
      s = next;
    } catch (e) {
      if (e.network) return { session: s, offline: true };
      clearSession();
      return null;
    }
  }
  cloudSession = s;
  cloudUser = s.user;
  return { session: s, offline: false };
}

    return true;
  }
  localStorage.setItem(CLOUD.legacyDismiss + uid, '1');
  return false;
}
async function resolveConflict(cloudRow, localData, meta) {
  const localStats = legacyStats(localData) || { answered: 0, wrong: 0, fav: 0 };
  const cloudData = cloudRow.data || {};
  const cloudStats = legacyStats(cloudData) || { answered: 0, wrong: 0, fav: 0 };
  const choice = await openModal({
    title: '发现两份不同的进度',
    desc: '这台设备和云端都有未合并的数据，请选择保留哪一份。',
    wide: true,
    dismissible: false,
    body: `<div class="grid-2" style="gap:10px">
      <div class="local-note" style="margin:0"><b>${icon('cloud')} 云端</b><br>已练 ${cloudStats.answered} 题 · 错题 ${cloudStats.wrong} 道 · 收藏 ${cloudStats.fav} 道<br><span class="faint">更新于 ${cloudRow.updated_at ? new Date(cloudRow.updated_at).toLocaleString('zh-CN') : '未知'}</span></div>
      <div class="local-note" style="margin:0"><b>${icon('book')} 本机</b><br>已练 ${localStats.answered} 题 · 错题 ${localStats.wrong} 道 · 收藏 ${localStats.fav} 道<br><span class="faint">本机修改于 ${meta.localUpdatedAt ? new Date(meta.localUpdatedAt).toLocaleString('zh-CN') : '未知'}</span></div>
    </div>`,
    actions: [
      { label: '使用云端（覆盖本机）', value: 'cloud', cls: 'btn-primary' },
      { label: '使用本机（覆盖云端）', value: 'local', cls: 'btn-ghost' }
    ]
  });
  return choice === 'local' ? 'local' : 'cloud';
}
async function bootCloud() {
  applyTheme();
  if (!cloudConfigured()) {
    renderAuthGate('config');
    return { ok: false };
  }
  const restored = await restoreCloudSession();
  if (!restored || !restored.session) {
    renderAuthGate(authState.recovery ? 'set-password' : 'login');
    return { ok: false };
  }
  cloudSession = restored.session;
  cloudUser = restored.session.user;
  activeUser = cloudUser;
  if (recoveryMode) {
    renderAuthGate('set-password');
    return { ok: false };
  }
  const uid = activeUser.id;
  const local = readLocalStore(uid);
  const meta = readMeta(uid);
  cloudLastSync = meta.lastSyncAt || 0;
  if (local) store = mergeStore(local);

  let row = null;
  let offline = false;
  try {
    row = await loadCloudState(uid);
  } catch (e) {
    offline = true;
    cloudLastError = e.message;
    if (!local) {
      renderAuthGate('offline', e.message);
      return { ok: false };
    }
  }

  if (offline) {
    store = mergeStore(local || store);
    cloudBooted = true;
    writeLocalStore(uid, store);
    setCloudStatus('offline', cloudLastError);
    return { ok: true, offline: true };
  }

  if (row) {
    const cloudData = row.data || {};
    if (meta.dirty && local) {
      const choice = await resolveConflict(row, local, meta);
      if (choice === 'cloud') {
        hydrateFromCloud(cloudData, local);
        writeMeta(uid, { dirty: false, cloudUpdatedAt: row.updated_at, lastSyncAt: Date.now() });
        cloudLastSync = Date.now();
      } else {
        store = mergeStore(local);
        writeMeta(uid, { dirty: true, cloudUpdatedAt: row.updated_at });
      }
    } else {
      hydrateFromCloud(cloudData, local);
      writeMeta(uid, { dirty: false, cloudUpdatedAt: row.updated_at, lastSyncAt: Date.now() });
      cloudLastSync = Date.now();
    }
  } else {
    let imported = false;
    if (!local) imported = await maybeImportLegacy(uid);
    if (!local && !imported) store = defaultStore();
    writeMeta(uid, { dirty: true, localUpdatedAt: Date.now() });
  }

  cloudBooted = true;
  writeLocalStore(uid, store);
  const m2 = readMeta(uid);
  if (!row || m2.dirty) {
    await syncNow({ force: true });
  } else {
    setCloudStatus('synced');
  }
  if (restored.offline) setCloudStatus('offline', '当前离线，使用本机缓存');
  return { ok: true };
}

function validEmail(email) {
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(email || '').trim());

async function doLogin() {
  if (authState.busy) return;
  const email = ($('#authEmail') && $('#authEmail').value || authState.email || '').trim().toLowerCase();
  const password = ($('#authPassword') && $('#authPassword').value || '');
  if (!email || !password) { authState.msg = '请填写邮箱和密码'; authState.msgType = 'error'; renderAuthGate(); return; }
  if (!validEmail(email)) { authState.msg = '邮箱格式不正确'; authState.msgType = 'error'; renderAuthGate(); return; }
  authState.email = email; authState.busy = true; authState.msg = ''; authState.msgType = '';
  renderAuthGate();
  try {
    await authSignIn(email, password);
    location.reload();
  } catch (e) {
    authState.busy = false;
    authState.msg = e.message || '登录失败';
    authState.msgType = 'error';
    renderAuthGate();
  }
}
async function doRegister() {
  if (authState.busy) return;
  const name = ($('#authName') && $('#authName').value || authState.name || '').trim();
  const email = ($('#authEmail') && $('#authEmail').value || authState.email || '').trim().toLowerCase();
  const p1 = ($('#authPassword') && $('#authPassword').value || '');
  const p2 = ($('#authPassword2') && $('#authPassword2').value || '');
  if (!email || !p1) { authState.msg = '请填写邮箱和密码'; authState.msgType = 'error'; renderAuthGate(); return; }
  if (!validEmail(email)) { authState.msg = '邮箱格式不正确'; authState.msgType = 'error'; renderAuthGate(); return; }
  if (p1.length < 6) { authState.msg = '密码至少 6 位'; authState.msgType = 'error'; renderAuthGate(); return; }
  if (p1 !== p2) { authState.msg = '两次输入的密码不一致'; authState.msgType = 'error'; renderAuthGate(); return; }
  authState.name = name; authState.email = email; authState.busy = true; authState.msg = ''; authState.msgType = '';
  renderAuthGate();
  try {
    const r = await authSignUp(name, email, p1);
    if (r.session) { location.reload(); return; }
    authState.busy = false;
    authState.view = 'login';
    authState.msg = '注册成功，请查收验证邮件；点击邮件中的链接后即可登录。';
    authState.msgType = 'ok';
    renderAuthGate();
  } catch (e) {
    authState.busy = false;
    authState.msg = e.message || '注册失败';
    authState.msgType = 'error';
    renderAuthGate();
  }
}
async function doReset() {
  if (authState.busy) return;
  const email = ($('#authEmail') && $('#authEmail').value || authState.email || '').trim().toLowerCase();
  if (!email) { authState.msg = '请填写邮箱'; authState.msgType = 'error'; renderAuthGate(); return; }
  if (!validEmail(email)) { authState.msg = '邮箱格式不正确'; authState.msgType = 'error'; renderAuthGate(); return; }
  authState.email = email; authState.busy = true; authState.msg = ''; renderAuthGate();
  try {
    await sendReset(email);
    authState.busy = false;
    authState.msg = '重置邮件已发送，请查收（包括垃圾邮件箱）。';
    authState.msgType = 'ok';
    renderAuthGate();
  } catch (e) {
    authState.busy = false;
    authState.msg = e.message || '发送失败';
    authState.msgType = 'error';
    renderAuthGate();
  }
}
async function doSetPassword() {
  if (authState.busy) return;
  const p1 = ($('#authPassword') && $('#authPassword').value || '');
  const p2 = ($('#authPassword2') && $('#authPassword2').value || '');
  if (p1.length < 6) { authState.msg = '密码至少 6 位'; authState.msgType = 'error'; renderAuthGate(); return; }
  if (p1 !== p2) { authState.msg = '两次输入的密码不一致'; authState.msgType = 'error'; renderAuthGate(); return; }
  authState.busy = true; renderAuthGate();
  try {
    await updatePassword(p1);
    authState.busy = false;
    authState.recovery = false;
    recoveryMode = false;
    toast('密码已更新', 'ok');
    location.reload();
  } catch (e) {
    authState.busy = false;
    authState.msg = e.message || '设置失败';
    authState.msgType = 'error';
    renderAuthGate();
  }
}
async function doSaveConfig() {
  const url = ($('#authConfigUrl') && $('#authConfigUrl').value || authState.configUrl || '').trim();
  const key = ($('#authConfigKey') && $('#authConfigKey').value || authState.configKey || '').trim();
  if (!/^https?:\/\//.test(url)) { authState.msg = 'Supabase URL 需以 https:// 开头'; authState.msgType = 'error'; renderAuthGate(); return; }
  if (key.length < 8) { authState.msg = '请填写有效的 anon key'; authState.msgType = 'error'; renderAuthGate(); return; }
  authState.configUrl = url; authState.configKey = key;
  saveCloudConfig(url, key);
  location.reload();
}

/* ============================================================
