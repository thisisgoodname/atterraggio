明确说明和明确列明"],"a":"BD","e":"选BD。说明义务主体包括保险人和保险代理人，履行方式有明确说明和明确列明。A错，说明义务不限于订约时；C错，说明义务的重心是免责条款而非保险费率。"},{"id":475,"ch":3,"kp":"2.2 最大诚信原则的内容","t":"m","q":"下列关于最大诚信原则告知义务说法正确的是（    ）。","o":["投保方的告知义务应该包括如实告知、及时通知等","告知义务的履行主体往往是投保人而不包括被保险人。","有重复保险的投保人应将重复保险的有关情况通知各保险人","我国关于告知的保险立法采用的是无限告知形式"],"a":"AC","e":"选AC。投保方告知义务包括如实告知和及时通知，重复保险须通知各保险人。B错，被保险人也负告知与通知义务；D错，我国采询问告知即有限告知。"},{"id":476,"ch":3,"kp":"2.2 最大诚信原则的内容","t":"m","q":"下列关于最大诚信原则中保证义务说法正确的是（    ）。","o":["保证义务的履行主体是投保人或被保险人","保证的形式分为确认保证和承诺保证","海上保险合同的确认保证中包括不改变航道的保证","在保险合同中，某人承诺今后不再吸烟属于承诺保证"],"a":"AD","e":"选AD。保证义务主体是投保人或被保险人，承诺今后不再吸烟属承诺保证。B错，保证按形式分明示保证与默示保证；C错，不改变航道属默示保证。"},{"id":477,"ch":3,"kp":"2.2 最大诚信原则的内容","t":"m","q":"下列关于弃权与禁止反言说法正确的是（    ）。","o":["弃权与禁止反言是最大诚信原则中的一条","弃权通常是指保险人放弃合同解除权与抗辩权","无论保险人还是投保人，如果放弃他在合同中的某种权利，将来均不得重新主张","保险合同规定的合同解除权，自保险人知道有解除事由之日起，超过90日不行使而消灭"],"a":"ABC","e":"选ABC。弃权与禁止反言是最大诚信原则的内容，通常指保险人放弃解除权与抗辩权，任何一方放弃权利后不得重新主张。D错，法定期限为30日而非90日。"},{"id":478,"ch":3,"kp":"2.2 最大诚信原则的内容","t":"j","q":"说明义务的履行主体应当包括保险人与被保险人。","o":[],"a":"F","e":"错误。说明义务的履行主体是保险人，实践中还包括保险代理人，被保险人不是说明义务主体，题干扩大了主体范围。"},{"id":479,"ch":3,"kp":"2.2 最大诚信原则的内容","t":"j","q":"对保险合同中免除保险人责任的条款，保险人在订立合同时应当在投保单、保险单或者其他保险凭证上作出足以引起投保人注意的提示，并对该条款的内容以书面或者口头形式向投保人作出明确列明。","o":[],"a":"F","e":"错误。对免责条款，保险人除作出足以引起投保人注意的提示外，还须以书面或口头形式向投保人作出明确说明，而不是明确列明。"},{"id":480,"ch":3,"kp":"2.2 最大诚信原则的内容","t":"j","q":"如实告知义务为投保人订立合同时保险人必须履行的基本义务。","o":[],"a":"F","e":"错误。如实告知义务是投保人订立合同时必须履行的基本义务，保险人承担的是说明义务，题干把义务主体写反了，保险人不属于如实告知义务人。"},{"id":481,"ch":3,"kp":"2.2 最大诚信原则的内容","t":"j","q":"货物运输保险合同中，保险标的转让的，被保险人或者受让人应当及时通知保险人。","o":[],"a":"F","e":"错误。货物运输保险合同和另有约定的合同，保险标的转让无需通知保险人，合同效力不受影响，题干要求通知与法律规定不符。"},{"id":482,"ch":3,"kp":"2.2 最大诚信原则的内容","t":"j","q":"海上保险合同的默示保证一般有三项：船舶的适航、适货保证，不改变航道的保证，航行合法的保证。","o":[],"a":"T","e":"正确。海上保险合同的默示保证一般包括船舶适航适货保证、不改变航道保证和航行合法保证三项，这三项依法律或航海惯例当然适用，无须在合同中载明。"},{"id":483,"ch":3,"kp":"2.2 最大诚信原则的内容","t":"j","q":"保证义务的履行主体是保险人以及保险代理人。","o":[],"a":"F","e":"错误。保证义务的履行主体是投保人或被保险人，而不是保险人及保险代理人；保险人及其代理人属于说明义务的主体，题干把两类义务的主体混淆了。"},{"id":484,"ch":3,"kp":"2.2 最大诚信原则的内容","t":"j","q":"投保人有违背按期缴纳保险费或其他约定义务的时候，保险人原本应解除合同。但是，如果保险人已知此种情形却仍收取投保人补缴的保险费时，视为保险人对本应享有的合同解除权等均弃权。","o":[],"a":"T","e":"正确。保险人已知投保人欠缴保费或违反其他义务，仍收取其补缴的保险费，视为放弃本应享有的合同解除权等权利，日后不得再主张。"},{"id":485,"ch":3,"kp":"2.3 违反最大诚信原则的法律后果","t":"s","q":"如果保险人在订立合同时未履行责任免除条款的提示或明确说明义务，则（    ）。","o":["保险合同无效","保险人承担额外赔偿或给付保险金责任","免责条款无效","保险人退还部分保费"],"a":"C","e":"选C。保险人未对免责条款作出提示或明确说明的，该免责条款不产生效力，即免责条款无效，但合同其他部分仍然有效。A、B、D均不符合法律规定。"},{"id":486,"ch":3,"kp":"2.3 违反最大诚信原则的法律后果","t":"s","q":"由于投保人过失违反告知义务，但过失未告知的事项对保险事故的发生没有影响或者有影响但不严重，保险人可以解除保险合同，保险人对合同解除前发生的保险事故（    ）。","o":["承担赔偿或给付责任","不承担赔偿或给付责任，但须退还保险费","不承担赔偿或给付责任，并不退换保险费","按比例承担部分赔偿或给付责任"],"a":"A","e":"选A。投保人因过失未告知，且未告知事项对事故发生无影响或影响不严重，保险人虽可解除合同，但对解除前发生的保险事故仍应承担赔偿或给付责任。"},{"id":487,"ch":3,"kp":"2.3 违反最大诚信原则的法律后果","t":"s","q":"在财产保险中，被保险人、受让人未履行保险标的转让的通知义务，因转让导致保险标的危险程度显著增加而发生保险事故的，保险人（    ）。","o":["承担赔偿或给付责任","要求被保险人补缴保险费后承担赔偿或给付责任","不承担赔偿或给付责任务","按危险增加的比例承担部分赔偿或给付责任"],"a":"C","e":"选C。被保险人、受让人未履行转让通知义务，因转让致危险程度显著增加而发生事故的，保险人不承担赔偿或给付责任。A、B、D均无法律依据。"},{"id":488,"ch":3,"kp":"2.3 违反最大诚信原则的法律后果","t":"s","q":"在未发生保险事故的情况下，被保险人或者受益人谎称发生了保险事故，向保险人提出赔偿或者给付保险金的请求的，保险人（    ）。","o":["有权退还保险费并解除保险合同","有权解除保险合同并不退还保险费","有权要求投保人提高保险费缴纳额度并维持保险合同","承担赔偿或给付责任"],"a":"B","e":"选B。未发生保险事故而谎称发生并索赔的，保险人有权解除合同，并不退还保险费。A、C、D与法律规定的后果不符。"},{"id":489,"ch":3,"kp":"2.3 违反最大诚信原则的法律后果","t":"s","q":"保险合同中订有要求被保险人外出时必须将门窗关闭和锁闭的保证条款，某被保险人违反了该保证致使发生保险事故，保险人（    ）。","o":["应解除保险合同，并不退还保费","应解除保险合同，并退还保险费","就此次违反保证拒绝赔偿，并不解除保险合同","要求被保险人补缴额外保费并承担赔偿或给付责任"],"a":"C","e":"选C。被保险人违反门窗关闭锁闭的保证，保险人可就与该保证相关的此次事故拒绝赔偿，但不因此解除整个保险合同。A、B、D的处理方式均不当。"},{"id":490,"ch":3,"kp":"2.3 违反最大诚信原则的法律后果","t":"s","q":"根据我国《保险法》的规定 , 投保人因过失未履行告知义务 , 对保险事故的发生有严重影响的 , 保险人对于保险合同解除前发生的保险事故 , 正确的处理方式是（ ）。","o":["全部承担赔偿或给付保险金责任","部分承担赔偿或给付保险金责任","不承担赔偿或给付保险金责任 , 并不退还保险费","不承担赔偿或给付保险金责任 , 但可退还保险费"],"a":"D","e":"D正确。投保人因过失未如实告知且对保险事故发生有严重影响的，保险人不承担赔偿责任，但应退还保险费。C项是故意不告知的后果，A、B项与“过失且有严重影响”的法律后果不符。"},{"id":491,"ch":3,"kp":"2.3 违反最大诚信原则的法律后果","t":"m","q":"违反最大诚信原则的法律后果包括（    ）","o":["保险人违反说明义务的法律后果","投保方违反告知义务的法律后果","投保方违反保证义务的法律后果","保险人违反保证义务的法律后果"],"a":"ABC","e":"A、B、C正确。最大诚信原则要求保险人履行说明义务，投保方履行告知与保证义务，违反者分别产生相应法律后果。D项错误，保证义务是投保方的义务，保险人不存在违反保证义务的问题。"},{"id":492,"ch":3,"kp":"2.3 违反最大诚信原则的法律后果","t":"j","q":"如果保险人在订立合同时未履行责任免除条款的提示或明确说明义务，则该保险合同无效。","o":[],"a":"F","e":"错误。保险人未对责任免除条款作出提示或明确说明的，该免责条款不产生效力，而不是整个保险合同无效；合同其余条款仍可有效，题干把“条款不生效”错说成“合同无效”。"},{"id":493,"ch":3,"kp":"2.3 违反最大诚信原则的法律后果","t":"j","q":"保险事故发生后，投保人以伪造的有关证明，扩大损失程度的，保险人不承担赔偿保险金责任并退还保险费。","o":[],"a":"F","e":"错误。投保人、被保险人伪造证明、夸大损失程度的，保险人对虚报扩大的部分不承担赔偿责任，并非全部不赔并退还保费；题干把“虚报部分不赔”扩大为“全部不承担”。"},{"id":494,"ch":3,"kp":"2.3 违反最大诚信原则的法律后果","t":"j","q":"在财产保险中，被保险人未按保险合同约定，将财产保险的保险标的危险增加的情况及时通知保险人，对因保险标的危险程度显著增加而发生的保险事故，保险人应要求投保人缴纳额外保费后承担赔偿责任。","o":[],"a":"F","e":"错误。保险标的危险程度显著增加，被保险人未及时通知的，因该危险增加而发生的保险事故，保险人不承担赔偿责任，而不是要求补缴保费后照常赔付。"},{"id":495,"ch":3,"kp":"2.3 违反最大诚信原则的法律后果","t":"j","q":"违反保证条件只部分地损害了保险人的利益，保险人只应就违反部分拒绝履行赔偿义务。","o":[],"a":"T","e":"正确。违反保证的法律后果应与其损害程度相适应：只部分损害保险人利益的，保险人仅就违反部分拒绝赔偿；只有全部损害时，才可解除合同或全部免责。"},{"id":496,"ch":3,"kp":"3.1近因的含义","t":"s","q":"保险基本原则的近因原则中，近因是指（ ）","o":["造成损失起主导性作用的原因","时间上最接近的原因","空间上最接近的原因","时间、空间上均最接近的原因"],"a":"A","e":"A正确。近因是造成损失的最直接、最有效、起主导和决定作用的原因，而不是时间或空间上最接近损失的原因；B、C、D混淆了近因与“最近”，是常见干扰项。"},{"id":497,"ch":3,"kp":"3.1近因的含义","t":"j","q":"船舶因遭受鱼雷袭击而进水，使船舶沉没，海水的进入此次事故的近因。","o":[],"a":"F","e":"错误。鱼雷袭击使船舶进水沉没，鱼雷袭击是起决定作用的原因，属战争或敌对行为风险；海水进入只是袭击造成的中间环节，不是近因。"},{"id":498,"ch":3,"kp":"3.2 近因原则的含义","t":"s","q":"在保险中，（    ）是判明并确定保险责任的一项基本原则。","o":["保险利益原则","最大诚信原则","近因原则","损失补偿原则"],"a":"C","e":"C正确。近因原则用于判明损失原因与保险责任之间的因果关系，是确定是否属于保险责任的基本原则；保险利益、最大诚信、损失补偿原则各自解决另外的问题。"},{"id":499,"ch":3,"kp":"3.3 近因原则的应用","t":"s","q":"暴风吹倒了一紧靠仓库的电线杆，使得电线短路引起火花，火花引燃房屋，导致库存财产的损失，此次财产损失的近因是（    ）。","o":["暴风","电线杆倒塌","电线短路","火花"],"a":"A","e":"A正确。暴风、电线杆倒塌、短路、火花、火灾构成连续因果链，暴风是最初的、起主导决定作用的原因，是近因；火灾只是链条末端的直接现象，属近因的后果。"},{"id":500,"ch":3,"kp":"3.3 近因原则的应用","t":"s","q":"近因原则中，多种原因连续发生导致的损失，如果这些原因中既有保险风险，也有除外风险，损失的前因是保险风险，后因是除外风险，则保险人（    ）。","o":["承担赔偿责任","不承担赔偿责任","承担部分赔偿责任","保险人与被保险人协商赔付"],"a":"A","e":"A正确。多种原因连续发生，前因是保险风险、后因是除外风险时，近因仍为前因保险风险，保险人应承担赔偿责任；后因只是前因的必然结果，不切断因果链。"},{"id":501,"ch":3,"kp":"3.3 近因原则的应用","t":"s","q":"近因原则中，多种原因连续发生导致的损失，如果这些原因中既有保险风险，也有除外风险，损失的前因是除外风险，后因是保险风险，则保险人（    ）。","o":["承担赔偿责任","不承担赔偿责任","承担部分赔偿责任","保险人与被保险人协商赔付"],"a":"B","e":"B正确。连续发生的多因中，前因为除外风险，后因虽属保险风险，近因仍为前因，保险人不承担赔偿责任；后因是前因引起的必然结果，不能颠倒因果顺序。"},{"id":502,"ch":3,"kp":"3.3 近因原则的应用","t":"s","q":"一艘装有皮革和烟草的船舶遭遇海难，大量的海水侵入使皮革腐烂，海水虽未直接浸泡烟草的捆包，但由于腐烂皮革的恶臭气味，致使烟草变质而被保险人受损，那么保险人对烟草的损失赔偿责任为（    ）。","o":["承担赔偿责任","不承担赔偿责任","承担部分赔偿责任","保险人与被保险人协商赔付"],"a":"A","e":"A正确。海水侵入使皮革腐烂、恶臭致烟草变质，海水侵入（海难）是起决定作用的近因，属海上保险的承保风险，保险人应承担赔偿责任；恶臭只是中间环节。"},{"id":503,"ch":3,"kp":"3.3 近因原则的应用","t":"s","q":"有一艘装满烟叶和皮革的船货，在航行中遭遇海难，大量海水涌入船舱，皮革腐烂，但海水没有直接接触到包装烟叶的捆包，然而由于皮革的腐烂发出恶臭使烟叶受损，近因是（   ）。","o":["皮革腐烂","海水涌入船舱","恶臭","海难"],"a":"D","e":"D正确。海水涌入、皮革腐烂、恶臭、烟叶受损构成连续因果链，海难是最初的、起主导决定作用的原因，故近因为海难；海水涌入、恶臭只是链条中的中间环节。"},{"id":504,"ch":3,"kp":"3.3 近因原则的应用","t":"s","q":"投保了人身意外伤害保险（疾病是除外风险）的被保险人因打猎时不慎摔成重伤，且因重伤无法行走，只能倒卧在湿地上等待救护，结果由于着凉而感冒高烧，后又并发肺炎，最重因肺炎致死。那么，保险人的赔偿责任为（    ）。","o":["承担赔偿责任","不承担赔偿责任","承担部分赔偿责任","保险人与被保险人协商赔付"],"a":"A","e":"A正确。摔伤、着凉、感冒、肺炎、死亡构成连续因果链，摔伤是意外事故且为最初的决定性原因，属意外伤害保险责任，保险人应承担赔偿责任；肺炎是摔伤的结果。"},{"id":505,"ch":3,"kp":"3.3 近因原则的应用","t":"s","q":"投保了人身意外伤害保险（疾病是除外风险）的被保险人因打猎时不慎摔成重伤，且因重伤无法行走，只能倒卧在湿地上等待救护，结果由于着凉而感冒高烧，后又并发肺炎，最重因肺炎致死，近因为（    ）。","o":["摔伤","着凉","感冒","肺炎"],"a":"A","e":"A正确。被保险人死亡由摔伤引起，摔伤既是意外伤害保险承保的意外事故，也是因果链中起决定作用的最初原因；着凉、感冒、肺炎都是摔伤导致的中间环节。"},{"id":506,"ch":3,"kp":"3.3 近因原则的应用","t":"s","q":"在人身意外伤害保险中，被保险人在交通事故中因严重的脑震荡而致癫狂与抑郁交替症，在治疗过程中，医生叮嘱服用药物巴斯德林时切忌进食干酪，因二者之间相忌。但是，被保险人却未遵医嘱，服药时又近视了干酪，终因中风死亡，据查中风确系巴斯德林与干酪所致。保险人的赔偿责任为（    ）。","o":["承担赔偿责任","不承担赔偿责任","承担部分赔偿责任","保险人与被保险人协商赔付"],"a":"B","e":"B正确。被保险人未遵医嘱，服药时进食干酪，这一新的独立介入原因是导致中风死亡的决定性原因，意外伤害与死亡之间的因果链被切断，故保险人不承担赔偿责任。"},{"id":507,"ch":3,"kp":"3.3 近因原则的应用","t":"s","q":"李某在雪天过马路时，不幸遭遇两车相撞身亡。后经交通警察对肇事车辆A、B进行查实，发现事故的起因是A车驾驶员酒后驾车，李某死亡的近因是（    ）。","o":["大雪天气","A车驾驶员酒后驾车","A车撞击","李某过马路不守规则"],"a":"B","e":"B正确。大雪天气、两车相撞、死亡构成因果链，A车驾驶员酒后驾车是最初的、起主导和决定作用的原因，是李某死亡的近因；大雪只是条件，撞击是中间环节。"},{"id":508,"ch":3,"kp":"3.3 近因原则的应用","t":"s","q":"李某投保了意外伤害保险，某日出行被车撞倒，造成伤残，在其住院治疗过程中因伤口感染而死亡。保险人认为对李某死亡不负保险责任，只对意外伤害伤残支付了保险金，原因是意外伤害与感染没有内在联系，死亡并非意外伤害的结果，而是感染的结果。请问保险人对李某死亡不承担保险责任的依据是（ 　）。","o":["最大诚信原则","自愿原则","近因原则","等价有偿原则"],"a":"C","e":"C正确。保险人只赔意外伤残、不赔死亡，依据近因原则：死亡的近因是伤口感染即疾病，并非意外伤害，疾病属意外伤害保险的除外风险，故死亡不属保险责任。"},{"id":509,"ch":3,"kp":"3.3 近因原则的应用","t":"j","q":"某日天降大雨并伴有炸雷，炸雷击断某住户房屋后面的一颗大树，大树压塌房屋，房屋倒塌，导致该住户电视机损坏，则电视机损坏的近因为房屋倒塌。","o":[],"a":"F","e":"错误。炸雷击断大树、大树压塌房屋、房屋倒塌砸坏电视机，构成连续因果链，炸雷是最初起决定作用的原因，近因应为雷击，而不是房屋倒塌。"},{"id":510,"ch":3,"kp":"3.3 近因原则的应用","t":"j","q":"暴风吹倒了电线杆，电线短路引起火花，火花引燃房屋，导致财产损失，则财产损失的近因为火灾。","o":[],"a":"F","e":"错误。暴风、电线杆倒塌、电线短路、火花、火灾依次发生，暴风是最初的、起主导决定作用的原因，近因应为暴风，火灾只是链条末端的现象。"},{"id":511,"ch":3,"kp":"3.3 近因原则的应用","t":"j","q":"某人投保了人身意外伤害保险，在回家的路上被汽车撞伤送往医院，在其住院治疗期间因心肌梗塞而死亡，那么这一死亡事故的近因为心机梗塞。","o":[],"a":"T","e":"正确。被保险人虽因车祸受伤，但死亡发生在住院治疗期间，直接原因是心肌梗塞，疾病是起决定作用的近因，属意外伤害保险的除外责任，保险人不负死亡责任。"},{"id":512,"ch":3,"kp":"4.1 损失补偿原则的含义及意义","t":"s","q":"下列选项中，不适用损失补偿原则的保险是（    ）。","o":["医疗费用保险","责任保险","人寿保险","信用保险"],"a":"C","e":"C正确。人寿保险是定额给付保险，人的生命难以用金钱衡量，不适用损失补偿原则；医疗费用保险属补偿性人身保险，责任保险、信用保险均属财产性保险，适用补偿原则。"},{"id":513,"ch":3,"kp":"4.1 损失补偿原则的含义及意义","t":"m","q":"下列选项中使用损失补偿原则的是（    ）。","o":["医疗费用保险","信用保险","定值保险","人寿保险"],"a":"AB","e":"A、B正确。医疗费用保险是补偿性人身保险，信用保险是财产性保险，赔付均以实际损失为限，适用损失补偿原则。C定值保险是补偿原则的例外，D人寿保险实行定额给付。"},{"id":514,"ch":3,"kp":"4.1 损失补偿原则的含义及意义","t":"j","q":"损失补偿原则适用于财产保险合同，不适用于人身保险合同。","o":[],"a":"F","e":"错误。损失补偿原则主要适用于财产保险，但也适用于医疗费用保险等补偿性人身保险；只有定额给付的人寿保险、意外伤害保险等不适用，题干说得过于绝对。"},{"id":515,"ch":3,"kp":"4.1 损失补偿原则的含义及意义","t":"j","q":"损失补偿原则的基本含义包括被保险人可获得的补偿量，仅以其保险标的遭受损失的实际损失为限。","o":[],"a":"T","e":"正确。损失补偿原则的核心含义是：补偿以保险标的遭受的实际损失为限，赔偿金额不超过保险价值，使被保险人恢复受损前的经济状态而不额外获利。"},{"id":516,"ch":3,"kp":"4.2损失补偿原则实施的限制","t":"s","q":"某企业投保财产综合险，确定某类固定资产保险金额30万元，一起重大火灾事故发生使其全部毁损，损失时该类固定资产的市价为25万元，则保险人赔偿被保险人（    ）。","o":["25万元","27.5万元","30万元","保险人与被保险人协商赔偿"],"a":"A","e":"A正确。全部毁损时赔偿以实际损失和保险价值为限，保额30万元高于损失时市价25万元，只能按25万元赔偿；B的27.5万元与C的30万元都会使补偿超过实际损失。"},{"id":517,"ch":3,"kp":"4.2损失补偿原则实施的限制","t":"s","q":"一栋新房屋刚投保不久便全部焚毁，其保险金额为50万元，而房屋遭毁时的市价为60万元。保险人应赔偿被保险人（    ）。","o":["60万元","55万元","50万元","保险人与被保险人协商赔付"],"a":"C","e":"C正确。房屋全部焚毁，市价60万元高于保额50万元，保险人以保险金额为限赔偿50万元；A的60万元、B的55万元均突破保险金额，不符合以保额为限的要求。"},{"id":518,"ch":3,"kp":"4.2损失补偿原则实施的限制","t":"s","q":"某银行开展住房抵押贷款，向某贷款人贷出款额30万元，同时，将抵押的房屋投保了30万元的一年期房屋火灾保险。按照约定，贷款人半年后偿还了一半贷款，不幸的是不久该保险房屋发生火灾而全部焚毁，贷款人也无力偿还剩余款额，此时房屋市场价值为40万元。保险人应向银行赔偿（    ）。","o":["40万元","30万元","20万元","15万元"],"a":"D","e":"D正确。银行作为抵押权人，其保险利益以未偿还的贷款余额为限，贷款已还一半，剩余15万元，故只能获赔15万元；房屋市价40万元不影响以保险利益为限的补偿。"},{"id":519,"ch":3,"kp":"4.2损失补偿原则实施的限制","t":"s","q":"（    ）是指保险人只承担事先约定的损失额以内的赔偿，而对超过损失限额部分，保险人不负赔偿责任。","o":["绝对责任赔偿方法","比例责任赔偿方法","限额责任赔偿方法","顺序责任赔偿方法"],"a":"C","e":"C正确。限额责任赔偿方法指保险人只承担事先约定的限额以内的损失赔偿，对超过限额部分不负责任；它不同于比例责任赔偿方法和免赔额的约定。"},{"id":520,"ch":3,"kp":"4.2损失补偿原则实施的限制","t":"s","q":"在农作物收获保险中。保险人与投保人事先按照正常年景的平均收获量约定保险人保证的限额，当实际收获量低于保险产量时，保险人赔偿其差额；当实际产量已达到保险产量时，即使发生保险责任事故，保险人也不负赔偿责任。这属于（    ）。","o":["差额责任赔偿方法","限额责任赔偿方法","比例责任赔偿方法","相对责任赔偿方法"],"a":"B","e":"B正确。约定保证限额即保险产量，实际收获量低于限额时赔付差额，达到限额即不赔，正是限额责任赔偿方法的典型运用；比例责任按保额与保险价值的比例赔付，与本题不符。"},{"id":521,"ch":3,"kp":"4.2损失补偿原则实施的限制","t":"s","q":"下列保险合同规定相对免赔额1000元。某次保险事故损失1400元，则保险公司应赔付（    ）。","o":["1000元","1400元","400元","0元"],"a":"B","e":"B正确。相对免赔额下，损失超过免赔额时保险人不作扣减、按实际损失全额赔付，1400元已超过1000元，故赔1400元；C的400元是绝对免赔额的算法，A把免赔额当成赔款。"},{"id":522,"ch":3,"kp":"4.2损失补偿原则实施的限制","t":"s","q":"下列保险合同规定绝对免赔额1000元。某次保险事故损失1400元，则保险公司应赔付（    ）。","o":["1000元","1400元","400元","0元"],"a":"C","e":"C正确。绝对免赔额下，损失超过免赔额时保险人只赔超过部分，用1400元减1000元得400元；B的1400元是相对免赔额的算法，A混淆了免赔额与赔偿额。"},{"id":523,"ch":3,"kp":"4.2损失补偿原则实施的限制","t":"m","q":"损失补偿原则实施的要点是（     ）均不得超过保险价值。","o":["保险金额","损失金额","实际价值","赔偿金额"],"a":"ABCD","e":"A、B、C、D正确。损失补偿原则的实施要点是保险金额、损失金额、实际价值和赔偿金额均以保险价值为最高限，从而防止被保险人获得超过实际损失的额外利益。"},{"id":524,"ch":3,"kp":"4.2损失补偿原则实施的限制","t":"j","q":"相对免赔额1200元，保险事故造成保险损失1200元，保险人应赔偿200元。","o":[],"a":"F","e":"错误。相对免赔额1200元，损失1200元并未超过免赔额，保险人不予赔偿；只有损失超过免赔额时才全额赔付且不扣减，题干把两种免赔额的算法混为一谈。"},{"id":525,"ch":3,"kp":"4.2损失补偿原则实施的限制","t":"j","q":"绝对免赔额是指保险人规定一个免赔额，当保险财产受损程度超过免赔额度时，保险人扣除免赔额后，只对超过部分负赔偿责任。","o":[],"a":"T","e":"正确。绝对免赔额是保险人事先规定的固定免赔额度，损失超过该额度时，保险人扣除免赔额后只对超过部分负赔偿责任，题干的表述与定义一致。"},{"id":526,"ch":3,"kp":"4.2损失补偿原则实施的限制","t":"j","q":"相对免赔额是指保险人规定一个免赔额，当保险财产受损程度超过免赔额时，保险人扣除免赔额之后作出赔付。","o":[],"a":"F","e":"错误。相对免赔额下，损失超过免赔额时保险人不作扣减、按实际损失全额赔付，损失未超过免赔额才不赔；题干把绝对免赔额“扣除后赔付”的规则安到了相对免赔额上。"},{"id":527,"ch":3,"kp":"4.3 损失补偿原则的派生原则","t":"s","q":"在保险实务中，（    ）是指保险人依照法律或保险合同约定，对被保险人因保险事故发生所遭受的损失进行赔偿后，依法取得向对此损失负有责任的第三者进行求偿的权利或取得被保险人对受损的保险标的的所有权。","o":["损失补偿原则","分摊原则","代位原则","近因原则"],"a":"C","e":"C正确。代位原则指保险人赔偿后依法取得向责任第三者求偿的权利，或取得受损保险标的的所有权，包括代位求偿权（权利代位）和物上代位权两项内容。"},{"id":528,"ch":3,"kp":"4.3 损失补偿原则的派生原则","t":"s","q":"代位原则属于（    ）的派生原则。","o":["保险利益原则","最大诚信原则","近因原则","损失补偿原则"],"a":"D","e":"D正确。代位原则与分摊原则都是损失补偿原则的派生原则，目的是防止被保险人重复获赔、额外获利；保险利益、最大诚信、近因均为独立的基本原则。"},{"id":529,"ch":3,"kp":"4.3 损失补偿原则的派生原则","t":"s","q":"（    ）是指当保险标的因遭受保险责任事故而造成损失，依法应当由第三者承担赔偿责任时，保险人自支付保险赔偿金之日起，在赔偿金额的限度内，相应取得向对此损失负有责任的第三者请求赔偿的权利。","o":["物上代位权","代位求偿权","损失追偿权","责任代位权"],"a":"B","e":"B正确。保险人自支付赔款之日起，在赔偿金额限度内取得向对此损失负有责任的第三者请求赔偿的权利，即代位求偿权；物上代位权取得的是标的物所有权。"},{"id":530,"ch":3,"kp":"4.3 损失补偿原则的派生原则","t":"s","q":"保险人行使代位求偿权的金额只能限制在（    ）范围以内。","o":["赔偿金额","实际损失","保险金额","保险利益"],"a":"A","e":"A正确。代位求偿权是赔偿请求权的转移，其行使金额以保险人实际支付的赔偿金额为限，既不能超出赔偿金额，也不能超出被保险人对第三者原有的请求权。"},{"id":531,"ch":3,"kp":"4.3 损失补偿原则的派生原则","t":"s","q":"在代位追偿中，如果保险人向第三者追偿所得款额大于赔付给被保险人的款额，那么其超过部分的所有权归（    ）所有。","o":["保险人","被保险人","保险人与被保险人共同","社会保险基金"],"a":"B","e":"B正确。保险人代位求偿以赔偿金额为限，追偿所得超过赔付额的部分属于被保险人尚未获得补偿的损失，应归还被保险人，保险人不得因此额外获利。"},{"id":532,"ch":3,"kp":"4.3 损失补偿原则的派生原则","t":"s","q":"关于代位求偿权对保险人的要求中，下列说法错误的是（    ）。","o":["保险人行使代位求偿权的金额只能限制在保险利益范围以内","如果追偿所得款额大于赔付给被保险人的款额，其超过部分应归还给被保险人","保险人不得干预被保险人就未取得保险赔偿的部分向第三者请求赔偿","保险人为满足被保险人的特殊需要，有时会放弃代位求偿权"],"a":"A","e":"A错误，符合题意。代位求偿权的行使限额是赔偿金额而非保险利益范围；B、C、D均符合对保险人的要求，超额追偿款归被保险人、不得干预未获赔部分的索赔。"},{"id":533,"ch":3,"kp":"4.3 损失补偿原则的派生原则","t":"s","q":"关于代位求偿权对投保方的要求中，下列说法错误的是（    ）。","o":["如果被保险人在获得保险人赔偿之前放弃了向第三者请求赔偿的权利，就意味着他放弃了向保险人索赔的权利","如果被保险人在获得保险人赔偿之后未经保险人同意而放弃了对第三者请求赔偿的权利，保险人不得行使代位求偿权","如果发生事故后，保险人已经从第三者那里取得赔偿或者由于其过错致使保险人不能行使代位求偿权，保险人可以相应扣减保险赔偿金","在保险人向第三者行使代位求偿权时，被保险人应当向保险人提供必要的文件和其所知道的有关情况"],"a":"B","e":"B错误，符合题意。获赔后未经保险人同意放弃对第三者的请求权，该放弃行为无效，保险人仍可行使代位求偿权；A、C、D的表述均符合法律对投保方的要求。"},{"id":534,"ch":3,"kp":"4.3 损失补偿原则的派生原则","t":"s","q":"代位求偿权的行使范围一般不适用于（    ）。","o":["医疗费用保险","企业财产保险","人寿保险","责任保险"],"a":"C","e":"C正确。人寿保险是定额给付保险，生命无价，不存在损失补偿和代位求偿问题；企业财产保险、责任保险以及医疗费用保险等补偿性保险才适用代位求偿。"},{"id":535,"ch":3,"kp":"4.3 损失补偿原则的派生原则","t":"s","q":"人身保险的被保险人因第三者的行为而发生死亡、伤残或者疾病等保险事故的，下列关于保险金给付责任说法正确的是（    ）。","o":["被保险人向保险人索赔后，保险人行使代位求偿权向第三者要求赔偿","被保险人向第三者请求赔偿后，不得向保险人申请赔偿，否则实际赔偿将超过实际损失","被保险人向第三者请求赔偿后，仍可向保险人请求赔偿","被保险人向第三者以及保险人请求的保险金赔偿总和不得超过保险金额"],"a":"C","e":"C正确。人身保险不适用代位求偿，被保险人从第三者取得赔偿后仍可向保险人请求给付保险金，两者可以并存；A错在保险人无代位权，B、D不当限制了人身保险给付。"},{"id":536,"ch":3,"kp":"4.3 损失补偿原则的派生原则","t":"s","q":"物上代位权取得的是对受损标的物的（    ）。","o":["控制权","债权","占有权","所有权"],"a":"D","e":"D正确。物上代位权是指保险人赔付全部损失后，取得对受损保险标的的所有权及其残值，其性质是所有权的代位，而不是控制权、占有权或债权。"},{"id":537,"ch":3,"kp":"4.3 损失补偿原则的派生原则","t":"s","q":"船舶失踪被推定全损，被保险人请求委付，同时要求日后船舶被寻回时返还，保险人不接受委付最可能的原因是（    ）。","o":["委付必须由保险人向被保险人提出","委付必须就保险标的的全部提出","委付不得有附加条件","委付必须以保险标的推定全损为条件"],"a":"C","e":"C正确。委付不得附带任何条件，被保险人要求船舶日后被寻回时返还，属于附加条件，保险人有权拒绝接受；委付还须以推定全损为条件并就全部标的提出。"},{"id":538,"ch":3,"kp":"4.3 损失补偿原则的派生原则","t":"s","q":"委付是保险人放弃物权的法律行为，是经常用于（  ）的一种赔偿制度。","o":["财产损失保险","责任保险","信用保险","海上保险"],"a":"D","e":"D正确。委付是被保险人将保险标的的一切权利转移给保险人以请求全额赔偿的制度，主要用于海上保险中船舶、货物的推定全损处理，其他险种较少运用。"},{"id":539,"ch":3,"kp":"4.3 损失补偿原则的派生原则","t":"s","q":"在（    ）的情况下，保险事故发生时，被保险人所能得到的赔偿金由各保险人采用适当的方法进行分摊，从而使其所得到的总赔偿金额不超过实际损失额。","o":["共同保险","相互保险","重复保险","定值保险"],"a":"C","e":"C正确。重复保险中各保险人对同一损失均负赔偿责任，须按比例责任、限额责任或顺序责任等方法分摊赔款，使被保险人所得总赔偿不超过实际损失。"},{"id":540,"ch":3,"kp":"4.3 损失补偿原则的派生原则","t":"s","q":"重复保险的构成要件应当同时具备“四同一”，下列不属于重复保险构成要件的是（    ）。","o":["同一保险金额","同一保险标的","同一保险利益","同一保险期间"],"a":"A","e":"A正确。重复保险须同时具备同一保险标的、同一保险利益、同一保险事故、同一保险期间这“四同一”；保险金额并不要求相同，保额总和超过保险价值才是重复保险。"},{"id":541,"ch":3,"kp":"4.3 损失补偿原则的派生原则","t":"s","q":"根据《保险法》规定，“保险金额不得超过保险价值；超过保险价值的，（    ）。”","o":["保险合同无效","投保人需补缴额外保费","超过的部分无效，并不退还保费","超过的部分无效，保险人应当退还相应的保险费"],"a":"D","e":"D正确。保险金额超过保险价值的，超过部分无效，保险人应当退还相应的保险费；合同并不因此全部无效，也不是要求投保人补缴保费，A、B、C均与法律规定不符。"},{"id":542,"ch":3,"kp":"4.3 损失补偿原则的派生原则","t":"s","q":"对于重复保险，按照（    ），各国保险法立法都规定，投保人有义务将重复保险的有关情况告知保险人。","o":["保险利益原则","最大诚信原则","分摊原则","损失补偿原则"],"a":"B","e":"B正确。重复保险的投保人负有将重复保险的有关情况通知各保险人的义务，这是最大诚信原则中告知义务的体现；其他三项原则都不产生该告知义务。"},{"id":543,"ch":3,"kp":"4.3 损失补偿原则的派生原则","t":"s","q":"在重复保险情况下，对于损失后的赔款如何在保险人之间进行分摊，主要的分摊方式不包括（    ）。","o":["固定责任制","比例责任制","限额责任制","顺序责任制"],"a":"A","e":"A正确。固定责任制不是重复保险的法定分摊方式；比例责任制、限额责任制和顺序责任制才是三种基本分摊方法，分别按保额比例、单独责任限额比例和先后顺序分摊。"},{"id":544,"ch":3,"kp":"4.3 损失补偿原则的派生原则","t":"s","q":"在重复保险的分摊原则中，（    ）是指各保险人按其所承保的保险金额与所有保险人承保的保险金额的总和的比例来分摊赔偿责任。","o":["比例责任制","限额责任制","定值责任制","顺序责任制"],"a":"A","e":"A正确。比例责任制按各保险人承保的保险金额占全部保额总和的比例分摊赔款，各保险人赔款合计不超过实际损失；限额责任制则按单独承保时的责任限额比例分摊。"},{"id":545,"ch":3,"kp":"4.3 损失补偿原则的派生原则","t":"s","q":"某企业以其价值100万元的固定资产在一段时间内先后与甲、乙两家保险公司签订了保额分别为100万元和80万元的两份财产基本险合同。保险有效期内的某日发生火灾，造成保险财产损失90万元。按照比例责任制，两家保险公司应承担的赔偿金额分别为（    ）。","o":["47.65万元；42.35万元","90万元；0万元","50万元；40万元","45万元；45万元"],"a":"C","e":"C正确。比例责任制下甲赔90×100÷180＝50万元，乙赔90×80÷180＝40万元，合计90万元不超过实际损失；A、B、D的分配结果均不符合按保额比例分摊的算法。"},{"id":546,"ch":3,"kp":"4.3 损失补偿原则的派生原则","t":"s","q":"某企业以其价值100万元的固定资产在一段时间内先后与甲、乙两家保险公司签订了保额分别为100万元和80万元的两份财产基本险合同。保险有效期内的某日发生火灾，造成保险财产损失90万元。按照比限额责任制，两家保险公司应承担的赔偿金额分别为（    ）。","o":["47.65万元；42.35万元","90万元；0万元","50万元；40万元","45万元；45万元"],"a":"A","e":"A正确。限额责任制先算各保险人单独承保时的责任，甲90万元、乙80万元，再按责任限额比例分摊：甲90×90÷170≈47.65万元，乙90×80÷170≈42.35万元。"},{"id":547,"ch":3,"kp":"4.3 损失补偿原则的派生原则","t":"s","q":"某企业以其价值100万元的固定资产在一段时间内先后与甲、乙两家保险公司签订了保额分别为100万元和80万元的两份财产基本险合同。保险有效期内的某日发生火灾，造成保险财产损失90万元。按照顺序责任制，两家保险公司应承担的赔偿金额分别为（    ）。","o":["47.65万元；42.35万元","90万元；0万元","50万元；40万元","45万元；45万元"],"a":"B","e":"B正确。顺序责任制按合同签订或出单的先后顺序赔偿，甲先赔，其保额100万元足以覆盖90万元损失，故甲赔90万元，乙不再赔偿，乙为0。"},{"id":548,"ch":3,"kp":"4.3 损失补偿原则的派生原则","t":"s","q":"在重复保险的情况中，我国《保险法》规定一般采用（    ）的分摊方法。","o":["比例责任制","限额责任制","顺序责任制","定值责任制"],"a":"A","e":"A正确。我国《保险法》对重复保险一般采用比例责任制，各保险人按保险金额比例分摊赔款，合计不超过保险价值；限额责任制和顺序责任制并非我国法定的一般做法。"},{"id":549,"ch":3,"kp":"4.3 损失补偿原则的派生原则","t":"s","q":"下列关于重复保险的说法，错误的是（    ）。","o":["对于重复保险，按照最大诚信原则，各国保险法立法都规定，投保人有义务将重复保险的有关情况告知保险人。否则，保险人有权解除保险合同或宣布保险合同无效","在我国重复保险一般采用按保险金额比例分摊原则进行赔偿","对于重复保险保险金额总和超过保险价值的部分，投保人无权请求各保险人按比例返还保险费","重复保险的各保险人可以按照合同约定方式进行赔偿"],"a":"C","e":"C错误，符合题意。保险金额总和超过保险价值的部分，投保人可以请求各保险人按比例返还保险费；A、B、D关于告知义务、比例分摊和约定赔偿的表述均正确。"},{"id":550,"ch":3,"kp":"4.3 损失补偿原则的派生原则","t":"s","q":"定值保险中，保险金额10万元，保险事故发生时的保险标的价值6万元，则保险公司赔付（    ）。","o":["10万元","6万元","4万元","16万元"],"a":"A","e":"A正确。定值保险以合同约定的保险价值作为赔偿计算依据，全损时按保险金额赔付，即使事故发生时标的实际价值只有6万元，仍应赔10万元，属损失补偿原则的例外。"},{"id":551,"ch":3,"kp":"4.3 损失补偿原则的派生原则","t":"s","q":"某财产保险合同，保险金额50万元。在保险期限内，由于被保险人家庭成员过错致使被保险人的财产损失40万元，则正确处理方式为（    ）。","o":["保险人不必承担赔偿责任","保险人与被保险人按比例分摊损失","保险人赔偿40万元，并向被保险人的家庭成员行使代位求偿权","保险人赔偿40万元，但不能行使代位求偿权"],"a":"D","e":"D正确。家庭成员非故意造成保险标的损失，保险人赔付后不得向其行使代位求偿权，以免家庭内部追偿使被保险人实际得不到补偿；若为故意造成则不受此限。"},{"id":552,"ch":3,"kp":"4.3 损失补偿原则的派生原则","t":"s","q":"重复保险的损失分摊是在（    ）之间进行的。","o":["保险人","保险人与被保险人","被保险人","保险人与再保险人"],"a":"A","e":"A正确。重复保险的损失分摊发生在各保险人之间，通过对赔款的分摊使被保险人获得的总赔偿不超过实际损失，被保险人不参与分摊。"},{"id":553,"ch":3,"kp":"4.3 损失补偿原则的派生原则","t":"s","q":"甲、乙两家保险公司承保同一财产，甲公司保险金额4万，乙公司保险金额6万，实际损失5万，则根据限额责任制，甲公司赔偿（    ）。","o":["2.22万","2.78万","4万","5万"],"a":"A","e":"A正确。限额责任制下甲单独承保时的责任为4万元、乙为5万元，合计9万元；甲分摊5×4÷9≈2.22万元，乙分摊约2.78万元，故甲赔偿2.22万元。"},{"id":554,"ch":3,"kp":"4.3 损失补偿原则的派生原则","t":"s","q":"（  ）是指在财产保险中，保险标的由于第三者责任导致保险损失，保险人向被保险人支付保险赔款后，依法取得对第三者的索赔权","o":["推定全损","权利代位","委付","实际全损"],"a":"B","e":"B正确。保险人赔付后依法取得对第三者的索赔权，属于权利代位即代位求偿权；推定全损是损失程度，委付是取得物上代位的方式，实际全损指标的全部损毁。"},{"id":555,"ch":3,"kp":"4.3 损失补偿原则的派生原则","t":"m","q":"损失补偿原则中的代位原则的内容包括（    ）。","o":["债权代位权","物上代位权","代位追偿权","损失追偿权"],"a":"BC","e":"B、C正确。代位原则包括物上代位权与代位追偿权（权利代位）两项内容；A债权代位权、D损失追偿权都不是规范表述，代位追偿针对的是第三者的赔偿责任。"},{"id":556,"ch":3,"kp":"4.3 损失补偿原则的派生原则","t":"m","q":"损失补偿原则是适用于财产保险以及其他补偿性保险合同的一项基本原则。损失补偿原则的派生原则一般包括（    ）。","o":["保险利益原则","代位原则","共同保险原则","分摊原则"],"a":"BD","e":"B、D正确。损失补偿原则的派生原则是代位原则和分摊原则，用以防止被保险人重复获赔；A保险利益原则是独立的基本原则，C共同保险原则也不属于派生原则。"},{"id":557,"ch":3,"kp":"4.3 损失补偿原则的派生原则","t":"m","q":"在损失补偿原则的派生原则中，保险人取得代位求偿权，需要具备的前提条件包括（    ）。","o":["保险标的损失的原因是保险事故，同时又是由于第三者的行为所致","被保险人不放弃向第三者的赔偿请求权","保险赔偿金额不超过保险利益","保险人取得代位求偿权是在按照保险合同履行了赔偿责任之后"],"a":"ABD","e":"A、B、D正确。取得代位求偿权须损失由保险事故且系第三者责任所致、被保险人未放弃对第三者的请求权、保险人已实际赔付；C是赔偿限额问题，不是取得代位权的前提。"},{"id":558,"ch":3,"kp":"4.3 损失补偿原则的派生原则","t":"m","q":"下列关于代位求偿权的实施对保险双方的要求说法正确的是（    ）。","o":["就保险人而言，如果追偿所得的款额大于赔付给被保险人的款额，其超过部分可以作为利润计入资产负债表","如果被保险人在获得保险人赔偿之前放弃了向第三者请求赔偿的权利，保险公司有权利不进行赔偿","如果被保险人在获得保险人赔偿之后未经保险人同意而放弃了向保险人索赔的权利，则保险人无权行使代位求偿权","如果发生事故后，被保险人已经从第三者那里取得赔偿或者由于其过错致使保险人不能行使代位求偿权，保险人可以相应扣减保险赔偿金"],"a":"BD","e":"B、D正确。赔偿前放弃对第三者请求权，保险公司可以拒赔；被保险人已从第三者获赔或过错致代位不能，保险人可扣减赔款。A错在超额追偿款应归被保险人，C错在放弃行为无效。"},{"id":559,"ch":3,"kp":"4.3 损失补偿原则的派生原则","t":"m","q":"重复保险的分摊方法包括（    ）。","o":["定额责任制","比例责任制","限额责任制","顺序责任制"],"a":"BCD","e":"B、C、D正确。重复保险的损失分摊方法有比例责任制、限额责任制和顺序责任制三种；A定额责任制并非重复保险的分摊方法，属于干扰项。"},{"id":560,"ch":3,"kp":"4.3 损失补偿原则的派生原则","t":"m","q":"代位求偿权的适用范围包括（    ），","o":["医疗费用保险","年金保险","责任保险","企业财产保险"],"a":"ACD","e":"A、C、D正确。代位求偿权适用于财产保险以及医疗费用保险等补偿性保险，故医疗费用保险、责任保险、企业财产保险均可适用；B年金保险属定额给付，不适用代位求偿。"},{"id":561,"ch":3,"kp":"4.3 损失补偿原则的派生原则","t":"j","q":"代位原则是指保险人依照法律或保险合同约定，对被保险人因保险事故发生所遭受的损失进行赔偿后，依法取得向对此损失负有责任的第三者进行求偿的权利或取得被保险人对受损的保险标的的所有权。","o":[],"a":"T","e":"正确。代位原则包含代位求偿权与物上代位权：保险人赔偿后依法取得向责任第三者求偿的权利，或取得受损保险标的的所有权，题干表述与定义一致。"},{"id":562,"ch":3,"kp":"4.3 损失补偿原则的派生原则","t":"j","q":"损失补偿原则的派生原则包括物上代位原则和分摊原则。","o":[],"a":"F","e":"错误。损失补偿原则的派生原则是代位原则和分摊原则；物上代位原则只是代位原则的组成部分，题干以部分代替整体，遗漏了代位原则。"},{"id":563,"ch":3,"kp":"4.3 损失补偿原则的派生原则","t":"j","q":"代位求偿权是一种权利即所有权的代位。","o":[],"a":"F","e":"错误。代位求偿权是债权的代位即权利代位，转移的是请求第三者赔偿的权利；物上代位才是所有权的代位，题干把两种代位混为一谈。"},{"id":564,"ch":3,"kp":"4.3 损失补偿原则的派生原则","t":"j","q":"房东为便于房屋的出租，在租凭合同中同意对承租人房屋损坏免责，在为房屋投保时得到了保险人的认可，如果因为承租人的过失而使该房屋发生损失，保险人赔偿房东后可向承租人追偿损失。","o":[],"a":"F","e":"错误。房东已在租赁合同中同意对承租人损坏房屋免责并经保险人认可，等于事先放弃了对承租人的赔偿请求权，保险人赔付后不得再向承租人追偿。"},{"id":565,"ch":3,"kp":"4.3 损失补偿原则的派生原则","t":"j","q":"如果保险人向第三者追偿所得的款额大于赔付给被保险人的款额，其超过部分应归还给被保险人。","o":[],"a":"T","e":"正确。代位求偿以赔偿金额为限，保险人追偿所得超过其赔付额的部分应归还被保险人，因为该部分属于被保险人尚未获得补偿的损失。"},{"id":566,"ch":3,"kp":"4.3 损失补偿原则的派生原则","t":"j","q":"如果被保险人在获得保险人赔偿之前放弃了向第三者请求赔偿的权利，那么，就意味着他放弃了向保险人索赔的权利。","o":[],"a":"T","e":"正确。被保险人在获赔前放弃对第三者的赔偿请求权，保险人赔付后将无法代位求偿，因此该行为视为同时放弃向保险人索赔的权利，保险人可不承担赔偿责任。"},{"id":567,"ch":3,"kp":"4.3 损失补偿原则的派生原则","t":"j","q":"如果被保险人在获得保险人赔偿之后未经保险人同意而放弃了对第三者请求赔偿的权利，该行为无效。","o":[],"a":"T","e":"正确。被保险人获赔后，对第三者的赔偿请求权已在赔偿金额范围内转移给保险人，未经保险人同意放弃该权利的行为无效，保险人仍可行使代位求偿权。"},{"id":568,"ch":3,"kp":"4.3 损失补偿原则的派生原则","t":"j","q":"如果发生事故后，被保险人已经从第三者那里取得赔偿或者由于其过错致使保险人不能行使代位求偿权，保险人可以相应扣减保险赔偿金。","o":[],"a":"T","e":"正确。被保险人已从第三者取得赔偿，或因其过错致使保险人不能行使代位求偿权的，保险人可以相应扣减保险赔偿金，以免被保险人重复获利或损害保险人权益。"},{"id":569,"ch":3,"kp":"4.3 损失补偿原则的派生原则","t":"j","q":"代位求偿权一般不适用于人身保险，包括人寿保险，人身意外伤害保险以及医疗费用补偿性保险。","o":[],"a":"F","e":"错误。代位求偿权一般不适用于人寿保险等定额给付性人身保险，但医疗费用补偿性保险具有补偿性质，可以适用代位求偿，题干将其一并排除是错误的。"},{"id":570,"ch":3,"kp":"4.3 损失补偿原则的派生原则","t":"j","q":"物上代位权的取得一般通过委付实现。委付不得附有附加条件。","o":[],"a":"T","e":"正确。物上代位权的取得一般通过委付实现，被保险人须将保险标的的一切权利转移给保险人；委付不得附有条件，也不得仅就部分标的提出。"},{"id":571,"ch":3,"kp":"4.3 损失补偿原则的派生原则","t":"j","q":"物上代位是一种债权的代位。","o":[],"a":"F","e":"错误。物上代位是保险人对受损保险标的的所有权代位，取得的是标的物所有权；债权代位对应的是代位求偿权，题干混淆了物上代位与权利代位。"},{"id":572,"ch":3,"kp":"4.3 损失补偿原则的派生原则","t":"j","q":"我国《保险法》规定，重复保险的保险金额总和超过保险价值的，我国一般采用限额责任制的分摊方法。","o":[],"a":"F","e":"错误。我国《保险法》规定重复保险的保险金额总和超过保险价值的，各保险人按保险金额比例承担赔偿责任，即采用比例责任制，而不是限额责任制。"},{"id":573,"ch":3,"kp":"4.4 损失补偿原则的例外情况","t":"s","q":"下列情况中，适用于损失补偿原则的是（    ）。","o":["定值保险","重置成本保险","人寿保险","责任保险"],"a":"D","e":"D正确。责任保险属财产性保险，以被保险人的实际赔偿责任为补偿对象，适用损失补偿原则；定值保险、重置成本保险是补偿原则的例外，人寿保险实行定额给付。"},{"id":574,"ch":3,"kp":"4.4 损失补偿原则的例外情况","t":"j","q":"定值保险中，保险金额10万元，保险事故发生时保险标的价值6万元，保险公司赔付6万元。","o":[],"a":"F","e":"错误。定值保险按合同约定的保险价值即保险金额10万元计算赔偿，全损时赔10万元，不因事故发生时标的实际价值仅6万元而减少。"},{"id":575,"ch":3,"kp":"4.4 损失补偿原则的例外情况","t":"j","q":"重置成本保险不适用于损失补偿原则。","o":[],"a":"T","e":"正确。重置成本保险按重置或重建所需成本赔偿，赔付额可能高于标的的实际价值，突破了以实际损失为限的补偿要求，属于损失补偿原则的例外。"},{"id":576,"ch":4,"kp":"","t":"s","q":"保险经营的原则是指保险企业从事保险经济活动的行为准则，由于其自身的特性，保险经营既要遵循一般企业的经营原则，又要遵守保险企业经营的特殊原则，其中不包括（    ）。","o":["风险大量原则","风险选择选择","风险测度原则","风险分散原则"],"a":"C","e":"C。保险经营的特殊原则是风险大量、风险选择和风险分散三项，风险测度属于费率厘定与精算环节的技术要求，不是经营原则；A、B、D均为教材所列原则，故不选。"},{"id":577,"ch":4,"kp":"","t":"s","q":"保险费率是保险费与保险金额的比例。保险费率的厘定方法不包括（    ）。","o":["观察法","表定法","分类法","增减法"],"a":"B","e":"B。费率厘定方法分为观察法、分类法和增减法三类，表定法只是增减法中的一种具体做法，与三者不是并列关系；A、C、D恰为三大类方法。"},{"id":578,"ch":4,"kp":"","t":"s","q":"（    ）是保险公司按法律规定为在保险合同有效期内履行赔偿或给付保险金义务而将保险费予以提存的资金。","o":["公积金","保险金额","保险责任准备金","保险赔付准备金"],"a":"C","e":"C。保险责任准备金是保险公司依法为履行合同有效期内赔偿或给付义务而从保费中提存的资金。公积金来自税后利润，保险金额是赔付限额，赔付准备金不是规范术语。"},{"id":579,"ch":4,"kp":"","t":"s","q":"（    ）是指保险公司为尚未结案的赔案而提取的准备金。","o":["未到期责任准备金","保费不足准备金","总准备金","未决赔款准备金"],"a":"D","e":"D。未决赔款准备金针对已发生但尚未结案的赔案，按估计赔款提取；未到期责任准备金对应未满期保单，总准备金用于巨灾等，保费不足准备金用于费率不足，均与未决赔案不符。"},{"id":580,"ch":4,"kp":"","t":"s","q":"保险资金的性质决定了其运用必须遵守的原则，其中不包括（    ）。","o":["安全性原则","稳健性原则","收益性原则","流动性原则"],"a":"B","e":"B。保险资金运用须遵守安全性、流动性和收益性三原则，稳健性不是教材列明的运用原则。安全性保证本金完整，流动性保证及时赔付，收益性提高盈利能力。"},{"id":581,"ch":4,"kp":"","t":"s","q":"在保险资金运营的基本原则中，保险资金的运用首先必须满足的原则是（    ）。","o":["安全性原则","流动性原则","收益性原则","稳健性原则"],"a":"A","e":"A。保险资金主要来自责任准备金，是未来赔付的资金来源，一旦本金受损就难以履行给付义务，因此安全性是首要前提，流动性、收益性须在安全基础上兼顾。"},{"id":582,"ch":4,"kp":"","t":"s","q":"存款、贷款、有价证券以及不动产构成了现代发达国际保险资金运用的四种基本形式。一般来说，在资金运用结构上，保险资金运用以（    ）为主。","o":["存款","贷款","有价证券","不动产"],"a":"C","e":"C。现代保险资金运用以有价证券为主，因其品种多、期限可搭配、流动性较好且收益相对稳定；存款收益低，贷款和不动产占比小、变现慢，均非主要形式。"},{"id":583,"ch":4,"kp":"","t":"s","q":"下列关于保险经营特征说法错误的是（    ）。","o":["以特定风险的存在为前提","以风险的不确定性为条件","以大数法则为数理基础","以经济补偿和给付为基本功能"],"a":"B","e":"B。保险经营以特定风险存在为前提，以风险的可测性为条件，以大数法则为数理基础，以经济补偿和给付为基本功能。风险的不确定性正是要靠大数法则消除，不能作为经营条件，故B错误。"},{"id":584,"ch":4,"kp":"","t":"s","q":"保险经营的首要原则为（    ）。","o":["风险分散原则","风险大量原则","风险选择原则","风险集合原则"],"a":"B","e":"B。风险大量原则要求保险人在可保风险范围内尽力承保更多风险和标的，以形成足够风险单位、发挥大数法则作用，因而是保险经营的首要原则，分散与选择须建立在此基础上。"},{"id":585,"ch":4,"kp":"","t":"s","q":"（    ）是指以保险为商品，以市场为中心，以满足被保险人需要为目的，实现保险企业目标的一系列整体活动。","o":["保险经营","保险推销","保险营销","保险管理"],"a":"C","e":"C。保险营销是以保险为商品、以市场为中心、以满足被保险人需要为目的，实现保险企业目标的整体活动。保险经营范围更宽，保险推销只是营销的一个环节，管理一词也未体现市场导向。"},{"id":586,"ch":4,"kp":"","t":"s","q":"从经营财产保险和人寿保险的共同特征来看，其营销策略都应包括三个方面的内容，即目标市场策略，营销组合策略和（    ）。","o":["竞争策略","销售策略","售后服务管理策略","投资策略"],"a":"A","e":"A。财产保险与人寿保险营销策略的共同内容包括目标市场策略、营销组合策略和竞争策略，三者分别解决为谁服务、怎样服务和如何取胜的问题，售后服务管理属于营销组合的执行环节。"},{"id":587,"ch":4,"kp":"","t":"s","q":"非寿险精算最基本的原理可简单归纳为大数法则，不属于非寿险精算基本原理的是（    ）。","o":["切比雪夫大数法则","贝努利大数法则","普阿松大数法则","辛钦大数法则"],"a":"D","e":"D。非寿险精算以切比雪夫、贝努利和普阿松三个大数法则为基本原理，分别说明平均值稳定性、频率稳定性和泊松分布下的稳定性；辛钦大数法则是一般概率论结论，不属于教材所列内容。"},{"id":588,"ch":4,"kp":"","t":"s","q":"营销组合策略是指用来满足目标市场内保险消费者需求的综合营销手段。下列不属于营销组合策略的事（    ）。","o":["险种策略","群体策略","费率策略","促销策略"],"a":"B","e":"B。营销组合策略包括险种策略、费率策略、促销策略和渠道策略等，是满足目标市场需求的手段组合；群体策略属于市场细分与目标市场选择范畴，不在营销组合之列。"},{"id":589,"ch":4,"kp":"","t":"m","q":"下列关于保险经营的特征说法正确的是（    ）。","o":["保险经营资产具有负债性","与其他商品成本计算相比较，保险经营成本更易确定","保险经营具有分散性和广泛性","保险经营活动是一种特殊的劳务活动"],"a":"ACD","e":"ACD。保险经营资产主要来自保费和责任准备金，具有负债性；成本因赔付不确定而难以事先确定，故B错误；经营对象分散广泛，活动本身是提供风险保障的特殊劳务，A、C、D正确。"},{"id":590,"ch":4,"kp":"","t":"m","q":"保险经营原则是指保险企业从事保险经济活动的行为准则，包括（    ）。","o":["风险大量原则","风险测度原则","风险选择原则","风险分散原则"],"a":"ACD","e":"ACD。保险经营原则包括风险大量、风险选择和风险分散三项。风险测度是费率厘定与精算的技术环节，不属于经营行为准则，故B不选。"},{"id":591,"ch":4,"kp":"","t":"m","q":"从经营财产保险和人寿保险的共同特征来看，其营销策略都应包括（    ）。","o":["营业预期策略","目标市场策略","营销组合策略","竞争策略"],"a":"BCD","e":"BCD。财产险与人寿险营销策略均包括目标市场策略、营销组合策略和竞争策略。营业预期策略不是教材所列的营销策略内容，故A不选。"},{"id":592,"ch":4,"kp":"","t":"m","q":"保险经营的营销组合策略包括（    ）。","o":["目标群体策略","险种策略","费率策略","促销策略"],"a":"BCD","e":"BCD。营销组合策略由险种、费率、促销以及渠道等营销手段构成，强调以组合方式满足目标市场需求。目标群体策略属于目标市场选择，不是营销组合的组成部分。"},{"id":593,"ch":4,"kp":"","t":"m","q":"保险经营中客户关系管理技能包括（    ）。","o":["客户分类管理","客户忠诚度管理","新客户开发","客户信息资料的管理"],"a":"ABCD","e":"ABCD。客户关系管理技能贯穿客户经营全过程，包括客户分类管理、忠诚度管理、新客户开发和客户信息资料管理，四者共同支撑客户资源的维护与拓展。"},{"id":594,"ch":4,"kp":"","t":"m","q":"保险费率厘定的方法一般包括（    ）。","o":["观察法","分类法","测验法","增减法"],"a":"ABD","e":"ABD。费率厘定的一般方法为观察法、分类法和增减法。测验法不是费率厘定方法；增减法正是在分类法基础上按标的实际损失经验调整费率。"},{"id":595,"ch":4,"kp":"","t":"m","q":"属于保险费率厘定中增减法的是（    ）。","o":["表定法","经验法","追溯法","观察法"],"a":"ABC","e":"ABC。增减法是在分类法确定的费率基础上，依标的实际损失经验加以调整，具体包括表定法、经验法和追溯法。观察法是与分类法、增减法并列的另一类方法。"},{"id":596,"ch":4,"kp":"","t":"m","q":"保险人的保险资金由（    ）构成。","o":["公积金","保险责任准备金","资本金","保险基金"],"a":"CD","e":"CD。保险资金由资本金和保险基金两部分构成，资本金是股东投入的自有资本，保险基金主要来自保费及各项责任准备金。公积金属于利润积累，责任准备金是保险基金的具体形式，均非并列来源。"},{"id":597,"ch":4,"kp":"","t":"m","q":"保险资金的运营必须遵守的原则有（    ）。","o":["安全性原则","稳健性原则","流动性原则","收益性原则"],"a":"ACD","e":"ACD。保险资金运用须坚持安全性、流动性和收益性三原则，三者相互制约又需统筹兼顾。稳健性不是教材列明的资金运用原则，故B不选。"},{"id":598,"ch":4,"kp":"","t":"m","q":"保险资金运用的主要指标一般有（    ）。","o":["资金运用率","保险责任准备金计提率","保险资金运用盈利率","保费收入"],"a":"AC","e":"AC。衡量资金运用的主要指标是资金运用率和保险资金运用盈利率，前者反映可运用资金的比例，后者反映运用收益水平。准备金计提率属负债管理指标，保费收入属业务规模指标。"},{"id":599,"ch":4,"kp":"","t":"m","q":"非寿险责任准备金通常分为（    ）。","o":["未到期责任准备金","未决赔款准备金","保费不足准备金","总准备金"],"a":"ABCD","e":"ABCD。非寿险责任准备金包括未到期责任准备金、未决赔款准备金、保费不足准备金和总准备金，分别对应未满期责任、已发生未决赔案、费率不足和巨灾等异常风险。"},{"id":600,"ch":4,"kp":"","t":"m","q":"保险人的保险资金由( )构成。","o":["保险基金","资本金","损失准备金","公积金"],"a":"AB","e":"AB。保险人的保险资金由资本金和保险基金构成：资本金为自有资本，保险基金由保费收入及责任准备金形成。公积金是税后利润的积累，损失准备金不是与二者并列的资金来源。"},{"id":601,"ch":4,"kp":"","t":"j","q":"风险大量原则是指保险人在可保风险的范围内，应根据自己的承保能力，争取承保尽可能多的风险和标的，这是保险经营的首要原则。","o":[],"a":"T","e":"正确。风险大量原则要求保险人在可保风险范围内，依据自身承保能力争取承保尽可能多的风险和标的，以形成足够风险单位、发挥大数法则作用，它是保险经营的首要原则。"},{"id":602,"ch":4,"kp":"","t":"j","q":"保险人以再保险等手段使风险在空间上得以分散，同时又以提存各种准备金的制度，使风险在时间上得以分散。","o":[],"a":"T","e":"正确。再保险把风险在更大空间范围内分散，提存未到期责任准备金等则把风险在时间上分散，二者分别体现空间与时间两个维度的风险分散机制。"},{"id":603,"ch":4,"kp":"","t":"j","q":"保险推销是保险营销中的一个重要组成部分，即保险必须靠推销。","o":[],"a":"T","e":"正确。保险推销是保险营销的重要组成部分，保险产品无形、条款复杂、需求需引导，因而必须依靠主动推销；但推销只是营销环节之一，不能等同于全部营销活动。"},{"id":604,"ch":4,"kp":"","t":"j","q":"直接营销渠道一般适合于规模较大、市场占有份额较大、营销控制能力较强的公司。间接营销渠道适合于新成立的、规模较小的保险公司。","o":[],"a":"F","e":"错误。两种渠道的适用对象被说反：直接渠道由公司自设机构和人员销售，环节少、费用可控，更适合新成立或规模较小的公司；间接渠道借助代理、经纪机构铺网，需要较强营销控制能力，更适合规模较大、份额较高的公司。"},{"id":605,"ch":4,"kp":"","t":"j","q":"保险费率厘定方法中最常用、最重要的方法是增减法。","o":[],"a":"F","e":"错误。费率厘定中最常用、最重要的方法是分类法，它按风险类别分别厘定费率、应用面最广；增减法只是在分类费率基础上按实际损失经验调整，并非最常用方法。"},{"id":606,"ch":4,"kp":"","t":"j","q":"保险费由纯保险费和附加保险费构成。把纯费率和附加费率加总起来，就构成了保险费率，即营业费率。","o":[],"a":"T","e":"正确。保险费由纯保费和附加保费构成，前者对应预期赔付，后者对应费用与利润；纯费率与附加费率相加即为营业费率，也就是投保人实际适用的保险费率。"},{"id":607,"ch":4,"kp":"","t":"j","q":"未到期责任准备金是指保险公司为尚未结案的赔案而提取的准备金。","o":[],"a":"F","e":"错误。未决赔款准备金是为已发生但尚未结案的赔案提取的准备金；为保单未满期责任提取的是未到期责任准备金。题干把两者的定义混淆了。"},{"id":608,"ch":4,"kp":"","t":"j","q":"保险资金运营的流动性原则是实现保险基金数量完整、回流可靠、保证偿付的条件。","o":[],"a":"F","e":"错误。安全性原则才是实现保险基金数量完整、回流可靠、保证偿付的条件；流动性原则强调的是资产能够及时变现以满足赔付需要，二者不能互换。"},{"id":609,"ch":4,"kp":"","t":"j","q":"保险资金运营的三个基本原则之间存在一致性，但也存在一定的矛盾。","o":[],"a":"T","e":"正确。安全性、流动性和收益性三原则相互依存，安全是前提、流动是条件、收益是目的，具有一致性；但提高收益往往牺牲安全与流动性，三者又存在矛盾，需统筹兼顾。"},{"id":610,"ch":4,"kp":"","t":"j","q":"一般来说，在资金运用结构上，保险资金运用以有价证券为主。","o":[],"a":"T","e":"正确。现代保险资金运用以有价证券为主，因为证券品种丰富、期限可灵活搭配、流动性较好且收益相对稳定，存款、贷款和不动产居次要地位。"},{"id":611,"ch":4,"kp":"","t":"j","q":"所谓保险经营效益，是指以尽可能少的保险经营成本，为社会提供尽可能多的符合社会需要的保险保障服务，取得最大的有效成果。","o":[],"a":"T","e":"正确。保险经营效益就是以尽可能少的经营成本，为社会提供尽可能多符合需要的保险保障服务，并取得最大的有效成果，强调投入与产出、社会效益与经济效益的统一。"},{"id":612,"ch":5,"kp":"","t":"s","q":"保险监管机构中的第三个层次是（    ）。","o":["行政机构","立法机构","司法机构","学理机构"],"a":"A","e":"A。保险监管体系由立法、司法、行政三个层次构成：立法机构制定规则，司法机构裁决纠纷，行政机构即监管机关负责具体执行，因此第三层次是行政机构。"},{"id":613,"ch":5,"kp":"","t":"s","q":"保险监管的对象是（    ）。","o":["保险人","保险代理人","保险经纪人","以上都是"],"a":"D","e":"D。保险监管对象包括保险市场各类参与者，除保险人外，还有保险代理人、保险经纪人、保险公估机构等中介组织，故A、B、C均不全面。"},{"id":614,"ch":5,"kp":"","t":"s","q":"保险人的认可资产与实际负债之间的差额等于保险公司的（    ）。","o":["未到期责任准备金","未决赔款准备金","偿付能力额度","公积金"],"a":"C","e":"C。保险公司的偿付能力额度等于认可资产减去实际负债的差额，反映其实际偿付能力超出负债的缓冲部分。各项准备金是负债项目，公积金属于所有者权益，均不是该差额。"},{"id":615,"ch":5,"kp":"","t":"s","q":"保险公司市场行为监管的核心是（    ）。","o":["保险机构的监管","保险费率的监管","经营范围的监管","资金运用的监管"],"a":"B","e":"B。市场行为监管的核心是保险费率监管，通过审核费率是否合理、能否覆盖风险、有无不正当价格竞争来规范市场；机构监管、经营范围监管和资金运用监管属于其他监管内容。"},{"id":616,"ch":5,"kp":"","t":"m","q":"下列关于保险监管说法正确的是（    ）。","o":["保险监管的范围限于商业保险和社会保险","保险监管的内容是保险经营活动","保险监管的对象限于保险产品的供给者即保险人","在我国，保监会目前专门负责保险监督管理职能"],"a":"BD","e":"BD。保险监管的对象是保险经营活动，故B正确；我国由保险监管机构专门负责商业保险监管，D正确。监管范围限于商业保险，不含社会保险，A错误；对象还包括中介机构，C错误。"},{"id":617,"ch":5,"kp":"","t":"m","q":"下列关于保险公司市场行为的监管说法正确的有（    ）。","o":["在保险市场准入原则上，我国采用的是审批制","保险人不得兼营人身保险业务和财产保险业务。但是，经营财产保险业务的保险公司若经批准，可以经营短期健康保险业务和意外伤害保险业务","保险经营范围的监管是保险公司市场行为监管的核心内容","保险公司对每一风险单位所承担的责任，不得超过其实有资本金加公积金综合的10%；超过的部分应当办理再保险"],"a":"ABD","e":"ABD。我国市场准入采审批制，A正确；财险公司经批准可经营短期健康险和意外险，B正确；每一风险单位自留责任不得超过实有资本金与公积金之和的10%，D正确。市场行为监管的核心是费率监管，C错误。"},{"id":618,"ch":5,"kp":"","t":"j","q":"保险公司偿付能力额度等于保险人的认可资产与实际负债之间的差额。","o":[],"a":"T","e":"正确。偿付能力额度是衡量保险公司偿付能力的重要指标，等于认可资产与实际负债之间的差额，差额越大，说明公司实际偿付能力越强。"},{"id":619,"ch":5,"kp":"","t":"j","q":"保监会对保险公司的监管属于保险监管机制中的第二层次。","o":[],"a":"F","e":"错误。保险监管机制分为立法、司法、行政三个层次，保监会属于行政机构，处于第三层次；第二层次是司法机构。题干把层次顺序说错了。"},{"id":620,"ch":5,"kp":"","t":"j","q":"我国采用的保险监管模式是规范管理。","o":[],"a":"F","e":"错误。我国保险监管并非只作形式规范的准则主义管理，而是对机构准入、条款费率、偿付能力等进行实质性审查，属于实体管理即严格监管模式。"},{"id":621,"ch":6,"kp":"","t":"s","q":"（    ）是指签订保险合同的过程，即投保人和保险人双方通过协商，对保险合同的内容取得一致意见的过程。","o":["投保","承保","续保","理赔"],"a":"B","e":"B。承保是投保人与保险人协商、就合同内容取得一致并签订合同的过程。投保只是提出保险要约，核保、缴费、出单等环节完成后合同才成立，故不能选A。"},{"id":622,"ch":6,"kp":"","t":"s","q":"保险实务中，不属于承保工作一般流程的是（    ）。","o":["投保验险","风险评估","保费缴纳","出单"],"a":"C","e":"C。承保流程一般包括投保验险、风险评估、核保和出单，保费缴纳属于合同成立后的履约环节，不在承保工作流程之列。"},{"id":623,"ch":6,"kp":"","t":"s","q":"承保工作中，出单时保险合同要素需明确，保险合同的客体是（    ）。","o":["保险人","投保人","被保险人","保险利益"],"a":"D","e":"D。保险合同的主体是保险人、投保人和被保险人，客体是保险利益，即投保人对保险标的具有的法律上承认的经济利益；保险标的是保险利益的载体，不是合同客体。"},{"id":624,"ch":6,"kp":"","t":"s","q":"（    ）是保险经营过程中不容忽视的重要环节，既是提高保险企业经济效益和社会管理功能的重要途径，也是社会风险管理体系和安全体系的重要组成部分和补充。","o":["销售","承保","防灾","理赔"],"a":"C","e":"C。防灾防损通过减少风险因素、降低事故发生概率和损失程度，既降低赔付、提高保险企业经济效益，又发挥社会管理功能，是社会风险管理体系的重要补充。"},{"id":625,"ch":6,"kp":"","t":"s","q":"保险实务环节中，（    ）是指保险人与被保险人对所承保的保险标的采取措施，减少或消除风险发生的因素，防止或减少灾害事故，控制事故损失规模，从而降低保险成本，增加经济效益的一种经营活动。","o":["防灾","风险分散","风险预防","风险抑制"],"a":"A","e":"A。防灾是指保险人与被保险人针对承保标的采取措施，减少或消除风险因素、防止灾害事故、控制损失规模，以降低保险成本、提高经济效益的经营活动。"},{"id":626,"ch":6,"kp":"","t":"s","q":"根据《保险法》规定，保险人对属于保险责任的事故，在与被保险人或者受益人达成赔偿或者给付保险金的协议后（    ）内，履行赔偿或者给付保险金义务。","o":["7日","10日","15日","30日"],"a":"B","e":"B。保险法规定，保险人与被保险人或者受益人达成赔偿或者给付保险金协议后十日内，应履行赔偿或给付义务；未及时履行的还应承担相应责任，故选B。"},{"id":627,"ch":6,"kp":"","t":"s","q":"保险理赔的一般程序中，（    ）是指保险事故发生后，被保险人或受益应将事故 发生的时间、地点、原因及其他有关情况，以最快的方式通知保险人，并提出索赔请求。","o":["查勘定损","损失通知","审核保险责任","核赔"],"a":"B","e":"B。损失通知是保险事故发生后，被保险人或受益人及时将事故时间、地点、原因等情况通知保险人并提出索赔请求的环节，它是理赔程序的起点。"},{"id":628,"ch":6,"kp":"","t":"s","q":"根据《保险法》，人寿保险以外的其他保险的被保险人或者受益人，向保险人请求赔偿或给付保险金的诉讼时效期间为（    ），自其知道保险事故发生之日起计算。","o":["一年","两年","三年","四年"],"a":"B","e":"B。人寿保险以外的其他保险，被保险人或受益人请求赔偿或给付保险金的诉讼时效为两年，自其知道保险事故发生之日起计算；人寿保险的诉讼时效为五年。"},{"id":629,"ch":6,"kp":"","t":"m","q":"保险实务中，控制保险责任是承保时的基本要求，控制保险责任包括（    ）。","o":["控制逆选择","控制道德风险","控制心理风险因素","控制承保能力"],"a":"AD","e":"AD。控制保险责任主要从控制逆选择和控制承保能力两方面入手：前者防止高风险标的集中投保，后者使自留责任与资本实力相匹配。道德风险和心理风险是核保评估的风险因素，不属于控制保险责任的手段。"},{"id":630,"ch":6,"kp":"","t":"m","q":"保险实务环节中，承保工作的一般流程包括（    ）。","o":["投保验险","风险评估","保费缴纳","出单"],"a":"ABD","e":"ABD。承保工作一般流程包括投保验险、风险评估和出单，三者构成从受理投保到签发保单的完整过程。保费缴纳属于合同履行事项，不是承保流程的组成环节。"},{"id":631,"ch":6,"kp":"","t":"m","q":"保险实务环节中，防灾的主要方法包括（    ）。","o":["法律方法","经济方法","技术方法","社会方法"],"a":"ABC","e":"ABC。防灾的主要方法有法律方法、经济方法和技术方法，分别通过法规约束、经济杠杆和技术措施减少灾害损失。社会方法是社会防灾的整体途径，不是保险防灾的并列方法。"},{"id":632,"ch":6,"kp":"","t":"j","q":"保险人承保的目的主要有三个：一是安全地分散风险；二是保证通过风险分散获得利益；三是保证所有的保险单持有人之间的公平。","o":[],"a":"T","e":"正确。保险人承保的目的包括安全地分散风险、通过风险分散获得经营利益、保证各保单持有人之间的公平，三者分别对应风险分散、经营效益和公平负担。"},{"id":633,"ch":6,"kp":"","t":"j","q":"保险人在承保时必须评估实质风险因素、道德风险因素、心理风险因素以及法律风险因素。","o":[],"a":"T","e":"正确。承保时须评估实质风险因素、道德风险因素、心理风险因素和法律风险因素，据此判断风险程度、决定是否承保及适用费率，避免逆选择。"},{"id":634,"ch":6,"kp":"","t":"j","q":"保险防灾和社会防灾具有相同的防灾对象和防灾依据，具有不同的防灾主体和防灾手段。","o":[],"a":"F","e":"错误。保险防灾与社会防灾的防灾主体、手段不同，防灾对象和依据也不相同：保险防灾针对承保标的、以保险合同为依据，社会防灾面向全社会、以法律法规为依据，故相同对象和依据的表述有误。"}]};

/* ---------- 基础工具 ---------- */
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

function icon(name, cls = '') {
  return `<svg class="${cls}" aria-hidden="true" focusable="false"><use href="#i-${name}"></use></svg>`;
}

function esc(str) {
  return String(str == null ? '' : str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function debounce(fn, wait = 200) {
  let t;
  return function (...args) {
    clearTimeout(t);
    t = setTimeout(() => fn.apply(this, args), wait);
  };
}

function clamp(n, min, max) { return Math.min(max, Math.max(min, n)); }
function pct(part, all) { return all > 0 ? Math.round((part / all) * 100) : 0; }
function sum(arr, fn = x => x) { return arr.reduce((a, b) => a + fn(b), 0); }
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function sample(arr, n) { return shuffle(arr).slice(0, n); }
function unique(arr) { return Array.from(new Set(arr)); }
function range(n) { return Array.from({ length: n }, (_, i) => i); }

function todayKey(d = new Date()) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}
function shiftDay(d, delta) {
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  x.setDate(x.getDate() + delta);
  return x;
}
function fmtDuration(sec) {
  sec = Math.max(0, Math.round(sec));
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = sec % 60;
  if (h > 0) return `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
  return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
}
function fmtDate(ts, withTime = false) {
  const d = new Date(ts);
  const base = `${d.getMonth() + 1}月${d.getDate()}日`;
  return withTime ? `${base} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}` : base;
}
function fmtFullDate(d = new Date()) {
  const week = ['日', '一', '二', '三', '四', '五', '六'][d.getDay()];
  return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日 星期${week}`;
}
function daysUntil(dateStr) {
  if (!dateStr) return null;
  const target = new Date(dateStr + 'T00:00:00');
  if (isNaN(target)) return null;
  const now = new Date();
  const start = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.ceil((target - start) / 86400000);
}
function highlight(text, term) {
  const safe = esc(text);
  if (!term) return safe;
  const t = term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  try { return safe.replace(new RegExp(`(${t})`, 'gi'), '<mark>$1</mark>'); } catch (e) { return safe; }
}
function truncate(s, n) { return s.length > n ? s.slice(0, n) + '…' : s; }
function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
  return new Promise((resolve, reject) => {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); resolve(); } catch (e) { reject(e); }
    ta.remove();
  });
}
function downloadFile(filename, content, type = 'text/plain;charset=utf-8') {
  const blob = new Blob([content], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}

/* ---------- 题目模型 ---------- */
function chapterOf(q) { return CHAPTERS[q.ch]; }
function kpLabel(q) { return q.kp || (chapterOf(q).name + ' · 综合'); }
function isMulti(q) { return q.t === 'm'; }
function answerSet(a) { return new Set(String(a || '').split('').filter(Boolean)); }
function isCorrect(q, ans) {
  if (!ans) return false;
  if (q.t === 'j') return ans === q.a;
  const a = Array.from(answerSet(ans)).sort().join('');
  const b = Array.from(answerSet(q.a)).sort().join('');
  return a === b;
}
function optionText(q, letter) {
  const i = letter.charCodeAt(0) - 65;
  return q.o[i] || '';
}
function answerText(q, ans = q.a) {
  if (q.t === 'j') return ans === 'T' ? '正确' : '错误';
  const letters = Array.from(answerSet(ans)).sort();
  if (!letters.length) return '未作答';
  return letters.map(l => `${l}．${truncate(optionText(q, l), 24)}`).join('　');
}
function answerLetters(q, ans = q.a) {
  if (q.t === 'j') return ans === 'T' ? '正确' : '错误';
  return Array.from(answerSet(ans)).sort().join('、');
}
function correctOptionSummary(q) {
  if (q.t === 'j') return q.a === 'T' ? '该说法成立' : '该说法不成立';
  return q.o.filter((o, i) => answerSet(q.a).has(String.fromCharCode(65 + i))).join('；');
}
/** 选项展示顺序（支持随机选项） */
function optionList(q, perm) {
  if (q.t === 'j') {
    return [{ key: 'T', letter: 'T', text: '正确' }, { key: 'F', letter: 'F', text: '错误' }];
  }
  const order = perm && perm.length === q.o.length ? perm : range(q.o.length);
  return order.map((oi, di) => ({
    key: String.fromCharCode(65 + oi),
    letter: String.fromCharCode(65 + di),
    text: q.o[oi] || ''
  }));
}
function letterMap(q, perm) {
  const map = {};
  optionList(q, perm).forEach(o => { map[o.key] = o.letter; });
  return map;
}
function displayAnswer(q, ans, perm) {
  if (q.t === 'j') return ans === 'T' ? '正确' : '错误';
  const map = letterMap(q, perm);
  return Array.from(answerSet(ans)).sort().map(k => map[k] || k).join('、');
}
/** 将离线解析中按原始顺序书写的 A/B/C/D 映射为当前界面显示字母 */
function mapOptionLetters(text, q, perm) {
  if (!text || !perm || q.t === 'j') return text;
  const map = letterMap(q, perm);
  let out = text.replace(/(?<![A-Za-z])([A-D]{2,4})(?![A-Za-z])/g, s => s.split('').map(c => map[c] || c).sort().join(''));
  out = out.replace(/(?<![A-Za-z])([A-D])(?=[项、，,。；;：:）)」”为错对正不是与和或的．\/]|$)/g, c => map[c] || c);
  return out;
}
function qSearchBlob(q) {
  return [q.q, ...q.o, q.kp, chapterOf(q).name, TYPE_NAME[q.t]].join(' ').toLowerCase();
}

/* ---------- 本地存储 ---------- */
function clone(obj) { return JSON.parse(JSON.stringify(obj)); }
function defaultStore() {
  return {
    v: 2,
    settings: clone(DEFAULT_SETTINGS),
    prog: {},
    fav: [],
    wrong: {},
    notes: {},
    aiCache: {},
    hist: [],
    days: {},
    live: null,
    createdAt: Date.now(),
    lastActive: null
  };
}
function mergeStore(raw) {
  const base = defaultStore();
  if (!raw || typeof raw !== 'object') return base;
  const out = Object.assign(base, raw);
  out.settings = Object.assign({}, DEFAULT_SETTINGS, raw.settings || {});
  out.settings.ai = Object.assign({}, DEFAULT_SETTINGS.ai, (raw.settings && raw.settings.ai) || {});
  ['prog', 'wrong', 'notes', 'aiCache', 'days'].forEach(k => {
    if (!out[k] || typeof out[k] !== 'object') out[k] = {};
  });
  ['fav', 'hist'].forEach(k => { if (!Array.isArray(out[k])) out[k] = []; });
  return out;
}
let store = defaultStore();

function userStateKey(uid) { return STORE_PREFIX + uid; }
function readLocalStore(uid) {
  try {
    const raw = localStorage.getItem(userStateKey(uid));
    return raw ? mergeStore(JSON.parse(raw)) : null;
  } catch (e) {
    console.warn('读取用户本地数据失败', e);
    return null;
  }
}
function writeLocalStore(uid, data) {
  try {
    localStorage.setItem(userStateKey(uid), JSON.stringify(data));
    return true;
  } catch (e) {
    console.warn('写入用户本地数据失败', e);
    return false;
  }
}
function clearLocalUser(uid) {
  try {
    localStorage.removeItem(userStateKey(uid));
    localStorage.removeItem('insureCoach.cloud.meta:' + uid);
    localStorage.removeItem('insureCoach.v1:ignored:' + uid);
  } catch (e) {}
}

/* ---------- 记录答题 ---------- */
function recordAnswer(id, ans, correct) {
  const p = store.prog[id] || { s: 0, r: 0, c: 0, t: 0 };
  p.s += 1;
  if (correct) p.r += 1;
  p.c = correct ? p.c + 1 : 0;
  p.la = ans || '';
  p.ok = !!correct;
  p.t = Date.now();
  store.prog[id] = p;

  if (!correct) {
    store.wrong[id] = { n: ((store.wrong[id] && store.wrong[id].n) || 0) + 1, t: Date.now(), la: ans || '' };
  } else if (p.c >= 2) {
    delete store.wrong[id];
  }

  const k = todayKey();
  const day = store.days[k] || { n: 0, r: 0 };
  day.n += 1;
  if (correct) day.r += 1;
  store.days[k] = day;
  store.lastActive = Date.now();
  save();
}

/* ---------- 统计 ---------- */
function globalStats() {
  const ids = Object.keys(store.prog);
  const answered = ids.length;
  let attempts = 0, rights = 0, mastered = 0;
  ids.forEach(id => {
    const p = store.prog[id];
    if (!p) return;
    attempts += p.s || 0;
    rights += p.r || 0;
    if ((p.c || 0) >= 2) mastered += 1;
  });
  return {
    answered,
    unanswered: TOTAL - answered,
    attempts,
    rights,
    accuracy: attempts ? rights / attempts : 0,
    mastered,
    coverage: answered / TOTAL,
    wrong: Object.keys(store.wrong).length,
    fav: store.fav.length,
    streak: computeStreak(),
    today: store.days[todayKey()] || { n: 0, r: 0 }
  };
}

function chapterStats(chId) {
  const qs = QS.filter(q => q.ch === chId);
  let seen = 0, attempts = 0, rights = 0, mastered = 0;
  qs.forEach(q => {
    const p = store.prog[q.id];
    if (!p) return;
    seen += 1;
    attempts += p.s || 0;
    rights += p.r || 0;
    if ((p.c || 0) >= 2) mastered += 1;
  });
  return {
    total: qs.length, seen, attempts, rights, mastered,
    coverage: qs.length ? seen / qs.length : 0,
    accuracy: attempts ? rights / attempts : 0
  };
}

function typeStats() {
  const out = {};
  TYPE_ORDER.forEach(t => {
    const qs = QS.filter(q => q.t === t);
    let seen = 0, attempts = 0, rights = 0;
    qs.forEach(q => {
      const p = store.prog[q.id];
      if (!p) return;
      seen += 1; attempts += p.s || 0; rights += p.r || 0;
    });
    out[t] = { total: qs.length, seen, attempts, rights, accuracy: attempts ? rights / attempts : 0 };
  });
  return out;
}

function kpStats() {
  const map = new Map();
  QS.forEach(q => {
    if (!q.kp) return;
    const key = q.ch + '|' + q.kp;
    if (!map.has(key)) map.set(key, { ch: q.ch, kp: q.kp, total: 0, seen: 0, attempts: 0, rights: 0 });
    const row = map.get(key);
    row.total += 1;
    const p = store.prog[q.id];
    if (p) { row.seen += 1; row.attempts += p.s || 0; row.rights += p.r || 0; }
  });
  return Array.from(map.values()).map(r => Object.assign(r, {
    accuracy: r.attempts ? r.rights / r.attempts : 0,
    coverage: r.total ? r.seen / r.total : 0
  }));
}

function weakKps(limit = 6, minAttempts = 2) {
  return kpStats()
    .filter(r => r.attempts >= minAttempts && r.accuracy < 0.85)
    .sort((a, b) => (a.accuracy - b.accuracy) || (b.attempts - a.attempts))
    .slice(0, limit);
}

function computeStreak() {
  let d = new Date();
  let key = todayKey(d);
  if (!store.days[key] || !store.days[key].n) d = shiftDay(d, -1);
  let n = 0;
  while (true) {
    key = todayKey(d);
    const day = store.days[key];
    if (!day || !day.n) break;
    n += 1;
    d = shiftDay(d, -1);
    if (n > 3650) break;
  }
  return n;
}

function dailyGoalInfo() {
  const today = store.days[todayKey()] || { n: 0, r: 0 };
  const goal = Math.max(1, store.settings.dailyGoal || 30);
  return { today, goal, progress: clamp(today.n / goal, 0, 1), done: today.n >= goal };
}

    { id: 'chapter', name: '全章通关', desc: '七个章节全部练过', icon: 'layers', got: chapterAll },

/* ---------- 组卷 ---------- */
function questionsOfChapter(chId) { return QS.filter(q => q.ch === chId); }
function idsOfChapter(chId) { return questionsOfChapter(chId).map(q => q.id); }

function buildSmartSet(n) {
  n = clamp(n || 20, 1, TOTAL);
  const wrong = Object.keys(store.wrong).map(Number).filter(id => QBYID.has(id));
  const unseen = QS.filter(q => !store.prog[q.id]).map(q => q.id);
  const weak = QS.filter(q => {
    const p = store.prog[q.id];
    return p && p.s >= 2 && (p.r / p.s) < 0.72;
  }).map(q => q.id);
  const picked = [];
  const push = (ids, count) => {
    sample(ids.filter(id => !picked.includes(id)), count).forEach(id => picked.push(id));
  };
  push(wrong, Math.ceil(n * 0.3));
  push(unseen, Math.ceil(n * 0.45));
  push(weak, Math.ceil(n * 0.15));
  if (picked.length < n) {
    const rest = QS.map(q => q.id).filter(id => !picked.includes(id));
    push(rest, n - picked.length);
  }
  return shuffle(picked).slice(0, n);
}

function buildChapterSet(chId, type, count) {
  let qs = questionsOfChapter(chId);
  if (type && type !== 'all') qs = qs.filter(q => q.t === type);
  let ids = qs.map(q => q.id);
  if (count && count !== 'all') ids = sample(ids, Math.min(count, ids.length));
  return ids;
}

const mqDark = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
function globalUI() {
  try { return JSON.parse(localStorage.getItem(UI_THEME_KEY) || '{}') || {}; } catch (e) { return {}; }
}
function themeSetting() {
  if (activeUser) return store.settings.theme || 'auto';
  return globalUI().theme || 'auto';
}
function resolvedTheme() {
  const t = themeSetting();
  if (t === 'auto') return mqDark && mqDark.matches ? 'dark' : 'light';
  return t;
}
function applyTheme() {
  const theme = resolvedTheme();
  document.documentElement.setAttribute('data-theme', theme);
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', theme === 'dark' ? '#080e1b' : '#f3f5f9');
  try {
    const ui = globalUI();
    ui.theme = themeSetting();
    ui.fontSize = activeUser ? (store.settings.fontSize || 15) : (ui.fontSize || 15);
    localStorage.setItem(UI_THEME_KEY, JSON.stringify(ui));
  } catch (e) {}
}
function applyFontSize() {
  const n = store.settings.fontSize || 15;
  document.body.style.fontSize = n + 'px';
  const map = {
    14: { q: '16px', o: '12.5px' },
    17: { q: '19.5px', o: '15px' },
    19: { q: '21px', o: '16.5px' }
  };
  const v = map[n];
  const rootStyle = document.documentElement.style;
  if (v) {
    rootStyle.setProperty('--q-size', v.q);
    rootStyle.setProperty('--opt-size', v.o);
  } else {
    rootStyle.removeProperty('--q-size');
    rootStyle.removeProperty('--opt-size');
  }
}
if (mqDark && mqDark.addEventListener) {
  mqDark.addEventListener('change', () => { if (themeSetting() === 'auto') { applyTheme(); if (activeUser) render(); } });
}

/* ---------- 路由 ---------- */
function parseHash() {
  const raw = location.hash.replace(/^#\/?/, '').split('?')[0];
  return VIEW_META[raw] ? raw : 'home';
}
function navigate(view, opts = {}) {
  if (!VIEW_META[view]) view = 'home';
  const target = '#/' + view;
  if (location.hash === target) {
    if (opts.force !== false) render();
  } else {
    location.hash = target;
  }
}
function currentMeta() {
  const v = state.view;
  if (v === 'practice' && state.session) {
    return {
      title: state.session.kind === 'exam' ? '模拟考试进行中' : '正在练习',
      sub: state.session.title
    };
  }
  if (v === 'result' && state.result) {
    return { title: '练习报告', sub: state.result.title || '' };
  }
  return VIEW_META[v] || VIEW_META.home;
}

/* ---------- 渲染 ---------- */
let ringSeq = 0;
function ringHTML(percent, size = 120, stroke = 10, center = '', colors = null) {
  const p = clamp(percent, 0, 1);
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  const id = 'rg' + (++ringSeq);
  const from = colors && colors[0] || '#2563eb';
  const to = colors && colors[1] || '#0d9488';
  return `<div class="ring" style="width:${size}px;height:${size}px">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true">
      <defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${from}"/><stop offset="1" stop-color="${to}"/></linearGradient></defs>
      <circle class="ring-bg" cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke-width="${stroke}"/>
      <circle class="ring-fg" cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke-width="${stroke}" stroke-linecap="round"
        stroke-dasharray="${c.toFixed(2)}" stroke-dashoffset="${(c * (1 - p)).toFixed(2)}" style="stroke:url(#${id})"/>
    </svg>
    <div class="ring-center">${center}</div>
  </div>`;
}

let hasRenderedOnce = false;
function render() {
  const view = parseHash();
  state.view = view;
  applyTheme();
  applyFontSize();
  renderSidebar();
  renderTopbar();
  renderMobileNav();
  const root = $('#view');
  const map = {
    home: renderHome,
    practice: renderPracticeView,
    browse: renderBrowse,
    exam: renderExamView,
    wrong: renderWrong,
    fav: renderFav,
    stats: renderStats,
    settings: renderSettings,
    result: renderResult
  };
  const fn = map[view] || renderHome;
  let html = '';
  try {
    html = fn();
  } catch (e) {
    console.error(e);
    html = `<div class="card empty-state"><div class="empty-icon">${icon('info')}</div><h3>页面加载出错</h3><p>${esc(e.message)}</p><button class="btn btn-primary" data-act="go-home">返回首页</button></div>`;
  }
  root.innerHTML = html;
  if (hasRenderedOnce) {
    root.classList.remove('view-enter');
    void root.offsetWidth;
    root.classList.add('view-enter');
  } else {
    hasRenderedOnce = true;
  }
  window.scrollTo({ top: 0, behavior: 'auto' });
  updateTimerDisplays();
  if (typeof updateCloudUI === 'function') updateCloudUI();
  closeSidebar();
}

  const root = $('#toastRoot');

  while (root.children.length >= 4) root.firstElementChild.remove();
  const node = document.createElement('div');
  node.className = 'toast ' + (type || '');

/* ---------- 弹窗 ---------- */
let modalState = { resolve: null, onMount: null, lastFocus: null };
function openModal(opts = {}) {
  const { title = '', desc = '', body = '', actions = [{ label: '知道了', value: true, cls: 'btn-primary' }], wide = false, onMount = null, dismissible = true } = opts;
  return new Promise(resolve => {
    if (modalState.resolve) { modalState.resolve(null); }
    const root = $('#modalRoot');
    const lastFocus = document.activeElement;
    modalState = { resolve, onMount, lastFocus };
    const actionHTML = actions.map((a, i) => `<button class="btn ${a.cls || 'btn-ghost'}" data-modal-value="${i}">${esc(a.label)}</button>`).join('');
    root.innerHTML = `<div class="modal-scrim" id="modalScrim">
      <div class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true" aria-label="${esc(title)}">
        <div class="modal-head">
          <div style="flex:1"><h3>${esc(title)}</h3>${desc ? `<p>${esc(desc)}</p>` : ''}</div>
          ${dismissible ? `<button class="icon-btn sm bare" data-modal-close aria-label="关闭">${icon('close')}</button>` : ''}
        </div>
        <div class="modal-body">${body}</div>
        <div class="modal-foot">${actionHTML}</div>
      </div>
    </div>`;
    const scrim = $('#modalScrim');
    const close = (val) => {
      if (!modalState.resolve) return;
      const r = modalState.resolve;
      const restore = modalState.lastFocus;
      modalState = { resolve: null, onMount: null, lastFocus: null };
      root.innerHTML = '';
      if (restore && restore.focus && document.contains(restore)) { try { restore.focus(); } catch (e) {} }
      r(val);
    };
    root._closeModal = close;
    scrim.addEventListener('click', e => {
      if (e.target === scrim && dismissible) close(null);
    });
    scrim.querySelector('[data-modal-close]')?.addEventListener('click', () => close(null));
    scrim.querySelectorAll('[data-modal-value]').forEach(btn => {
      btn.addEventListener('click', () => {
        const i = Number(btn.dataset.modalValue);
        const act = actions[i];
        if (act && typeof act.onClick === 'function') {
          const keep = act.onClick();
          if (keep === false) return;
        }
        close(act ? act.value : null);
      });
    });
    requestAnimationFrame(() => {
      const focusEl = scrim.querySelector('.modal-body input, .modal-body textarea, .modal-body select, .modal-foot .btn-primary, .modal-foot button');
      if (focusEl) focusEl.focus();
      if (onMount) onMount(scrim, close);
    });
  });
}
function closeModal(val = null) {
  if (typeof $('#modalRoot')._closeModal === 'function') $('#modalRoot')._closeModal(val);
}
function confirmDialog(title, desc, opts = {}) {
  return openModal({
    title, desc,
    body: opts.body || '',
    actions: [
      { label: '取消', value: false, cls: 'btn-ghost' },
      { label: opts.okText || '确定', value: true, cls: opts.danger ? 'btn-danger' : 'btn-primary' }
    ]
  }).then(v => v === true);
}

function isTyping(el) {
  if (!el) return false;
  const tag = (el.tagName || '').toLowerCase();
  return tag === 'input' || tag === 'textarea' || tag === 'select' || el.isContentEditable;
}
document.addEventListener('keydown', e => {
  const typing = isTyping(document.activeElement);
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
    e.preventDefault();
    ACTIONS['open-search']();
    return;
  }
  if (e.key === 'Escape') {
    if ($('#modalRoot').children.length) { e.preventDefault(); closeModal(null); return; }
    if (state.aiOpen) { e.preventDefault(); closeAI(); return; }
    if (state.sidebarOpen) { e.preventDefault(); closeSidebar(); return; }
  }
  if (typing) return;
  if ($('#modalRoot').children.length || state.aiOpen) return;
  if (e.key === '?' && !e.ctrlKey && !e.metaKey && !e.altKey) {
    e.preventDefault();
    showShortcuts();
    return;
  }
  if ((state.view === 'practice' || state.view === 'exam') && state.session && !state.session.submitted) {
    if (handleAnswerKey(e)) return;
  }
});

/* ============================================================
   练习引擎 / 模拟考试 / 成绩报告

const MODE_META = {
  smart: { name: '智能推荐', icon: 'sparkles', desc: '优先错题与未练题，兼顾薄弱知识点' },
  chapter: { name: '章节顺序', icon: 'layers', desc: '按章节与题库顺序系统过关' },
  random: { name: '随机抽题', icon: 'refresh', desc: '从筛选范围中随机抽取，检验真实水平' },
  unmastered: { name: '未掌握', icon: 'target', desc: '只练尚未连续答对两次的题目' },
  wrong: { name: '错题重练', icon: 'xcircle', desc: '集中攻克错题本中的题目' },
  fav: { name: '收藏夹', icon: 'star', desc: '复习你标记过的重点题目' }
};

function currentQuestion() {
  if (!state.session) return null;
  return QBYID.get(state.session.ids[state.session.i]) || null;
}
function currentQuestionId() {
  const q = currentQuestion();
  return q ? q.id : (state.review && state.review.ids ? state.review.ids[state.review.i] : null);
}
function isFav(id) { return store.fav.includes(id); }

/* ---------- 练习设置 ---------- */
function setupPool() {
  let pool = QS.slice();
  if (state.setup.ch !== 'all') pool = pool.filter(q => q.ch === state.setup.ch);
  if (state.setup.type !== 'all') pool = pool.filter(q => q.t === state.setup.type);
  return pool;
}

function buildPreview() {
  const cfg = state.setup;
  const pool = setupPool();
  const mode = cfg.mode;
  let ids = [];
  let title = MODE_META[mode].name;
  if (mode === 'smart') {
    ids = buildSmartSetFrom(pool, cfg.count);
  } else if (mode === 'chapter') {
    ids = pool.map(q => q.id);
  } else if (mode === 'random') {
    ids = pool.map(q => q.id);
  } else if (mode === 'unmastered') {
    ids = pool.filter(q => {
      const p = store.prog[q.id];
      return !p || (p.c || 0) < 2;
    }).map(q => q.id);
  } else if (mode === 'wrong') {
    ids = pool.filter(q => store.wrong[q.id]).map(q => q.id);
  } else if (mode === 'fav') {
    ids = pool.filter(q => isFav(q.id)).map(q => q.id);
  }
  if (mode === 'smart' || mode === 'random' || mode === 'unmastered' || mode === 'wrong' || mode === 'fav') {
    if (cfg.count !== 'all') ids = sample(ids, Math.min(Number(cfg.count), ids.length));
  } else if (mode === 'chapter' && cfg.count !== 'all') {
    ids = ids.slice(0, Number(cfg.count));
  }
  if (mode === 'chapter') {
    if (cfg.order === 'random') ids = shuffle(ids);
    else ids.sort((a, b) => a - b);
  } else if (mode === 'random' || mode === 'smart') {
    ids = shuffle(ids);
  } else {
    ids = shuffle(ids);
  }
  if (cfg.ch !== 'all') title += ' · ' + CHAPTERS[cfg.ch].name;
  if (cfg.type !== 'all') title += ' · ' + TYPE_NAME[cfg.type];
  return { ids, title, pool: pool.length };
}

function buildSmartSetFrom(pool, count) {
  const n = Math.min(count === 'all' ? pool.length : Number(count), pool.length);
  const ids = pool.map(q => q.id);
  const wrong = ids.filter(id => store.wrong[id]);
  const unseen = ids.filter(id => !store.prog[id]);
  const weak = ids.filter(id => {
    const p = store.prog[id];
    return p && p.s >= 2 && (p.r / p.s) < 0.72;
  });
  const picked = [];
  const take = (arr, k) => {
    sample(arr.filter(id => !picked.includes(id)), k).forEach(id => picked.push(id));
  };
  take(wrong, Math.ceil(n * 0.3));
  take(unseen, Math.ceil(n * 0.45));
  take(weak, Math.ceil(n * 0.15));
  if (picked.length < n) take(ids, n - picked.length);
  return picked.slice(0, n);
}

function renderPracticeSetup() {
  const cfg = state.setup;
  const preview = buildPreview();
  const s = globalStats();
  const weak = weakKps(4);
  const live = store.live && store.live.kind !== 'exam' ? store.live : null;

  const emptyHint = !preview.ids.length

  return `

        </div>
        <div class="chips">
          ${[10, 20, 30, 50].map(n => `<button class="chip ${cfg.count === n ? 'active' : ''}" data-act="set-count" data-count="${n}">${n} 题</button>`).join('')}
          <button class="chip ${cfg.count === 'all' ? 'active' : ''}" data-act="set-count" data-count="all">全部</button>
        </div>
      </div>
      <div class="setup-section">
        <div class="setup-label"><span class="num">4</span>答题设置</div>
        <div class="option-row"><div><div class="or-label">即时判题</div><div class="or-desc">提交后立刻显示对错、答案与解析</div></div><button class="switch" role="switch" aria-checked="${store.settings.immediate}" data-act="toggle-setting" data-key="immediate"></button></div>
        <div class="option-row" style="border-top:1px solid var(--line)"><div><div class="or-label">随机选项顺序</div><div class="or-desc">打乱 A/B/C/D，避免死记位置</div></div><button class="switch" role="switch" aria-checked="${store.settings.shuffle}" data-act="toggle-setting" data-key="shuffle"></button></div>
        <div class="option-row" style="border-top:1px solid var(--line)"><div><div class="or-label">答对自动下一题</div><div class="or-desc">答错时停留，方便查看解析</div></div><button class="switch" role="switch" aria-checked="${store.settings.autoNext}" data-act="toggle-setting" data-key="autoNext"></button></div>

        <button class="btn btn-ghost btn-lg" data-act="start-smart-20">${icon('zap')} 来 20 题</button>
      </div>

    <aside class="stack">
      <div class="card setup-summary">
        <div class="tiny muted">本组题目</div>
        <div class="ss-big">${preview.ids.length}<small> 题</small></div>
        <div class="tiny muted">${esc(preview.title)}</div>
        <ul>
          <li>${icon('clock')}预计用时<b>约 ${Math.max(1, Math.round(preview.ids.length * 0.7))} 分钟</b></li>
          <li>${icon('book')}题库覆盖<b>${pct(s.answered, TOTAL)}%</b></li>
          <li>${icon('target')}历史正确率<b>${pct(s.rights, s.attempts)}%</b></li>
        </ul>
        <button class="btn btn-ai btn-block" data-act="open-ai" ${preview.ids.length ? '' : 'disabled'}>${icon('sparkles')} 问问 AI 怎么练</button>
      </div>
      <div class="card suggest-card">
        <div class="row" style="margin-bottom:5px"><b style="font-size:12px">${icon('bulb')} 学习建议</b></div>
        ${weak.length ? weak.map(w => `<div class="suggest-item"><span class="si-dot"></span><div>「${esc(w.kp)}」正确率 ${pct(w.rights, w.attempts)}%，建议优先巩固。</div></div>`).join('') : `<div class="suggest-item"><span class="si-dot"></span><div>还没有足够数据。先完成一组 20 题，系统会根据错题自动生成薄弱点分析。</div></div>`}
        <div class="suggest-item"><span class="si-dot" style="background:var(--teal)"></span><div>连续答对 2 次的题目会自动从错题本移出，形成正向循环。</div></div>
      </div>
    </aside>
  </div>`;
}

/* ---------- 会话 ---------- */
function createSession(opts) {
  const ids = unique(opts.ids).filter(id => QBYID.has(id));
  const perm = {};
  if (store.settings.shuffle) {
    ids.forEach(id => {
      const q = QBYID.get(id);
      if (q && q.t !== 'j') perm[id] = shuffle(range(q.o.length));
    });
  }
  return {
    kind: opts.kind || 'practice',
    ids,
    i: 0,
    answers: {},
    revealed: {},
    results: {},
    flags: {},
    start: Date.now(),
    title: opts.title || '练习',
    duration: opts.duration || 0,
    perm,
    meta: opts.meta || {},
    submitted: false
  };
}

function startPractice(opts) {
  if (!opts.ids || !opts.ids.length) { toast('没有可练习的题目', 'warn'); return; }
  if (AI.open) closeAI();
  state.session = createSession(opts);
  state.result = null;
  state.review = null;
  persistSession();
  if (parseHash() === 'practice') render();
  else navigate('practice');
}

function startExamSession(opts) {
  if (!opts.ids || !opts.ids.length) { toast('没有可抽取的题目', 'warn'); return; }
  if (AI.open) closeAI();
  state.session = createSession({ ...opts, kind: 'exam', duration: opts.duration });
  state.result = null;
  state.review = null;
  persistSession();
  if (parseHash() === 'exam') render();
  else navigate('exam');
}

function persistSession() {
  if (!state.session || state.session.submitted) {
    store.live = null;
  } else {
    const s = state.session;
    store.live = {
      kind: s.kind, ids: s.ids, i: s.i, answers: s.answers, revealed: s.revealed,
      results: s.results, flags: s.flags, start: s.start, title: s.title,
      duration: s.duration, perm: s.perm, meta: s.meta, savedAt: Date.now()
    };
  }
  save();
}

function resumeLive() {
  const l = store.live;
  if (!l || !Array.isArray(l.ids) || !l.ids.length) { toast('没有可恢复的进度', 'warn'); return; }
  state.session = {
    kind: l.kind || 'practice', ids: l.ids, i: clamp(l.i || 0, 0, l.ids.length - 1),
    answers: l.answers || {}, revealed: l.revealed || {}, results: l.results || {},
    flags: l.flags || {}, start: l.start || Date.now(), title: l.title || '练习',
    duration: l.duration || 0, perm: l.perm || {}, meta: l.meta || {}, submitted: false
  };
  state.result = null;
  state.review = null;
  if (state.session.kind === 'exam') {
    if (state.session.duration && Date.now() > state.session.start + state.session.duration * 60000) {
      toast('考试时间已结束，正在自动交卷', 'warn');
      finishSession(true);
      return;
    }
    navigate('exam');
  } else {
    navigate('practice');
  }
}

function discardLive() {
  confirmDialog('放弃当前进度？', '已作答的题目仍会保留在统计中，但本组练习将无法继续。', { okText: '放弃', danger: true }).then(ok => {
    if (!ok) return;
    state.session = null;
    store.live = null;
    save();
    render();
    toast('已放弃本组练习');
  });
}

/* ---------- 运行器 ---------- */
function renderPracticeView() {
  if (state.session && !state.session.submitted) {
    if (state.session.kind === 'exam') return renderExamView();
    return renderRunner(false);
  }
  state.session = null;
  return renderPracticeSetup();
}

function renderRunner(exam) {
  const s = state.session;
  if (!s) return renderPracticeSetup();
  const q = QBYID.get(s.ids[s.i]);
  if (!q) { state.session = null; return renderPracticeSetup(); }
  const total = s.ids.length;
  const answered = Object.keys(s.answers).length;
  const revealed = !!s.revealed[q.id];
  const correctCount = Object.values(s.results).filter(Boolean).length;
  const progress = total ? ((s.i + 1) / total) * 100 : 0;
  const elapsed = (Date.now() - s.start) / 1000;
  const remaining = s.duration ? Math.max(0, s.duration * 60000 - (Date.now() - s.start)) / 1000 : 0;

  const top = exam ? `
    <div class="exam-bar">
      <div class="eb-title">${icon('clipboard')} 模拟考试<span class="pill" style="margin-left:2px">${esc(s.title)}</span></div>
      <div class="exam-timer ${remaining <= 300 ? 'warn' : ''}" id="examTimer">${icon('clock')}<span data-timer="down">${fmtDuration(remaining)}</span></div>
      <div class="eb-right">
        <span class="pill">已答 <b style="color:var(--ink-2)">${answered}</b> / ${total}</span>
        <button class="btn btn-ghost btn-sm" data-act="answer-sheet">${icon('list')} 答题卡</button>
        <button class="btn btn-primary btn-sm" data-act="submit-exam">${icon('upload')} 交卷</button>
      </div>
    </div>` : `
    <div class="runner-top">
      <button class="icon-btn" data-act="exit-practice" title="退出练习" aria-label="退出练习">${icon('left')}</button>
      <div class="runner-progress">
        <div class="progress"><i style="width:${progress}%"></i></div>
        <span>第 ${s.i + 1} / ${total} 题</span>
      </div>
      <div class="runner-stats">
        <span class="pill">${icon('check')} 正确 <b>${correctCount}</b></span>
        <span class="pill">${icon('clock')} <b data-timer="up">${fmtDuration(elapsed)}</b></span>
      </div>
      <button class="btn btn-ghost btn-sm" data-act="answer-sheet">${icon('list')} 答题卡</button>
    </div>`;

  const navBtns = exam ? `
      <button class="icon-btn" data-act="toggle-flag" data-id="${q.id}" title="标记本题（F）" style="${s.flags[q.id] ? 'color:var(--amber);border-color:var(--amber-line);background:var(--amber-soft)' : ''}">${icon('flag')}</button>
      <div class="qa-right">
        <button class="btn btn-ghost" data-act="prev-q" ${s.i === 0 ? 'disabled' : ''}>${icon('left')} 上一题</button>
        <button class="btn btn-primary" data-act="next-q">${s.i === total - 1 ? '检查答题卡' : '下一题'} ${icon('right')}</button>
      </div>` : `
      <button class="icon-btn ${isFav(q.id) ? 'fav-on' : ''}" data-act="toggle-fav" data-id="${q.id}" data-fav-id="${q.id}" title="收藏（B）">${icon('star')}</button>
      <button class="btn btn-ghost btn-sm" data-act="open-ai-q" data-id="${q.id}">${icon('sparkles')} AI 解析</button>
      <div class="qa-right">
        ${s.i > 0 ? `<button class="btn btn-ghost" data-act="prev-q">${icon('left')} 上一题</button>` : ''}
        ${revealed
          ? `<button class="btn btn-primary" data-act="next-q">${s.i === total - 1 ? '完成练习' : '下一题'} ${icon('right')}</button>`
          : `<button class="btn btn-primary" data-act="submit-answer" ${s.answers[q.id] ? '' : 'disabled'}>${icon('check')} 提交答案</button>`}
      </div>`;

  return `
    ${top}
    <div class="q-layout">
      <div class="q-main">
        <article class="card q-card">
          <div class="q-meta">
            <span class="badge ${TYPE_BADGE[q.t]}">${TYPE_NAME[q.t]}</span>
            <span class="kp">${icon('book')}${esc(kpLabel(q))}</span>
            <span class="q-index">第 ${s.i + 1} 题 · 共 ${total} 题</span>
          </div>
          <h3 class="q-stem">${esc(q.q)}</h3>
          ${renderOptions(q, s, exam)}
          ${!exam && revealed ? renderVerdict(q, s) : ''}
          ${exam ? `<div class="q-hint" style="margin-bottom:10px">${icon('info')} 考试模式下不显示对错，交卷后统一批改。</div>` : ''}
          <div class="q-actions">${navBtns}</div>
        </article>
        ${!exam && revealed ? renderExplainCard(q, s.perm[q.id]) : ''}
        ${!exam && !revealed ? `<div class="card" style="padding:14px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap">
          <div class="ai-orb" style="width:30px;height:30px;border-radius:9px">${icon('sparkles')}</div>
          <div style="flex:1;min-width:160px"><b style="font-size:12px">不确定？让 AI 陪你拆解</b><p class="tiny muted" style="margin-top:1px">作答前也可以查看提示，但会失去本题的独立检验效果。</p></div>
          <button class="btn btn-soft btn-sm" data-act="open-ai-q" data-id="${q.id}">${icon('chat')} 问题目</button>
        </div>` : ''}
      </div>
      ${exam ? renderExamSide(s, q, answered, total, remaining) : renderPracticeSide(s, q, total, correctCount)}
    </div>`;
}

function renderOptions(q, s, exam) {
  const sel = answerSet(s.answers[q.id] || '');
  const revealed = !!s.revealed[q.id];
  const correctSet = answerSet(q.a);
  const list = optionList(q, s.perm[q.id]);
  if (q.t === 'j') {
    return `<div class="judge-options">${list.map(o => {
      let cls = 'judge-opt';
      if (revealed) {
        if (correctSet.has(o.key)) cls += ' correct';
        else if (sel.has(o.key)) cls += ' wrong';
      } else if (sel.has(o.key)) cls += ' selected';
      return `<button class="${cls}" data-act="choose-opt" data-key="${o.key}" ${revealed ? 'disabled' : ''}>
        ${icon(o.key === 'T' ? 'checkcircle' : 'xcircle')}<span>${o.text}</span>
      </button>`;
    }).join('')}</div>`;
  }
  return `<div class="options">${list.map(o => {
    let cls = 'opt';
    if (revealed) {
      if (correctSet.has(o.key)) cls += ' correct';
      else if (sel.has(o.key)) cls += ' wrong';
      else cls += ' dim';
    } else if (sel.has(o.key)) cls += ' selected';
    return `<button class="${cls}" data-act="choose-opt" data-key="${o.key}" ${revealed ? 'disabled' : ''}>
      <span class="letter">${o.letter}</span><span class="opt-text">${esc(o.text)}</span></button>`;
  }).join('')}</div>
  ${q.t === 'm' && !revealed ? `<div class="q-hint" style="margin-top:-8px;margin-bottom:12px">${icon('info')} 多选题：可选择多个选项，选全后提交</div>` : ''}`;
}

function renderVerdict(q, s) {
  const ok = !!s.results[q.id];
  const sel = s.answers[q.id] || '';
  const perm = s.perm[q.id];
  const correctDisp = displayAnswer(q, q.a, perm);
  const mine = sel ? displayAnswer(q, sel, perm) : '未作答';
  return `<div class="verdict ${ok ? 'ok' : 'bad'}">
    <div class="v-icon">${icon(ok ? 'check' : 'x')}</div>
    <div style="flex:1">
      <b>${ok ? '回答正确，继续保持' : '回答错误，别急，看一下解析'}</b>
      <p>正确答案：<span class="v-answer">${correctDisp}</span>${ok ? '' : ` · 你的答案：<span class="v-answer">${mine}</span>`}</p>
      <p style="margin-top:2px">${ok ? (q.t === 'm' ? '多选题全部选对，掌握得很扎实。' : '继续保持这个节奏。') : '展开下方解析，弄清每个选项对或错的原因。'}</p>
    </div>
  </div>`;
}

function relatedQuestions(q, n = 3) {
  let list = [];
  if (q.kp) list = QS.filter(x => x.id !== q.id && x.ch === q.ch && x.kp === q.kp);
  if (list.length < n) list = list.concat(QS.filter(x => x.id !== q.id && x.ch === q.ch && (!q.kp || !x.kp)));
  return list.slice(0, n);
}

function renderExplainCard(q, perm) {
  const st = store.prog[q.id] || {};
  const rel = relatedQuestions(q, 3);
  const cache = store.aiCache[aiCacheKey(q, perm)];
  const correctDisp = displayAnswer(q, q.a, perm);
  const answerDetail = q.t === 'j' ? (q.a === 'T' ? '正确' : '错误') : esc(truncate(q.o.filter((o, i) => answerSet(q.a).has(String.fromCharCode(65 + i))).join('；'), 80));
  return `<section class="card explain" id="explainCard">
    <div class="explain-head">
      <div class="explain-tabs"><button class="active">${icon('bulb')} 答案与解析</button></div>
      <div class="eh-right">${cache ? `<span class="badge badge-green">${icon('check')} AI 已缓存</span>` : ''}</div>
    </div>
    <div class="explain-body">
      <div class="answer-line">${icon('checkcircle')}<div><b>标准答案：${correctDisp}</b><span class="al-text">${answerDetail}</span></div></div>
      <div class="kp-line">${icon('book')}<span>知识点</span><span class="pill">${esc(kpLabel(q))}</span><span class="pill">${esc(chapterOf(q).name)}</span>${st.s ? `<span class="pill">历史正确率 ${pct(st.r, st.s)}%</span>` : ''}</div>
      <div class="offline-explain">
        <div class="oe-head">${icon('bulb')} 离线解析 <span class="oe-tag badge badge-green">${icon('check')} 无需联网</span></div>
        <p>${esc(mapOptionLetters(q.e || '本题暂无离线解析。', q, perm))}</p>
      </div>
      <div class="ai-cta">
        <div class="ac-orb">${icon('sparkles')}</div>
        <div style="flex:1;min-width:0"><b>还想更深入？让 AI 继续讲</b><p>基于本题离线解析，补充案例、对比和记忆口诀，并可自由追问</p></div>
        <button class="btn btn-ai btn-sm" data-act="open-ai-q" data-id="${q.id}" data-mode="explain">${icon('sparkles')} AI 追问</button>
      </div>
      ${rel.length ? `<div class="related">
        <div class="related-head">${icon('layers')} 同知识点关联题</div>
        <div class="related-list">${rel.map(r => `<button class="related-item" data-act="peek-q" data-id="${r.id}"><span class="ri-dot"></span><span>${esc(truncate(r.q, 62))}</span></button>`).join('')}</div>
      </div>` : ''}
      <div class="note-box">
        <label>${icon('note')} 我的笔记 <span class="faint" style="margin-left:auto;font-size:9.5px" id="noteSaved">${store.notes[q.id] ? '已保存' : '自动保存在本机'}</span></label>
        <textarea class="textarea" data-input="note" data-id="${q.id}" placeholder="记下易错点、口诀或自己的理解…">${esc(store.notes[q.id] || '')}</textarea>
      </div>
    </div>
  </section>`;
}

function renderPracticeSide(s, q, total, correctCount) {
  return `<aside class="q-side">
    <div class="side-card card">
      <h4>${icon('grip')} 答题卡</h4>
      <div class="palette">${paletteButtons(s, false)}</div>
      <div class="palette-legend">
        <span><i style="background:var(--green-soft);border:1px solid var(--green-line)"></i>正确</span>
        <span><i style="background:var(--red-soft);border:1px solid var(--red-line)"></i>错误</span>
        <span><i style="background:var(--primary-soft);border:1px solid color-mix(in srgb,var(--primary) 25%,transparent)"></i>当前</span>
      </div>
    </div>
    <div class="side-card card">
      <h4>${icon('zap')} 本组数据</h4>
      <div class="row-between" style="font-size:11.5px;margin-bottom:5px"><span class="muted">已作答</span><b>${Object.keys(s.answers).length} / ${total}</b></div>
      <div class="progress thin" style="margin-bottom:10px"><i style="width:${total ? Object.keys(s.answers).length / total * 100 : 0}%"></i></div>
      <div class="row-between" style="font-size:11.5px;margin-bottom:5px"><span class="muted">答对</span><b style="color:var(--green)">${correctCount}</b></div>
      <div class="row-between" style="font-size:11.5px"><span class="muted">剩余</span><b>${total - Object.keys(s.answers).length}</b></div>
    </div>
    <div class="side-card card">
      <h4>${icon('settings')} 快捷操作</h4>
      <div class="side-actions">
        <button class="btn btn-ghost btn-sm" data-act="toggle-fav" data-id="${q.id}" data-fav-id="${q.id}">${icon('star')} ${isFav(q.id) ? '取消收藏' : '收藏本题'}</button>
        <button class="btn btn-ghost btn-sm" data-act="open-ai-q" data-id="${q.id}">${icon('chat')} 追问 AI</button>
        <button class="btn btn-ghost btn-sm" data-act="exit-practice">${icon('close')} 结束本组</button>
      </div>
    </div>
  </aside>`;
}

function paletteButtons(s, exam) {
  const total = s.ids.length;
  return s.ids.map((id, idx) => {
    let cls = '';
    const cur = idx === s.i;
    const ans = s.answers[id];
    if (exam) {
      if (ans) cls = 'done';
    } else if (s.revealed[id]) {
      cls = s.results[id] ? 'ok' : 'bad';
    } else if (ans) {
      cls = 'done';
    }
    if (s.flags[id]) cls += ' flag';
    if (cur) cls += ' cur';
    return `<button class="${cls}" data-act="goto-q" data-i="${idx}" title="第 ${idx + 1} 题">${idx + 1}</button>`;
  }).join('');
}

function renderExamSide(s, q, answered, total, remaining) {

        <span><i style="background:var(--surface-3)"></i>未答</span>
        <span><i style="background:var(--amber)"></i>标记</span>
