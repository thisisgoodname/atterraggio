   ============================================================ */
function createSideScrim() {
  if ($('#sideScrim')) return;
  const scrim = document.createElement('div');
  scrim.id = 'sideScrim';
  scrim.className = 'side-scrim';
  scrim.addEventListener('click', () => closeSidebar());
  document.body.appendChild(scrim);
}

function initApp() {
  document.body.classList.remove('auth-locked');
  const gate = $('#authGate');
  if (gate) gate.hidden = true;
  applyTheme();
  applyFontSize();
  createSideScrim();
  if (!location.hash || !/^#\//.test(location.hash)) {
    try { history.replaceState(null, '', '#/home'); } catch (e) { location.hash = '#/home'; }
  }
  state.view = parseHash();
  render();
  setInterval(tick, 1000);
  window.addEventListener('hashchange', () => {
    if (AI.open) closeAI();
    render();
  });
  window.addEventListener('beforeunload', (e) => {
    if (state.session && state.session.kind === 'exam' && !state.session.submitted) {
      e.preventDefault();
      e.returnValue = '';
      return '';
    }
  });
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) updateTimerDisplays();
  });
  const tb = $('#topbar');
  if (tb) tb.addEventListener('dblclick', (e) => {
    if (e.target.closest('.tb-title')) navigate('home');
  });
  if (activeUser) {
    const welcomeKey = 'insureCoach.v2:welcomed:' + activeUser.id;
    if (!store.createdAt || Date.now() - store.createdAt < 5000) {
      if (!localStorage.getItem(welcomeKey)) {
        setTimeout(() => {
          toast('题库已就绪：634 道题 · 634 条离线解析', 'ok', 3200);
          try { localStorage.setItem(welcomeKey, '1'); } catch (e) {}
        }, 700);
      }
    }
  }
}

async function bootApp() {
  applyTheme();
  if (isLocalTestMode()) {
    activeUser = { id: 'local-test', email: 'local@test', user_metadata: { display_name: '本机测试' } };
    cloudUser = activeUser;
    const local = readLocalStore('local-test');
    store = local ? mergeStore(local) : defaultStore();
    initApp();
    return;
  }
  try {
    const result = await bootCloud();
    if (!result || !result.ok) return;
    initApp();
  } catch (e) {
    console.error('启动失败', e);
    renderAuthGate('login', e.message || '启动失败，请检查云端配置');
  }
}

window.addEventListener('error', (e) => {
  if (!e || !e.message) return;
  console.error('运行错误：', e.message);
});

bootApp();


/* ---- js/90-selftest.js ---- */
/* ============================================================
   自检（仅 ?selftest=1 时运行，不影响正常使用）
   ============================================================ */
(function () {
  if (/[?&]diag=1/.test(location.search)) {
    setTimeout(function () {
      const q = s => document.querySelector(s);
      const rect = s => { const el = q(s); return el ? Math.round(el.getBoundingClientRect().width) : null; };
      const info = {
        vw: window.innerWidth,
        doc: document.documentElement.scrollWidth,
        body: document.body.scrollWidth,
        main: rect('.main'),
        content: rect('.content'),
        view: rect('#view'),
        hero: rect('.hero'),
        stat: rect('.stat-grid'),
        topbar: rect('.topbar'),
        mq1180: matchMedia('(max-width:1180px)').matches,
        mq860: matchMedia('(max-width:860px)').matches,
        mq520: matchMedia('(max-width:520px)').matches
      };
      document.title = 'DIAG:' + JSON.stringify(info);
      const d = document.createElement('div');
      d.id = 'diag-result';
      d.textContent = JSON.stringify(info);
      document.body.appendChild(d);
    }, 900);
    return;
  }
  if (!/[?&]selftest=1/.test(location.search)) return;
  const results = [];
  let failed = 0;
  function assert(cond, msg) { if (!cond) throw new Error(msg || '断言失败'); }
  function check(name, fn) {
    try { fn(); results.push({ name, ok: true }); }
    catch (e) { failed += 1; results.push({ name, ok: false, err: e.message || String(e) }); }
  }

  function run() {
    check('题库总数与章节分布', () => {
      assert(BANK.questions.length === 634, '题目数量不是 634');
      const counts = CHAPTERS.map(c => c.count);
      assert(JSON.stringify(counts) === JSON.stringify([102, 103, 197, 173, 36, 9, 14]), '章节数量不符：' + counts.join(','));
      assert(CHAPTERS.reduce((a, c) => a + c.count, 0) === 634, '章节合计不为 634');
    });
    check('题目 ID 连续唯一', () => {
      const ids = new Set();
      QS.forEach((q, i) => { assert(q.id === i + 1, 'ID 不连续'); assert(!ids.has(q.id), 'ID 重复'); ids.add(q.id); });
    });
    check('题型与答案合法', () => {
      const tc = { s: 0, m: 0, j: 0 };
      QS.forEach(q => {
        assert(['s', 'm', 'j'].includes(q.t), '未知题型 ' + q.t);
        tc[q.t] += 1;
        assert(q.q && q.q.length > 3, '题干为空：' + q.id);
        if (q.t === 'j') {
          assert(q.a === 'T' || q.a === 'F', '判断题答案异常：' + q.id + ' ' + q.a);
          assert(Array.isArray(q.o) && q.o.length === 0, '判断题不应有选项：' + q.id);
        } else {
          assert(q.o.length === 4, '选项数量不是 4：' + q.id);
          assert(q.o.every(o => o && o.length), '存在空选项：' + q.id);
          assert(/^[A-D]{1,4}$/.test(q.a), '选择题答案异常：' + q.id + ' ' + q.a);
          assert(Array.from(answerSet(q.a)).sort().join('') === q.a, '答案未排序：' + q.id);
        }
      });
      assert(tc.s === 358 && tc.m === 107 && tc.j === 169, `题型统计异常 ${JSON.stringify(tc)}`);
    });
    check('题干无重复且全部已收录', () => {
      const seen = new Set();
      QS.forEach(q => {
        const k = q.q.replace(/\s+/g, '');
        assert(!seen.has(k), '题干重复：' + q.q.slice(0, 20));
        seen.add(k);
      });
      assert(seen.size === 634, '唯一题干数不为 634');
    });
    check('标准答案判定（正例）', () => {
      QS.forEach(q => assert(isCorrect(q, q.a), '标准答案未判对：' + q.id));
    });
    check('错误答案判定（反例）', () => {
      QS.forEach(q => {
        if (q.t === 'j') { assert(!isCorrect(q, q.a === 'T' ? 'F' : 'T'), '判断题反例失败：' + q.id); }
        else if (q.t === 's') {
          const wrong = 'ABCD'.split('').find(l => l !== q.a);
          assert(!isCorrect(q, wrong), '单选反例失败：' + q.id);
        } else {
          assert(!isCorrect(q, q.a.slice(0, 1)), '多选少选仍判对：' + q.id);
          const extra = 'ABCD'.split('').find(l => !q.a.includes(l));
          if (extra) assert(!isCorrect(q, q.a + extra), '多选多选仍判对：' + q.id);
        }
      });
    });
    check('选项随机映射', () => {
      const q = QS.find(x => x.t === 's');
      const perm = [3, 2, 1, 0];
      const list = optionList(q, perm);
      assert(list[0].key === 'D' && list[0].letter === 'A', '映射顺序错误');
      assert(list[0].text === q.o[3], '映射文本错误');
      const disp = displayAnswer(q, q.a, perm);
      const expected = perm.map((oi, di) => ({ orig: String.fromCharCode(65 + oi), letter: String.fromCharCode(65 + di) }))
        .filter(x => q.a.includes(x.orig)).map(x => x.letter).join('、');
      assert(disp === expected, `答案映射错误 ${disp} vs ${expected}`);
      assert(mapOptionLetters('A项、B项、C项、D项', q, perm) === 'D项、C项、B项、A项', '离线解析选项字母未映射');
    });
    check('判断题展示', () => {
      const q = QS.find(x => x.t === 'j');
      assert(answerLetters(q) === (q.a === 'T' ? '正确' : '错误'), '判断题文字错误');
      assert(optionList(q).length === 2, '判断题选项数量错误');
    });
    check('智能组卷范围', () => {
      const ids = buildSmartSet(20);
      assert(ids.length === 20, '智能组卷数量错误');
      assert(new Set(ids).size === 20, '智能组卷重复');
      assert(ids.every(id => QBYID.has(id)), '智能组卷含无效 ID');
    });
    check('练习设置组卷', () => {
      const backup = JSON.parse(JSON.stringify(state.setup));
      state.setup.ch = 0;
      state.setup.type = 's';
      state.setup.count = 10;
      state.setup.mode = 'chapter';
      const p = buildPreview();
      assert(p.ids.length === 10, '章节组卷数量错误');
      assert(p.ids.every(id => QBYID.get(id).ch === 0 && QBYID.get(id).t === 's'), '章节/题型筛选错误');
      state.setup.mode = 'random';
      state.setup.ch = 'all';
      state.setup.type = 'all';
      state.setup.count = 30;
      const r = buildPreview();
      assert(r.ids.length === 30 && new Set(r.ids).size === 30, '随机组卷错误');
      state.setup = backup;
    });
    check('统计计算', () => {
      const g = globalStats();
      assert(typeof g.answered === 'number' && g.answered >= 0 && g.answered <= 634, '已练数量异常');
      assert(g.coverage >= 0 && g.coverage <= 1, '覆盖率异常');
      CHAPTERS.forEach(c => {
        const s = chapterStats(c.id);
        assert(s.total === c.count, '章节统计题量错误：' + c.name);
        assert(s.accuracy >= 0 && s.accuracy <= 1, '章节正确率异常');
      });
      const ts = typeStats();
      assert(ts.s.total === 358 && ts.m.total === 107 && ts.j.total === 169, '题型统计错误');
      assert(achievements().length >= 6, '成就数量异常');
    });
    check('Markdown 渲染与转义', () => {
      const html = renderMarkdown('# 标题\n\n**加粗** 与 `代码`\n\n- 项目一\n- 项目二\n\n> 记忆口诀：风险 = 损失 + 不确定\n\n| 概念 | 含义 |\n| --- | --- |\n| 风险 | 不确定性 |\n\n```js\nconst a = 1;\n```');
      assert(html.includes('<h1>') && html.includes('<strong>') && html.includes('<li>') && html.includes('<table>') && html.includes('<pre>'), 'Markdown 结构缺失');
      assert(html.includes('<blockquote>'), 'Markdown 引用块未渲染');
      const xss = renderMarkdown('<img src=x onerror=alert(1)> <script>alert(2)<\/script>');
      assert(!xss.includes('<img') && !xss.includes('<script'), 'Markdown 转义失败');
      assert(esc('<b>"x"</b>') === '&lt;b&gt;&quot;x&quot;&lt;/b&gt;', 'esc 转义错误');
    });
    check('SQL 风格注入不受影响', () => {
      const q = QS[0];
      assert(isCorrect(q, q.a), '正常作答受影响');
    });
    check('视图渲染', () => {
      const views = [
        ['home', () => renderHome()],
        ['practice', () => renderPracticeSetup()],
        ['browse', () => renderBrowse()],
        ['wrong', () => renderWrong()],
        ['fav', () => renderFav()],
        ['stats', () => renderStats()],
        ['settings', () => renderSettings()]
      ];
      views.forEach(([name, fn]) => {
        const html = fn();
        assert(typeof html === 'string' && html.length > 100, name + ' 渲染为空');
        assert(!html.includes('[object Object]'), name + ' 出现对象字符串');
      });
    });
    check('答题运行器渲染', () => {
      const backup = state.session;
      state.session = createSession({ ids: [1, 2, 3], title: '自检', kind: 'practice' });
      try {
        const html = renderRunner(false);
        assert(html.includes(esc(QBYID.get(1).q)), '运行器未包含题干');
        assert(html.includes('提交答案') || html.includes('下一题'), '运行器操作按钮缺失');
        assert(html.includes('answer-sheet') || html.includes('答题卡'), '答题卡缺失');
      } finally { state.session = backup; }
    });
    check('题库文本完整性', () => {
      const totalChars = QS.reduce((a, q) => a + q.q.length + q.o.join('').length, 0);
      assert(totalChars >= 40000, '题库文本量异常，可能未完整嵌入');
      const idsWithQuestionMark = QS.filter(q => q.q.includes('（')).length;
      assert(idsWithQuestionMark > 100, '题干括号占位符丢失');
    });
    check('634 条离线解析完整', () => {
      assert(QS.length === 634, '题目数量异常');
      const missing = QS.filter(q => !q.e || q.e.length < 30);
      assert(missing.length === 0, `缺失或过短解析：${missing.map(q => q.id).join(',')}`);
      const bad = QS.filter(q => /[\t\n\r]/.test(q.e));
      assert(bad.length === 0, `解析含非法字符：${bad.map(q => q.id).join(',')}`);
      const total = QS.reduce((a, q) => a + q.e.length, 0);
      assert(total > 35000, '解析文本总量异常');
      const md = questionsToMarkdown(QS, '自检').join('\n');
      assert((md.match(/\*\*解析：\*\*/g) || []).length === 634, 'Markdown 导出解析数量不足');
    });

    const summary = {
      total: results.length,
      passed: results.length - failed,
      failed,
      failures: results.filter(r => !r.ok)
    };
    const box = document.createElement('div');
    box.id = 'selftest-result';
    box.setAttribute('data-status', failed ? 'FAIL' : 'PASS');
    box.style.cssText = 'position:fixed;left:0;bottom:0;z-index:9999;background:#0b1220;color:#fff;font:12px/1.6 monospace;padding:8px 12px;max-width:100%;white-space:pre-wrap';
    box.textContent = `SELFTEST:${failed ? 'FAIL' : 'PASS'} ${summary.passed}/${summary.total}` + (failed ? '\n' + JSON.stringify(summary.failures, null, 1) : '');
    document.body.appendChild(box);
    document.title = `SELFTEST:${failed ? 'FAIL' : 'PASS'}:${summary.passed}/${summary.total}`;
    console.log('SELFTEST', summary);
  }

  setTimeout(run, 120);
})();
